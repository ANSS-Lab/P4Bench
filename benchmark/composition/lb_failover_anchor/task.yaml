test_cases:
- name: first_flow_pins_b0_primary
  visibility: public
  description: 'Fresh switch: the first new connection to the VIP binds to B0 (selector 0) and leaves over B0''s primary port s1.p2 with DNAT to 10.0.2.10 and the primary next-hop MAC.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.100.1
        ttl: 64
        proto: 6
    - TCP:
        sport: 5000
        dport: 80
        flags: S
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:01
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:0a
      IP.dst:
        action: change_to
        value: 10.0.2.10
      IP.src:
        action: unchanged
      IP.ttl:
        action: decremented_by
        delta: 1
