  - hdr.ipv4.srcAddr
  sketch_type: count_min
  sketch_depth: 2
  sketch_width: 64
  counter_width_bits: 32
  max_register_cells: 4096
  hash_polynomial: crc32
  hash_independence: pairwise
  heavy_threshold: 8
  heavy_capacity: 64
  epoch_packets: 4096
  epoch_seconds: 60
  epoch_trigger: both
  workload_skew: zipfian
  rules:
  - priority: 100
    action: deny
    ipv4_src: 10.0.1.66/32
  - priority: 100
    action: permit
    ipv4_src: 10.0.1.10/32
  rule_count_capacity: 256
  match_field_breadth: tuple5
  priority_depth: 16
  default_action: permit
  policy_trigger: static_and_heavy
  allowlist_bypass: true
  mitigation_action: recolor
  scavenger_dscp: 8
  mitigation_onset: from_crossing_packet
  faithfulness: D5.1_static_combination_recolor
  access_port: 1
  core_port: 2
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
  links:
  - from: access
    to: s1.p1
  - from: s1.p2
    to: core
hosts:
  access:
    note: subscriber/client side; IPv4 sources in 10.0.1.0/24
  core:
    mac: 08:00:00:00:02:02
    note: server side (10.0.2.0/24); admitted traffic egresses here
description: |-
  An edge switch s1 polices volumetric traffic from clients toward a server
  network. It combines a data-plane heavy-hitter detector with a control-plane
  allow/block policy: high-rate sources are mitigated, but a static block list
  always drops and a static allow list always exempts. Inspired by data-plane
  DDoS-defense designs (Poseidon, NDSS 2020; Jaqen, USENIX Security 2021).

  ## Topology and roles

    - s1 has two external connection points: an ACCESS connection (s1.p1) facing
      clients (source addresses in 10.0.1.0/24), and a CORE connection (s1.p2)
      facing the server network (10.0.2.0/24). All test traffic arrives on the
      ACCESS connection destined for the server network.
    - On a forward, the packet egresses the CORE connection (s1.p2), its TTL is
      decremented by 1, and its destination Ethernet address is rewritten to the
      server-side next hop 08:00:00:00:02:02.

  ## What the switch tracks

    - For each source IP, the switch maintains a running packet count over a
      measurement window. A source is a HEAVY HITTER once its count reaches 8
      within the window. The count is updated on arrival, BEFORE the packet's
      fate is decided, so the packet that brings a source's count to 8 is itself
      treated as heavy.
    - The control plane installs a static policy list of source-based rules,
      each either ALLOW or BLOCK. In this deployment the block list contains
      source 10.0.1.66 and the allow list contains source 10.0.1.10. A source
      matching no static rule has no static opinion.

  ## Per-packet behaviour (MUST), in priority order

    1. A frame that is not IPv4 MUST be dropped (it has no source-IP to track).
    2. A packet whose source matches a static BLOCK rule MUST be dropped,
       regardless of its rate (the block list has the highest priority).
    3. A packet whose source matches a static ALLOW rule MUST be forwarded
       normally and MUST NOT be mitigated, even if that source is a heavy hitter
       (the allow list exempts a source from rate mitigation). "Forwarded
       normally" means the DSCP is preserved.
    4. A packet whose source is a heavy hitter (count >= 8) and is neither
       blocked nor allowed MUST be MITIGATED by recolor: its DSCP (the high six
       bits of the IPv4 type-of-service byte) is rewritten to the scavenger value
       8, and the packet is still forwarded on the CORE connection. The IPv4
       header checksum MUST be valid on egress after both the DSCP rewrite and
       the TTL decrement.
    5. Any other packet (source below the heavy threshold, or above it but not
       selected for mitigation by the rules above) MUST be forwarded normally
       with its DSCP preserved.

  ## Invariants (MUST)

    - The count update and heavy check MUST happen before the forwarding/drop/
      recolor decision for that packet (so the count-of-8 packet is mitigated).
    - The combined verdict MUST follow the fixed priority: block > allow-exempt
      > heavy-mitigate > forward. A source that is both allowed and heavy is
      forwarded (allow wins); a source that is both blocked and heavy is dropped
      (block wins).
    - Detection MUST isolate sources: one source's volume MUST NOT cause a
      different, low-rate source to be mitigated.
    - On a recolor, ONLY the DSCP and the TTL change; source/destination
      addresses, total length, and protocol are preserved.

  ## Joint control-plane / data-plane

  You produce both the P4 program and the table entries. The static allow/block
  list and any forwarding state are installed as entries; choose your own
  internal table and field names.
test_cases:
- name: benign_below_threshold_forward
  visibility: public
  goal_class: G1
  description: 'A single low-rate packet from an unlisted source (estimate 1 < 8) is forwarded unchanged on the core port: TTL-1, Ether.dst rewritten to the server-side next hop, IP.tos and addresses preserved.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.1.50
        dst: 10.0.2.2
        ttl: 64
        tos: 0
        proto: 6
    - TCP:
        sport: 5000
        dport: 80
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:02
      IP.src:
        action: unchanged
      IP.dst:
        action: unchanged
      IP.tos:
        action: unchanged
