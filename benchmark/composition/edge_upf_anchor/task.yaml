- name: uplink_non_gtpu_drop
  visibility: hidden
  goal_class: G3
  description: A plain (non-tunnelled) IPv4 packet arriving on the access port is dropped — access-side user traffic must arrive inside a subscriber tunnel.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.1.5
        dst: 198.51.100.9
