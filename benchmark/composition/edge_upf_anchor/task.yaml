- name: downlink_udp_encap
  visibility: hidden
  goal_class: G3
  description: A downlink UDP packet toward subscriber 10.0.9.5 is tunnelled exactly like TCP — the tunnel binding keys on the subscriber address, not the L4 type; the new outer header carries the tunnel identifier and the serving radio node address.
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:00:22
        dst: 08:00:00:00:02:02
    - IP:
        src: 198.51.100.9
        dst: 10.0.9.5
        ttl: 64
        proto: 17
    - UDP:
        sport: 53
        dport: 4000
  expected:
    behavior: forward
    output_port: s1.p1
    transformations:
      Ether.dst:
        action: change_to
        value: 08:00:00:00:01:01
      layers[1].IP.src:
        action: change_to
        value: 10.0.1.1
      layers[1].IP.dst:
        action: change_to
        value: 10.0.1.5
      layers[1].IP.chksum:
        action: checksum_valid
      layers[2].UDP.sport:
        action: change_to
        value: 2152
      layers[2].UDP.dport:
        action: change_to
        value: 2152
      layers[3].GTP_U_Header.teid:
        action: change_to
        value: 100
      layers[4].IP.dst:
        action: change_to
        value: 10.0.9.5
