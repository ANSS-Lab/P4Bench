    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.1.5
        dst: 10.0.1.1
        ttl: 64
        proto: 17
    - UDP:
        sport: 2152
        dport: 2152
    - GTP_U_Header:
        teid: 100
    - IP:
        src: 10.0.9.5
        dst: 198.51.100.9
        ttl: 1
        proto: 6
    - TCP:
        sport: 4000
        dport: 443
  expected:
