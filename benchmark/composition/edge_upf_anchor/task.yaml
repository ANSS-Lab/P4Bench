- name: acl_deny_on_inner_uplink
  visibility: hidden
  goal_class: G3
  description: An uplink tunnelled packet whose INNER subscriber source (10.0.9.66) is denied is dropped — the access policy peers through the tunnel to the user tuple, even though that tuple is buried under the tunnel header.
