task_name: resilient_lb_anchor
task_type: full_program
complexity: high
source: paper
pattern: P-ResilientLB
pattern_version: '1.0'
seed:
  bfd_udp_port: 3784
  virtual_ip: 10.0.9.9
  backend_pool:
  - 10.0.2.11
  - 10.0.2.12
  - 10.0.2.13
  backend_count: 3
  hash_modulus: 3
  pin_capacity: 256
  pin_eviction: none
  client_port: 1
  backend_port: 2
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
  links:
  - from: clients
    to: s1.p1
  - from: s1.p2
    to: backends
hosts:
  clients:
    note: client hosts in 10.0.1.0/24; ingress on s1.p1; VIP 10.0.9.9
  backends:
    note: backend pool 10.0.2.11/12/13 on s1.p2; BFD health on UDP 3784
description: |-
  Implement a health-checked load balancer for BMv2 (v1model) that tracks which
  backends are alive, steers client connections to a live backend, and survives
  backend failures — all in a single pass.

  Topology: port 1 faces the clients (10.0.1.0/24); port 2 faces the backend pool
  (10.0.2.0/24). The service is reached at a single virtual address 10.0.9.9. The
  pool has three backends — 10.0.2.11, 10.0.2.12, 10.0.2.13 — considered in that
  fixed order. Every backend starts healthy.

  Required behaviour, per IPv4 packet:

  - Health signalling. Each backend periodically announces whether it is healthy.
    A health announcement is a UDP datagram sent from a backend address to UDP
    destination port 3784, arriving on the backend-facing port (port 2). The
    announcement encodes the backend's state in its UDP source port: a UDP source
    port of zero means that backend is DOWN, and any non-zero UDP source port means
    it is UP. The load balancer records that backend's current health from this
    announcement and does not forward the announcement onward — it is consumed.

  - Backend selection. A client connection addressed to the virtual address is
    assigned a preferred backend by a fixed rule: take the connection's source IP,
    destination IP, protocol number, source port and destination port each as an
    integer, sum them, and reduce modulo 3; the result indexes the pool in its
    fixed order [10.0.2.11, 10.0.2.12, 10.0.2.13]. Every packet of the same
    connection goes to the same backend while that backend stays healthy. If a
    connection's preferred backend is not healthy, the load balancer picks the
    next healthy backend, scanning the pool forward from the preferred index in
    that fixed order and wrapping around. If no backend is healthy, the packet is
    dropped. A connection whose assigned backend later becomes unhealthy is moved
    to the next healthy backend on its following packet.

  - Delivery. A packet steered to a backend is delivered to that backend: its
    destination is set to the chosen backend's address, it leaves on the backend
    side toward the correct next hop, its hop count is decremented, and its L2/L3
    integrity is preserved. A packet with an expired hop count is dropped.

  Both the P4 program and its table entries are yours to author. The load balancer
  must behave correctly across the full lifetime of a connection: a connection
  sticks to its backend while healthy, fails over to the next healthy backend when
  its backend dies, and is dropped only when the entire pool is down.

  Non-IPv4 frames are dropped.
test_cases:
- name: lb_primary_forward
  visibility: public
  goal_class: G1
  description: 'A client connection to the virtual address (10.0.1.10:40000) is assigned to its preferred healthy backend and delivered there: the destination is rewritten to that backend, the hop count is decremented, and the frame leaves on the backend side. All backends are healthy.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:10
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.1.10
        dst: 10.0.9.9
        ttl: 64
        proto: 6
    - TCP:
        sport: 40000
        dport: 80
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:12
      IP.dst:
        action: change_to
        value: 10.0.2.12
      IP.src:
        action: unchanged
      TCP.sport:
        action: unchanged
      TCP.dport:
        action: unchanged
