- name: decap_then_route_inner
  visibility: hidden
  description: 'decap_then_route_inner.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 5e:00:00:00:00:01
        dst: aa:bb:cc:00:00:01
    - IP:
        src: 192.168.10.1
        dst: 192.168.10.254
        ttl: 64
        proto: 17
    - UDP:
        sport: 2152
        dport: 2152
        chksum: 0
    - GTPU:
        version: 1
        pt: 1
        e: 1
        msgtype: 255
        teid: 256
        length: 48
    - GTPUOpt:
        seqnum: 0
        npdu: 0
        next_ext: 133
    - GTPUPduSession:
        ext_len: 1
        pdu_type: 0
        qfi: 9
        next_ext: 0
    - IP:
        src: 10.45.0.1
        dst: 10.0.6.6
        ttl: 10
    - TCP:
        sport: 40006
        dport: 80
        flags: S
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      Ether.src:
        action: change_to
        value: aa:bb:cc:00:00:02
      Ether.dst:
        action: change_to
        value: 08:00:00:00:00:02
      IP.dst:
        action: change_to
        value: 10.0.6.6
      IP.ttl:
        action: change_to
        value: 9
