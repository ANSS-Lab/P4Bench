        src: 10.0.1.50
        dst: 198.51.100.9
        ttl: 64
        id: 0
        proto: 6
    - TCP:
        sport: 6000
        dport: 80
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:02
      IP.id:
        action: change_to
        value: 3
      IP.src:
        action: unchanged
      IP.dst:
        action: unchanged
      IP.chksum:
        action: checksum_valid
  prior_inputs:
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
