- name: ttl_zero_drop
  visibility: hidden
  goal_class: G2
  description: An IPv4 packet that arrives with an expired hop count (ttl==0) is dropped.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.1.50
        dst: 198.51.100.9
        ttl: 0
        id: 0
        proto: 6
    - TCP:
        sport: 5000
        dport: 80
  expected:
