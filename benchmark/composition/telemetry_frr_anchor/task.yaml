- name: ttl_one_forwards_zero
  visibility: hidden
  goal_class: G2
  description: A packet with ttl==1 is forwarded out the primary egress with egress ttl==0 (the hop count is decremented exactly once, never twice).
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.1.50
        dst: 198.51.100.9
        ttl: 1
        id: 0
        proto: 6
    - TCP:
        sport: 5000
        dport: 80
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:02
      IP.id:
        action: change_to
        value: 2
      IP.src:
        action: unchanged
      IP.dst:
        action: unchanged
      IP.chksum:
        action: checksum_valid
