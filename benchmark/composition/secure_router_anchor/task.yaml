- name: deny_leaves_no_state
  visibility: hidden
  goal_class: G3
  description: A denied outbound flow (10.0.1.66) installs no NAT binding, so a subsequent outside reply addressed to the pool is dropped as unsolicited — the deny short-circuits before the NAT stage.
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:00:22
        dst: 08:00:00:00:02:02
    - IP:
        src: 198.51.100.9
        dst: 203.0.113.1
        ttl: 64
        proto: 6
    - TCP:
        sport: 80
        dport: 20000
  expected:
    behavior: drop
  prior_inputs:
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
