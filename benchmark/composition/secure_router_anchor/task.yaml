- name: udp_flow_roundtrip
  visibility: hidden
  goal_class: G3
  description: A UDP outbound flow is source-NATed and its reply de-NATed exactly like TCP — translation keys on the 3-tuple (ip, port, proto), not the L4 type.
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:00:22
        dst: 08:00:00:00:02:02
    - IP:
        src: 198.51.100.9
        dst: 203.0.113.1
        ttl: 64
        proto: 17
    - UDP:
        sport: 80
        dport: 20000
  expected:
    behavior: forward
    output_port: s1.p1
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:01:01
      IP.src:
        action: unchanged
      IP.dst:
        action: change_to
        value: 10.0.1.53
      UDP.sport:
        action: unchanged
      UDP.dport:
        action: change_to
        value: 5000
  prior_inputs:
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.1.53
        dst: 198.51.100.9
        ttl: 64
        proto: 17
    - UDP:
        sport: 5000
        dport: 80
- name: inbound_no_route_after_denat
  visibility: hidden
  goal_class: G3
  description: Reverse de-NAT restores the inside destination and the LPM lookup then keys on that restored address — the inbound reply for the established flow routes to the inside port (post-NAT routing).
