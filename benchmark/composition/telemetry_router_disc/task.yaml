task_name: telemetry_router_disc
task_type: full_program
complexity: hard
source: synthesis
pattern: P-TelemetryRouter
pattern_version: '1.0'
seed: telemetry_router_disc-default
description: |
  A switch s1 is the telemetry-stamping edge router of a small network: it
  forwards IPv4 unicast traffic by longest-prefix match AND annotates the
  traffic it forwards with in-band telemetry that reflects its OWN forwarding
  decision. The load-bearing requirement is the ORDER of the two jobs — the
  telemetry record describes where the packet is being sent, so the record is
  produced only AFTER the forwarding decision is made, and a packet the router
  decides to discard is never annotated.

  Inspired by In-band Network Telemetry (p4.org INT dataplane specification)
  layered over RFC 1812 IPv4 forwarding with RFC 2992 equal-cost multipath.

  ## Topology and roles

    - s1.p1 — host h1 (10.0.1.1). Traffic from h1 enters as plain IPv4+TCP
              with NO telemetry record attached; s1 plays the telemetry
              SOURCE role for this traffic.
    - s1.p2..p5 — next-hops of the multipath group for destinations in
              10.0.2.0/24 (see the FIB below).
    - s1.p6 — next-hop for 10.0.6.0/24.
    - s1.p7 — next-hop for the 10.0.0.0/8 cover route.
    - s1.p8 — upstream device u8 (10.0.8.8). Traffic on this port already
              carries a telemetry record from an upstream source; s1 plays
              the telemetry SINK role for this traffic.
    - s1.p9 — telemetry collector (10.0.9.9). No inbound traffic is expected;
              it is the egress for the report packets the sink emits.

  ## Forwarding information base (control-plane installed)

  Longest-prefix match on the IPv4 destination address:

    - 10.0.2.0/24 → an equal-cost multipath group of FOUR next-hops on ports
                    p2, p3, p4, p5.
    - 10.0.6.0/24 → a single next-hop on port p6.
    - 10.0.0.0/8  → a single next-hop on port p7 (the less-specific cover).

  There is no default (0.0.0.0/0) route.

  ## Telemetry-record content

  Each per-hop record carries, in order: the hop's switch identifier (a 32-bit
  control-plane-assigned id — for s1 this is 7); an ingress timestamp; an
  egress timestamp; the hop latency (egress minus ingress); and the egress
  queue depth. Timestamps MUST be carried with the full 48-bit precision the
  data plane natively provides — truncating to a narrower width loses the
  upper bits. A telemetry-bearing packet is one whose TCP payload begins with
  a small record header (its first byte is the marker 0x01) followed by a
  count of how many per-hop records are stacked behind it; the original
  application payload follows the record stack. The record travels as a prefix
  of the TCP payload so the IPv4/TCP headers stay in their normal positions.

  ## Routing guards (apply to ALL traffic, before any telemetry action)

  R1. A non-IPv4 frame (ARP, IPv6, raw L2) is dropped.
  R2. An IPv4 datagram whose header is malformed (version ≠ 4, IHL < 5) is
      dropped.
  R3. An IPv4 datagram with TTL ≤ 1 is dropped (forwarding it would leave
      TTL 0); it MUST NOT be annotated.
  R4. An IPv4 datagram destined to the limited broadcast 255.255.255.255, or
      to the directed-broadcast address of a configured subnet, is dropped.
  R5. An IPv4 datagram whose destination matches NO FIB prefix is dropped; it
      MUST NOT be annotated. A dropped packet produces NO output on any port —
      in particular no telemetry record is leaked on a drop path.

  ## Forwarding + next-hop selection (for a packet that passes the guards)

  R6. Select the FIB entry by longest prefix. For a single-next-hop entry, that
      next-hop is used. For the multipath group, choose ONE member as a
      function of the packet's 5-tuple (source/destination address, protocol,
      source/destination L4 ports) such that every packet of the same flow
      maps to the SAME member, and different flows spread across the group. The
      choice MUST NOT depend on volatile fields such as TTL.
  R7. Decrement TTL by exactly one (only once, even though both the forwarding
      and telemetry steps touch the packet), rewrite Ethernet source to the
      egress port's MAC and Ethernet destination to the chosen next-hop's MAC,
      and leave IPv4 source and destination unchanged.

  ## Source role (plain traffic on port 1)

  R8. After the next-hop is chosen, attach a one-hop telemetry record carrying
      s1's values for the fields above, where the record's egress-related
      content reflects the SELECTED egress (i.e., the port the packet is
      actually forwarded on). Then forward on that egress.
  R9. Because attaching the record grows the packet and the TTL was
      decremented, the IPv4 total-length field MUST reflect the new size and
      the IPv4 header checksum MUST be valid over BOTH changes (a single
      recomputation). Forwarding a stale checksum is a defect.

  ## Sink role (telemetry-bearing traffic on port 8)

  R10. Parse the record stack and compute the maximum hop-latency across all
       records. IF that maximum is strictly greater than 1 000 000 (in the same
       unit as the records), emit ONE additional report packet on port 9
       carrying the harvested record stack to the collector.
  R11. In ALL cases (whether or not R10 fired), remove the telemetry header and
       stack so the original packet returns to its pre-telemetry shape, then
       forward that original on its FIB egress (TTL decremented, Ethernet
       rewritten). The report (when emitted) and the routed original are TWO
       separate outputs on DIFFERENT ports.

  ## Sink role, no record present

  R12. Plain IPv4+TCP arriving on port 8 with no telemetry record is forwarded
       normally on its FIB egress; no record is added or stripped.

  ## Other traffic

  R13. IPv4 that is not TCP is forwarded normally; the telemetry layer here is
       only carried over TCP.
