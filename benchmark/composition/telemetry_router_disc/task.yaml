test_cases:
- name: g1_source_push_route_singleton
  visibility: public
  description: 'Plain IPv4+TCP on the source port destined to a singleton route: the switch routes it (longest-prefix /24 over the /8 cover), decrements TTL by one, rewrites Ethernet to the next-hop, AND stamps an INT slot reflecting that egress, then forwards. IP src/dst preserved.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.6.6
        ttl: 64
        proto: 6
    - TCP:
        sport: 33000
        dport: 80
    - Raw:
        load_hex: '44415441'
  expected:
    behavior: forward
    output_port: s1.p6
    transformations:
      Ether.dst:
        action: change_to
        value: 08:00:00:00:06:01
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:06
      IP.ttl:
        action: decremented_by
        delta: 1
      IP.src:
        action: unchanged
      IP.dst:
        action: unchanged
      IP.chksum:
        action: checksum_valid
- name: g1_route_less_specific_cover
