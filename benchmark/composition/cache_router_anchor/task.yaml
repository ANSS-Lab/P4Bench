- name: deny_leaves_cache_intact
  visibility: hidden
  goal_class: G3
  description: A write from the DENIED client (10.0.1.66) to key 0x10 is dropped by the policy and therefore does NOT invalidate the cache; a later permitted read of key 0x10 still HITS and is answered locally on the client port — the deny short-circuits before the cache.
  input:
