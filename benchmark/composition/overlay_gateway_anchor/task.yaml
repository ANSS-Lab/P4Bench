- name: encap_route_keys_outer
  visibility: hidden
  goal_class: G3
  description: A permitted tenant frame whose inner destination lies outside any local route is still encapsulated and forwarded toward the tunnel peer — the outbound forwarding decision is made on the tunnel destination, not the inner destination.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:10
        dst: 08:00:00:00:01:01
    - IP:
        src: 192.168.1.11
        dst: 203.0.113.5
        ttl: 64
        proto: 17
