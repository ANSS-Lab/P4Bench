task_name: ptp_tc_disc
task_type: full_program
complexity: medium
source: rfc
pattern: P-PTPTransparentClock
pattern_version: '1.0'

seed:
  faithfulness: D5.1_udp_checksum
  step_mode: one_step
  delay_mechanism: e2e
  correction_field_faithfulness: full64_scaled_ns
  transport: udp_ipv4
  domain_handling: single_domain_any
  active_domains: [0]
  corrected_message_types: all_event
  correlation_capacity: unbounded
  link_delays: []
  link_delay_capacity: 64

scoring:
  public_weight: 0.2   # public-overfitting cannot exceed 0.2
  hidden_weight: 0.8

description: |
  A switch s1 sits on the path between a time master and a time slave and
  acts as a Precision Time Protocol (PTP, IEEE 1588) *transparent clock*.
  Its job is to make the switch's own forwarding delay invisible to the
  clocks downstream of it: for each PTP event message that transits the
  switch, s1 measures how long the message spent inside the switch (its
  *residence time*) and folds that measurement into a correction value the
  message already carries, so a downstream clock can subtract the switch's
  contribution when it computes its offset from the master. Concept
  attribution: IEEE 1588 transparent clock; the end-to-end vs peer-to-peer
  mechanism and clock-domain vocabulary follow RFC 8173 (the PTPv2 MIB).

  In this task PTP runs over UDP/IPv4 (IEEE 1588 Annex D): PTP **event**
  messages arrive as Ethernet / IPv4 / UDP with UDP destination port 319,
  and PTP **general** messages with UDP destination port 320. All other
  traffic is non-PTP.

  ## What a PTP message looks like on the wire

  After the UDP header sits a 34-byte PTP common header:

    - byte 0: a 4-bit transportSpecific/majorSdoId field, then a 4-bit
      **messageType** (the low nibble of the byte).
    - byte 1: a 4-bit minorVersionPTP, then a 4-bit versionPTP.
    - bytes 2-3: messageLength (16 bits).
    - byte 4: **domainNumber**.
    - byte 5: minorSdoId / reserved.
    - bytes 6-7: flagField (16 bits).
    - bytes 8-15: **correctionField** — a 64-bit value in units of
      2^-16 nanoseconds (i.e. the integer nanosecond count is the value
      shifted left by 16 bits).
    - bytes 16-19: a 32-bit messageTypeSpecific / **reserved** field.
    - bytes 20-29: sourcePortIdentity = an 8-byte clockIdentity followed by
      a 2-byte portNumber.
    - bytes 30-31: sequenceId (16 bits).
    - byte 32: controlField.
    - byte 33: logMessageInterval.

  The messageType nibble identifies the message:

    - **Event messages** (these carry timing that residence affects):
      Sync 0x0, Delay_Req 0x1, Pdelay_Req 0x2, Pdelay_Resp 0x3.
    - **General messages** (never corrected by a transparent clock):
      Follow_Up 0x8, Delay_Resp 0x9, Pdelay_Resp_Follow_Up 0xA,
      Announce 0xB, Signaling 0xC, Management 0xD.

  ## Topology and forwarding

  Two hosts attach to s1:

    - h1 (the master side) attaches at s1.p1; IPv4 10.0.1.1,
      MAC 08:00:00:00:01:01.
    - h2 (the slave side) attaches at s1.p2; IPv4 10.0.2.2,
      MAC 08:00:00:00:02:02.

  s1 forwards every frame — PTP or not — toward the host that owns the
  destination IPv4 address: a packet for 10.0.1.1 leaves s1.p1, a packet
  for 10.0.2.2 leaves s1.p2, and in each case the Ethernet destination is
  rewritten to that host's MAC. You provide the forwarding table and its
  entries. As a transparent clock the switch does NOT decrement the IPv4
  TTL and does NOT otherwise alter forwarded headers beyond the PTP
  correction described below.

  ## Per-packet behaviour

  For every frame s1 receives:

   1. **Non-PTP passthrough.** If the frame is not a PTP message (not an
      IPv4/UDP packet with UDP destination port 319 or 320), forward it
      normally with no PTP processing.

   2. **General messages pass through uncorrected.** A PTP message whose
      messageType is one of Follow_Up 0x8, Delay_Resp 0x9,
      Pdelay_Resp_Follow_Up 0xA, Announce 0xB, Signaling 0xC, or
      Management 0xD MUST be forwarded with its correctionField and every
      other PTP field byte-identical to the input. A transparent clock is
      transparent to these messages.

   3. **Event messages are corrected.** For every PTP event message
      (Sync 0x0, Delay_Req 0x1, Pdelay_Req 0x2, Pdelay_Resp 0x3):

        a. Measure the **residence time**: the elapsed time between the
           moment the message entered the switch and the moment it leaves
           the switch.

        b. Convert the residence time to the correctionField's units
           (2^-16 ns) and **ADD** it to the message's existing
           correctionField. The correction MUST be *added* to whatever
           value the field already holds — it MUST NOT overwrite the
           field. (The field may already carry corrections accumulated by
           upstream transparent clocks; overwriting it would discard
           them.) Use the full 64-bit field with carry; do not truncate to
           32 bits and do not drop the 2^-16-ns scale.

        c. Clear the 32-bit messageTypeSpecific / reserved field
           (bytes 16-19) to zero on the corrected message.

        d. Because the correctionField (and the reserved field) live inside
           the UDP payload, the UDP checksum is no longer valid after the
           rewrite; recompute it so the forwarded packet carries a correct
           UDP checksum.

        e. Forward the corrected message normally (per the forwarding rule
           above).

   4. **Transparency.** Non-PTP frames and PTP general messages leave the
      switch with their PTP-relevant content unchanged. Only event
      messages are corrected, and a correction never replaces the existing
      correctionField — it accumulates onto it.

topology:
  switches:
    - name: s1
      device_id: 0
      ports:
        p1: 1
        p2: 2
  links:
    - from: h1
      to: s1.p1
    - from: s1.p2
      to: h2

hosts:
  h1:
    ip: 10.0.1.1/24
    mac: 08:00:00:00:01:01
    port: s1.p1
  h2:
    ip: 10.0.2.2/24
    mac: 08:00:00:00:02:02
    port: s1.p2

custom_headers:
  - file: custom_headers.py
    class: PTP
    description: "IEEE 1588 PTP common header (34 bytes) over UDP/IPv4, ports 319/320"

# Correction-arithmetic note for the expected blocks below.
#   The correctionField is preloaded with 0x0001_0000_0000_0000 (2^48) on every
#   corrected-event case. A transparent clock ADDS the scaled residence, so the
#   output is 2^48 + (residence_ns << 16); since the v1.0 harness's in-pipeline
#   residence is small and non-deterministic, the output is matched with
#   change_to_range [2^48, 2^49]. This range robustly distinguishes the correct
#   accumulate (output >= 2^48) from the overwrite anti-pattern (output =
#   scaled_residence, which is far below 2^48 for any plausible residence). The
#   residence-MAGNITUDE-exact checks are deferred.

test_cases:

# --- G1: functional correctness ---

  - name: sync_residence_correction_additive
    visibility: public
    description: |
      A PTP Sync (messageType 0x0) over UDP/IPv4 (dst port 319) transits the
      switch from the master (h1) toward the slave (h2). The Sync arrives
      with a large NONZERO correctionField (0x0001_0000_0000_0000 — an
      upstream transparent clock's accumulation) and a nonzero reserved
      field. The switch MUST forward it out s1.p2 with the residence added
      to (not substituted for) the correctionField, and the reserved field
      cleared to zero. The large preload makes the overwrite anti-pattern
      (correctionField = residence) fall far below the accumulate floor.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            transportSpecific: 0
            messageType: 0x0
            minorVersionPTP: 0
            versionPTP: 2
            messageLength: 44
            domainNumber: 0
            flagField: 0x0200
            correctionField: 0x0001000000000000
            reserved: 0xDEADBEEF
            sequenceId: 100
            controlField: 0
            logMessageInterval: 0
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        Ether.dst: {action: change_to, value: "08:00:00:00:02:02"}
        PTP.correctionField: {action: change_to_range, min: 281474976710656, max: 562949953421312}
        PTP.reserved: {action: change_to, value: 0}

  - name: non_ptp_passthrough_unmodified
    visibility: public
    description: |
      A plain non-PTP packet (IPv4/TCP from h1 to h2) MUST be forwarded
      toward h2 (s1.p2) with the Ethernet destination rewritten to h2's MAC.
      No PTP processing applies; there is no correctionField to touch.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 6}
        - TCP:   {sport: 5000, dport: 80, flags: "S"}
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        Ether.dst: {action: change_to, value: "08:00:00:00:02:02"}
        IP.ttl: {action: unchanged}

  - name: reserved_cleared_after_correction
    visibility: public
    description: |
      A Sync with a nonzero reserved field MUST have its 32-bit
      messageTypeSpecific/reserved field cleared to zero after correction.
      A switch that forwards the event message untouched (no correction at
      all) leaves the reserved field nonzero and fails here.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            messageType: 0x0
            versionPTP: 2
            messageLength: 44
            correctionField: 0x0001000000000000
            reserved: 0x12345678
            sequenceId: 101
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.reserved: {action: change_to, value: 0}
        PTP.correctionField: {action: change_to_range, min: 281474976710656, max: 562949953421312}

  - name: announce_correction_field_untouched
    visibility: hidden
    description: |
      A PTP Announce (messageType 0xB) on the general port (320) with a
      nonzero correctionField MUST pass through with its correctionField
      byte-identical to the input. Catches a switch that corrects on the
      PTP transport alone without checking the messageType.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 320}
        - PTP:
            messageType: 0xB
            versionPTP: 2
            messageLength: 64
            correctionField: 0x0000000000000ABC
            reserved: 0x00000000
            sequenceId: 7
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: unchanged}
        PTP.reserved: {action: unchanged}

  - name: signaling_message_untouched
    visibility: hidden
    description: |
      A PTP Signaling message (messageType 0xC) on the general port (320)
      MUST pass through with its correctionField unchanged.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 320}
        - PTP:
            messageType: 0xC
            versionPTP: 2
            messageLength: 44
            correctionField: 0x0000000000005555
            sequenceId: 8
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: unchanged}

  - name: delay_resp_general_untouched
    visibility: hidden
    description: |
      Delay_Resp (messageType 0x9) is a general message and MUST pass
      through with its correctionField unchanged, even though it is an
      acknowledgement on the event/general exchange. Only the four event
      messages are corrected.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 320}
        - PTP:
            messageType: 0x9
            versionPTP: 2
            messageLength: 54
            correctionField: 0x0000000000007777
            sequenceId: 9
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: unchanged}

  - name: delay_req_event_corrected
    visibility: hidden
    description: |
      A Delay_Req (messageType 0x1) event message MUST have residence added
      to its correctionField under the all-event correction policy. A switch
      that corrects only Sync leaves this untouched and fails.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            messageType: 0x1
            versionPTP: 2
            messageLength: 44
            correctionField: 0x0001000000000000
            reserved: 0x000000AA
            sequenceId: 200
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: change_to_range, min: 281474976710656, max: 562949953421312}
        PTP.reserved: {action: change_to, value: 0}

  - name: pdelay_req_event_corrected
    visibility: hidden
    description: |
      A Pdelay_Req (messageType 0x2) event message MUST have residence added
      to its correctionField under the all-event correction policy.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            messageType: 0x2
            versionPTP: 2
            messageLength: 54
            correctionField: 0x0001000000000000
            reserved: 0x000000BB
            sequenceId: 201
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: change_to_range, min: 281474976710656, max: 562949953421312}
        PTP.reserved: {action: change_to, value: 0}

  - name: pdelay_resp_event_corrected
    visibility: hidden
    description: |
      A Pdelay_Resp (messageType 0x3) event message MUST have residence
      added to its correctionField under the all-event correction policy.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            messageType: 0x3
            versionPTP: 2
            messageLength: 54
            correctionField: 0x0001000000000000
            reserved: 0x000000CC
            sequenceId: 202
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: change_to_range, min: 281474976710656, max: 562949953421312}
        PTP.reserved: {action: change_to, value: 0}

# --- G2: resource robustness / boundary ---

  - name: non_ptp_udp_other_port_passthrough
    visibility: hidden
    description: |
      A UDP packet on a non-PTP destination port (1234) MUST be treated as
      non-PTP and forwarded normally — the switch demuxes PTP by UDP port
      319/320, not by "is UDP". Catches a switch that corrects any UDP
      packet.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 1234}
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        Ether.dst: {action: change_to, value: "08:00:00:00:02:02"}
        IP.ttl: {action: unchanged}

  - name: sync_zero_incoming_correctionfield_boundary
    visibility: hidden
    description: |
      Boundary case: a Sync with correctionField = 0 (the first transparent
      clock on the path). The residence is added onto zero; the output
      correctionField is non-negative and within the plausible scaled-
      residence range, and the reserved field is cleared.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            messageType: 0x0
            versionPTP: 2
            messageLength: 44
            correctionField: 0x0000000000000000
            reserved: 0x99887766
            sequenceId: 300
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: change_to_range, min: 0, max: 562949953421312}
        PTP.reserved: {action: change_to, value: 0}

# --- G3: regression for v1model bug patterns ---

  - name: udp_checksum_recomputed_after_correction
    visibility: hidden
    description: |
      Regression for the #1 silent-failure bug family (checksum after
      modification). A Sync over UDP/IPv4 (dst port 319) arrives with a valid
      UDP checksum; the switch rewrites the correctionField and clears the
      reserved field, both inside the UDP payload, so the UDP checksum MUST be
      recomputed. The check recomputes the UDP checksum over the EMITTED output
      packet and asserts it equals the emitted checksum field — a switch that
      leaves the stale checksum fails. Residence-independent: tests
      self-consistency of the output, not a predicted magnitude.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            messageType: 0x0
            versionPTP: 2
            messageLength: 44
            correctionField: 0x0001000000000000
            reserved: 0x0F0F0F0F
            sequenceId: 500
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        UDP.chksum: {action: checksum_valid}
        PTP.correctionField: {action: change_to_range, min: 281474976710656, max: 562949953421312}
        PTP.reserved: {action: change_to, value: 0}

  - name: deparser_structure_corrected_sync
    visibility: hidden
    description: |
      Regression for the conditional-deparser bug surface: a corrected Sync
      must emerge with its full Ethernet/IPv4/UDP/PTP structure intact — the
      UDP destination port still 319 and the PTP correctionField present and
      corrected, reserved cleared. Catches a deparser that conditionally
      emits the PTP/UDP header on the correction branch and corrupts the
      egress packet.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            messageType: 0x0
            versionPTP: 2
            messageLength: 44
            correctionField: 0x0001000000000000
            reserved: 0x0BADF00D
            sequenceId: 400
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        UDP.dport: {action: unchanged}
        PTP.correctionField: {action: change_to_range, min: 281474976710656, max: 562949953421312}
        PTP.reserved: {action: change_to, value: 0}

  - name: deparser_structure_passthrough_announce
    visibility: hidden
    description: |
      Companion to the corrected-Sync regression: a pass-through Announce
      must emerge with its full structure intact, UDP destination port still
      320, and its correctionField byte-identical. Together with the
      corrected-Sync case this asserts the deparser emits a complete, correct
      header on both the correction branch and the pass-through branch.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 320}
        - PTP:
            messageType: 0xB
            versionPTP: 2
            messageLength: 64
            correctionField: 0x0000000000001234
            reserved: 0x00000000
            sequenceId: 401
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        UDP.dport: {action: unchanged}
        PTP.correctionField: {action: unchanged}
