test_cases:
- name: permit_admin_to_web1_https
  visibility: public
  description: Admin host (10.0.0.5) sends TCP/443 to web1 (192.0.2.10).
  input:
    port: s1.p4
    layers:
    - Ether:
        src: 08:00:00:00:00:94
        dst: 08:00:00:00:00:04
    - IP:
        src: 10.0.0.5
        dst: 192.0.2.10
        ttl: 64
        proto: 6
    - TCP:
        sport: 33000
        dport: 443
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:0a
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:02
      IP.ttl:
        action: decremented_by
        delta: 1
