test_cases:
- name: vxlan_encap_basic_vni100
  visibility: public
  description: |
    Encap path. h1 (port s1.p1, VNI 100) sends an inner IPv4/TCP
    frame whose destination MAC matches a remote tenant in VNI
    100. The switch MUST forward an outer Ethernet / IPv4 / UDP /
    VXLAN-wrapped copy out the uplink (s1.p3) with the correct
    outer src/dst IPv4, UDP dst port 4789, and VXLAN VNI = 100.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:10:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.5.5
        ttl: 64
    - TCP:
        sport: 5000
        dport: 80
        flags: S
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      layers[0].Ether.src:
        action: change_to
        value: aa:bb:cc:00:01:01
      layers[0].Ether.dst:
        action: change_to
        value: aa:bb:cc:00:00:01
      layers[0].Ether.type:
        action: change_to
        value: 2048
      layers[1].IP.src:
        action: change_to
        value: 192.168.10.1
      layers[1].IP.dst:
        action: change_to
        value: 192.168.20.1
      layers[1].IP.proto:
        action: change_to
        value: 17
      layers[1].IP.ttl:
        action: change_to
        value: 64
      layers[2].UDP.dport:
        action: change_to
        value: 4789
      layers[3].VXLAN.vni:
        action: change_to
        value: 100
- name: vxlan_decap_basic_vni100
  visibility: public
  description: |
    Decap path. A VXLAN frame arrives on the uplink (s1.p3) with
    outer UDP dst port 4789, VXLAN VNI = 100, I flag set, all
    reserved bits zero, and inner destination MAC matching h1's
    MAC. The switch MUST strip the four outer headers and forward
    the bare inner Ethernet / IPv4 / TCP frame to h1 (s1.p1)
    unchanged.
  input:
    port: s1.p3
    layers:
    - Ether:
        src: aa:bb:cc:00:00:01
        dst: aa:bb:cc:00:01:01
    - IP:
        src: 192.168.20.1
        dst: 192.168.10.1
        ttl: 64
        proto: 17
    - UDP:
        sport: 49152
        dport: 4789
        chksum: 0
    - VXLAN:
        flags: 8
        vni: 100
        reserved1: 0
        reserved2: 0
    - Ether:
        src: 08:00:00:00:10:01
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.5.5
        dst: 10.0.1.1
        ttl: 64
    - TCP:
        sport: 80
        dport: 5000
        flags: S
  expected:
    behavior: forward
    output_port: s1.p1
    transformations:
      Ether.src:
        action: change_to
        value: 08:00:00:00:10:01
      Ether.dst:
        action: change_to
        value: 08:00:00:00:01:01
      IP.src:
        action: change_to
        value: 10.0.5.5
      IP.dst:
        action: change_to
        value: 10.0.1.1
      IP.ttl:
        action: change_to
        value: 64
- name: vxlan_encap_basic_vni200
  visibility: public
  description: |
    Encap path on a different tenant. h2 (port s1.p2, VNI 200)
