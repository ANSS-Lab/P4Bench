- name: vxlan_encap_all_outer_fields_set
  visibility: hidden
  description: |
    Outer-header completeness check. After the encap action, EVERY
    field of the four new outer headers must be a defined value —
    none left as the uninitialised default that header-validity
    tricks leave behind. Asserts on every outer field the spec
    pins, plus the I flag and reserved bits explicitly. Catches
    implementations that mark headers valid without per-field assignment.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:10:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.5.5
        ttl: 64
    - TCP:
        sport: 5001
        dport: 80
        flags: S
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      layers[0].Ether.src:
        action: change_to
        value: aa:bb:cc:00:01:01
      layers[0].Ether.dst:
        action: change_to
        value: aa:bb:cc:00:00:01
      layers[0].Ether.type:
        action: change_to
        value: 2048
      layers[1].IP.version:
        action: change_to
        value: 4
      layers[1].IP.ihl:
        action: change_to
        value: 5
      layers[1].IP.proto:
        action: change_to
        value: 17
      layers[1].IP.ttl:
        action: change_to
        value: 64
      layers[1].IP.src:
        action: change_to
        value: 192.168.10.1
      layers[1].IP.dst:
        action: change_to
        value: 192.168.20.1
      layers[2].UDP.dport:
        action: change_to
        value: 4789
      layers[2].UDP.sport:
        action: change_to_range
        min: 49152
        max: 65535
      layers[2].UDP.chksum:
        action: change_to
        value: 0
      layers[3].VXLAN.flags:
        action: change_to
        value: 8
      layers[3].VXLAN.vni:
        action: change_to
        value: 100
      layers[3].VXLAN.reserved1:
        action: change_to
        value: 0
      layers[3].VXLAN.reserved2:
        action: change_to
        value: 0
- name: decap_zero_udp_checksum_accepted
