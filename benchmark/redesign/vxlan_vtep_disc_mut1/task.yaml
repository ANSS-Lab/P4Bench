    transformations:
      Ether.src:
        action: change_to
        value: 08:00:00:00:10:01
      Ether.dst:
        action: change_to
        value: 08:00:00:00:01:01
      IP.src:
        action: change_to
        value: 10.0.7.7
      IP.dst:
        action: change_to
        value: 10.0.1.1
