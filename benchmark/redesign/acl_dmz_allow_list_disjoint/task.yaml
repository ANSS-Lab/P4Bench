- name: permit_web1_https
  visibility: public
  description: TCP/443 to web1 (192.0.2.10).
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:91
        dst: 08:00:00:00:00:01
    - IP:
        src: 198.51.100.10
        dst: 192.0.2.10
        ttl: 64
        proto: 6
    - TCP:
        sport: 51000
        dport: 443
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:0a
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:02
      IP.ttl:
        action: decremented_by
        delta: 1
