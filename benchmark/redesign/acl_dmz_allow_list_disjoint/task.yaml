task_name: acl_dmz_allow_list_disjoint
task_type: full_program
complexity: medium
source: rfc
pattern: P-ACL
pattern_version: '1.0'
seed:
  rule_count_capacity: 64
  match_field_breadth: tuple5
  priority_depth: 16
  action_breadth: permit_deny
  default_action: deny
  faithfulness: D5.0_first_match_priority
description: |
  A switch s1 stands between an external Internet-facing interface, a DMZ
  serving public-facing services, and an internal LAN. It enforces a
  stateless access-control policy: every IPv4 datagram is classified
  against the access-control list given below; admitted
  datagrams are forwarded to the host they are addressed to, denied
  datagrams are silently discarded. Inspired by the policy-rule
  terminology of RFC 3198 (Policy-Based Management).

  ## Topology and roles

    - s1.p1 — external interface (Internet-facing).
    - s1.p2 — DMZ web/api tier. Two hosts: web1 (192.0.2.10) and web2
              (192.0.2.11).
    - s1.p3 — DMZ services tier. Two hosts: dns1 (192.0.2.20, the
              public DNS resolver) and mail1 (192.0.2.30, the public
              mail server).
    - s1.p4 — internal LAN.

  ## Policy entries (the access-control list)

  Each entry has a priority (larger = higher precedence), a condition over
  the packet's 5-tuple (IPv4 source address, IPv4 destination address, IPv4
  protocol number, L4 source port, L4 destination port — any field shown as
  "any" is unconstrained and matches every value; IPv4 conditions are single
  addresses or prefixes), and an action (*permit* or *deny*).

  The installed entries' conditions are mutually non-overlapping: no single
  packet can satisfy the condition of more than one entry, so priority never
  has to break a tie (a packet matches exactly one entry or none).

  THIS LIST IS THE COMPLETE POLICY. You must install all of these entries
  into your classification table(s). The harness does not supply them;
  reproducing them faithfully is part of the task.

    | prio | action | src IP | dst IP        | proto | dport |
    |------|--------|--------|---------------|-------|-------|
    |  120 | permit | any    | 192.0.2.10/32 | 6     | 443   |
    |  120 | permit | any    | 192.0.2.10/32 | 6     | 80    |
    |   60 | permit | any    | 192.0.2.10/32 | 6     | 8080  |
    |   50 | permit | any    | 192.0.2.10/32 | 1     | any   |
    |  120 | permit | any    | 192.0.2.11/32 | 6     | 443   |
    |  120 | permit | any    | 192.0.2.11/32 | 6     | 80    |
    |  100 | permit | any    | 192.0.2.20/32 | 17    | 53    |
    |  100 | permit | any    | 192.0.2.20/32 | 6     | 53    |
    |   80 | permit | any    | 192.0.2.30/32 | 6     | 25    |
    |   80 | permit | any    | 192.0.2.30/32 | 6     | 465   |
    |   30 | deny   | any    | 192.0.2.10/32 | 6     | 23    |
    |   30 | deny   | any    | 192.0.2.10/32 | 6     | 22    |
    |   30 | deny   | any    | 192.0.2.11/32 | 6     | 3389  |

  ## Classification rules

  For every frame received on any port:

    R1. If the frame is not an IPv4 datagram (e.g. ARP, IPv6, raw
        Ethernet), it MUST be discarded. No output, no internal state
        change.

    R2. For an IPv4 datagram, evaluate the policy entries: find the
        entry whose condition admits the packet's 5-tuple (source IP,
        destination IP, IPv4 protocol, L4 source port, L4 destination
        port). At most one entry can match. If no entry's condition
        admits the packet, the packet MUST be discarded.

    R3. If the matching entry's action is *permit*, the packet is
        admitted: it MUST be forwarded toward its IPv4 destination
        address (see "Forwarding of admitted packets" below).

    R4. If the matching entry's action is *deny*, the packet MUST be
        discarded. No output, no internal state change.

  ## Forwarding of admitted packets

  An admitted packet is delivered to the host whose IPv4 address it is
  destined to, using the destination-host map below. You must install
  these mappings. The switch must:

    - Send the packet out the host's port.
    - Replace the Ethernet destination address with the destination
      host's MAC.
    - Replace the Ethernet source address with the egress port's own MAC.
    - Decrement the IPv4 hop count by exactly one.
    - Leave the IPv4 source and destination addresses unchanged.
    - Leave the IPv4 protocol, L4 ports, and payload bytes unchanged.
    - Ensure the IPv4 header checksum is valid on egress.

    | dst IP/32     | egress port | destination host MAC |
    |---------------|-------------|----------------------|
    | 192.0.2.10/32 | s1.p2       | 08:00:00:00:02:0a    |
    | 192.0.2.11/32 | s1.p2       | 08:00:00:00:02:0b    |
    | 192.0.2.20/32 | s1.p3       | 08:00:00:00:03:14    |
    | 192.0.2.30/32 | s1.p3       | 08:00:00:00:03:1e    |

  Each port's own (source) MAC, written into Ethernet src on egress:

    | port  | port MAC          |
    |-------|-------------------|
    | s1.p1 | 08:00:00:00:00:01 |
    | s1.p2 | 08:00:00:00:00:02 |
    | s1.p3 | 08:00:00:00:00:03 |
    | s1.p4 | 08:00:00:00:00:04 |

  If a permitted packet's destination has no entry in the map above, it
  is treated as an unreachable destination and MUST be discarded.

  ## Side requirements

    - The set of policy entries is consulted on every IPv4 datagram.
    - The decision is stateless: no per-flow state is maintained, no
      record of past packets influences the verdict for the current
      packet.
    - The policy is closed: if no entry's condition admits a packet,
      the packet is dropped (negative-policy default).

  ## Control plane

  You install both:
    - The policy entries (the access-control list above).
    - The destination-host → (egress port, host MAC) mapping above, used
      by the forwarding stage.

  Both tables are fully specified above; install them as given.
