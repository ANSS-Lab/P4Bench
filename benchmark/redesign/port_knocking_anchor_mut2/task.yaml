task_name: port_knocking_anchor_mut2
task_type: full_program
complexity: medium
source: synthesis
pattern: P-PortKnocking
pattern_version: '1.0'
seed:
  protected_service: 10.0.0.100
  protected_port: 22
  knock_sequence:
  - 7000
  - 8000
  - 9000
  - 10000
  reset_strict: true
  expiry_window: unbounded
  authorize_persists: true
  state_capacity: unbounded
  eviction_policy: none
  default_action: drop
  faithfulness: D5.0_fixed_sequence
description: |
  Implement a stateful port-knocking authorization gate in front of a protected
  TCP service on a single switch s1. Inspired by the classic port-knocking /
  Single-Packet-Authorization concept (M. Krzywinski, Linux Journal 2003).

  The protected service is closed to every source by default: its traffic is
  dropped until that source has proven itself by sending a secret, ORDERED
  sequence of "knock" packets — packets aimed at four pre-agreed destination
  ports, in the right order, with NO stray traffic mixed in. The gate tracks
  each source's progress independently, by the source's IPv4 address.

  ## The protected service

    - The protected service lives at IPv4 address 10.0.0.100, TCP port 22, and
      is reached out switch port s1.p2.
    - A packet is "service-bound" when its destination IPv4 address is
      10.0.0.100 AND its TCP/UDP destination port is 22.

  ## The knock sequence

    - The secret sequence is the four destination ports 7000, then 8000, then
      9000, then 10000, sent IN THAT ORDER. These four ports are the "knock
      ports".
    - A "knock" is any non-service packet from a source. It is judged against
      that source's current position in the sequence.

  ## Required behaviour

  Process each packet as follows (first matching rule wins):

   1. A frame that is not IPv4 is dropped.

   2. SERVICE-BOUND traffic (destination 10.0.0.100, destination port 22):
        - If the source has completed the full sequence 7000 → 8000 → 9000 →
          10000 in order (it is AUTHORIZED), the packet is forwarded out s1.p2
          to the protected service. Once a source is authorized it STAYS
          authorized for subsequent service packets — UNLESS it sends a stray
          packet (see rule 3), which resets its state.
        - Otherwise the packet is dropped. The service is closed to any source
          that has not completed the full ordered sequence.
      The gate must consider BOTH the destination address and the destination
      port: traffic to port 22 on any other host is not service-bound here.

   3. A NON-SERVICE packet, judged against the source's progress:
        - If its destination port is the source's EXPECTED NEXT knock port
          (7000 when the source is at the start; then 8000; then 9000; then
          10000), the source advances one step toward authorization. The knock
          packet itself is dropped — knocks are never forwarded to any service.
        - ANY OTHER non-service packet from the source — whether it is a knock
          port {7000, 8000, 9000, 10000} that is not the expected next one, OR
          any unrelated port — RESETS the source's progress back to the start.
          The authentication run must be CLEAN: a single stray packet anywhere
          in the run (including after the source is already authorized) aborts
          it. The packet is dropped.

  ## Invariants

   - A service-bound packet from a source that has not completed the full
     ordered sequence is ALWAYS dropped — regardless of what other sources are
     doing on the switch at the same time.
   - A source advances only when it hits its expected next knock port, and only
     by one step at a time; hitting the knock ports out of order does not
     advance it.
   - ANY non-service packet that is not the expected next knock — an
     out-of-order knock port OR any unrelated port — returns the source to the
     start of the sequence (strict, clean-run discipline).
   - Each source is tracked independently by its IPv4 source address: one
     source's knocks must never advance or authorize another source.

  ## Topology

  One switch s1 with three hosts:
    - h1 at s1.p1 — a knocking client, IPv4 10.0.0.1.
    - svc at s1.p2 — the protected service host, IPv4 10.0.0.100 (TCP 22).
    - h2 at s1.p3 — a second knocking client, IPv4 10.0.0.2.
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p3: 3
  links:
  - from: h1
    to: s1.p1
  - from: s1.p2
    to: svc
  - from: h2
    to: s1.p3
hosts:
  h1:
    ip: 10.0.0.1
    mac: 08:00:00:00:01:01
    port: s1.p1
  svc:
    ip: 10.0.0.100
    mac: 08:00:00:00:02:02
    port: s1.p2
  h2:
    ip: 10.0.0.2
    mac: 08:00:00:00:03:03
    port: s1.p3
