  - port: s1.p1
    layers: &id001
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.0.1
        dst: 10.0.0.200
        ttl: 64
        proto: 6
    - TCP:
        sport: 40000
        dport: 7000
        flags: S
  - port: s1.p1
    layers: &id002
