- name: full_sequence_then_service_forward
  visibility: public
  description: Source h1 sends the complete knock sequence 7000 -> 8000 -> 9000 -> 10000 in order, then a service-bound packet (10.0.0.100:22). The source is authorized, so the service packet forwards out s1.p2. Golden path.
