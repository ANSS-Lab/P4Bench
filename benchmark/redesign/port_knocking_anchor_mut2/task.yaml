    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.0.1
        dst: 10.0.0.200
        ttl: 64
        proto: 6
    - TCP:
        sport: 40000
        dport: 10000
        flags: S
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.0.1
        dst: 10.0.0.100
        ttl: 64
        proto: 6
    - TCP:
        sport: 50000
        dport: 22
        flags: S
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.src:
        action: unchanged
      IP.dst:
        action: unchanged
