description: |-
  Implement a Segment Routing over MPLS (SR-MPLS) node for BMv2 (v1model). The
  node forwards frames carrying a stack of MPLS labels, where each label is a
  Segment Identifier (SID). Forwarding is driven by the meaning of the topmost
  label, not by a single generic relabel-and-forward rule.

  Topology: one switch s1 with three ports. Port 1 is the ingress; ports 2 and 3
  are egress links toward downstream nodes. The egress-port source MAC is
  08:00:00:00:02:00 on port 2 and 08:00:00:00:03:00 on port 3. This node owns the
  Node-SID 16001 and the Adjacency-SID 24001 (the adjacency reachable out port 2
  toward 08:00:00:00:02:02).

  A segment forwarding table maps an active SID label to where to send the frame
  next; the control plane installs these entries:

    | active SID label | egress port | next-hop MAC      |
    |------------------|-------------|-------------------|
    | 16001            | s1.p2       | 08:00:00:00:02:02 |
    | 16002            | s1.p2       | 08:00:00:00:02:02 |
    | 16003            | s1.p3       | 08:00:00:00:03:03 |
    | 16005            | s1.p2       | 08:00:00:00:02:02 |

  MPLS-labelled frames carry a label stack (each label has its own hop count and
  a bottom-of-stack marker on the last label) followed by an inner IPv4 packet.
  Required behaviour, per received frame, decided by the top label:

  - A frame that carries no MPLS label stack is dropped.

  - A frame whose top label arrives with a hop count of 0 or 1 is dropped (it
    cannot be forwarded another hop).

  - If the top label is this node's Adjacency-SID (24001), that adjacency segment
    is complete: the node finishes it (pops the label) and forwards the frame out
    the adjacency's egress port (s1.p2) toward its next hop (08:00:00:00:02:02),
    WITHOUT consulting the segment forwarding table. The label below becomes the
    new top label with its hop count decremented by one; the Ethernet source is
    set to the egress-port MAC and destination to the next-hop MAC. The remaining
    stack below and the inner IPv4 packet are left intact.

  - If the top label is the Node-SID this node owns (16001), that segment is
    complete: the node finishes it and continues toward the next segment. Any
    further top labels that are ALSO 16001 are part of the same completed run and
    are finished together. Then:
      * if a label the node does NOT own remains below, forwarding is chosen by
        that first non-owned label — the segment now becoming active — looked up
        in the segment forwarding table; the frame leaves on that segment's egress
        port toward its next hop, that exposed top label's hop count decremented by
        one, Ethernet rewritten, and the stack below plus the inner IPv4 packet
        left intact;
      * if NO label remains below (the completed segment sat directly above the
        inner IPv4 packet — this is the penultimate hop), the node pops the shim
        and forwards the BARE inner IPv4 packet with NO MPLS label remaining,
        choosing the egress from the completed label's segment-forwarding-table
        entry (16001 -> s1.p2, 08:00:00:00:02:02) and rewriting the Ethernet
        addresses; the inner IPv4 packet (including its own hop count) is unchanged.

  - If the top label is a SID this node does NOT own but the segment forwarding
    table has an entry for it, the frame is in transit: it is forwarded out that
    entry's egress port toward its next hop with the label preserved as-is, the
    top label's hop count decremented by one, and the Ethernet addresses
    rewritten. Only the top label is affected; the stack below and the inner
    packet are unchanged.

  - A frame whose top label is neither owned by this node nor present in the
    segment forwarding table is dropped.

  A frame's top-label hop count is decremented exactly once per traversal, and the
  inner IPv4 hop count is never altered. Both the P4 program and its table entries
  are yours to author.
test_cases:
- name: node_sid_pop_and_continue
  visibility: public
  goal_class: G1
  description: A frame whose top label is this node's own Node-SID (16001), over a next segment 16002. The completed top segment is finished (popped); forwarding is chosen by the now-active segment 16002 (egress p2, next hop 08:00:00:00:02:02), its hop count decremented by one. The inner IPv4 packet is unchanged.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:01:00
        type: 34887
    - MPLS:
        label: 16001
        ttl: 64
        s: 0
        cos: 0
    - MPLS:
        label: 16002
        ttl: 64
        s: 1
        cos: 0
    - IP:
        src: 10.0.0.1
        dst: 10.0.9.9
        ttl: 55
        proto: 17
    - UDP:
        sport: 4000
        dport: 5000
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      Ether.src:
        action: change_to
        value: 08:00:00:00:02:00
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:02
      MPLS.label:
        action: change_to
        value: 16002
      MPLS.ttl:
        action: change_to
        value: 63
      IP.ttl:
        action: unchanged
      IP.dst:
        action: unchanged
      IP.src:
        action: unchanged
