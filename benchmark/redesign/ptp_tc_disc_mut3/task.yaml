task_name: ptp_tc_disc_mut3
task_type: full_program
complexity: high
source: rfc
pattern: P-PTPTransparentClock
pattern_version: '1.0'

seed:
  faithfulness: D5.2_twostep
  step_mode: two_step
  delay_mechanism: p2p
  correction_field_faithfulness: full64_scaled_ns
  transport: udp_ipv4
  domain_handling: multi_domain_filtered
  active_domains: [0]
  corrected_message_types: all_event
  correlation_capacity: 16
  link_delays:
    - ingress_port: 1
      mean_link_delay: 100000000
    - ingress_port: 2
      mean_link_delay: 10000000
  link_delay_capacity: 64

scoring:
  public_weight: 0.2   # public-overfitting cannot exceed 0.2
  hidden_weight: 0.8

description: |
  A switch s1 sits between a time master and a time slave and acts as a
  Precision Time Protocol (PTP, IEEE 1588) *two-step peer-to-peer transparent
  clock* that handles BOTH two-step correction exchanges. Concept
  attribution: IEEE 1588 transparent clock; the two-step flag, the
  peer-to-peer mechanism, and the clock-domain vocabulary follow RFC 8173.

  A two-step transparent clock does not modify the event message in transit;
  it remembers the switch's delay contribution for it and writes that into the
  paired *follow-up* message. This switch handles the two follow-up exchanges
  PTP defines:

    - **Sync** (messageType 0x0) is paired with **Follow_Up** (0x8);
    - **Pdelay_Resp** (messageType 0x3) is paired with
      **Pdelay_Resp_Follow_Up** (0xA).

  These two exchanges are INDEPENDENT: a Follow_Up may only carry a Sync's
  remembered contribution, and a Pdelay_Resp_Follow_Up may only carry a
  Pdelay_Resp's. A follow-up of one kind MUST NOT pick up a remembered
  contribution left by the other kind, even when they share the same
  sourcePortIdentity and sequenceId.

  PTP runs over UDP/IPv4 (IEEE 1588 Annex D): event messages (Sync,
  Pdelay_Resp) arrive with UDP destination port 319; general messages
  (the follow-ups, Announce, …) with UDP destination port 320.

  ## What a PTP message looks like on the wire

  After the UDP header sits a 34-byte PTP common header:

    - byte 0: a 4-bit transportSpecific field, then a 4-bit **messageType**
      (the low nibble).
    - byte 1: a 4-bit minorVersionPTP, then a 4-bit versionPTP.
    - bytes 2-3: messageLength (16 bits).
    - byte 4: **domainNumber**.
    - byte 5: minorSdoId / reserved.
    - bytes 6-7: flagField (16 bits).
    - bytes 8-15: **correctionField** — 64-bit, units of 2^-16 ns.
    - bytes 16-19: a 32-bit messageTypeSpecific / **reserved** field.
    - bytes 20-29: **sourcePortIdentity** = 8-byte clockIdentity + 2-byte
      portNumber.
    - bytes 30-31: **sequenceId** (16 bits).
    - byte 32: controlField.
    - byte 33: logMessageInterval.

  An event message and its follow-up carry the same sourcePortIdentity and the
  same sequenceId; that pairing — together with the message kind (Sync-class
  vs Pdelay_Resp-class) — is how the switch matches them.

  ## Topology, forwarding, and per-link configuration

    - h1 (master side) at s1.p1; IPv4 10.0.1.1, MAC 08:00:00:00:01:01.
    - h2 (slave side)  at s1.p2; IPv4 10.0.2.2, MAC 08:00:00:00:02:02.

  s1 forwards every frame toward the host owning the destination IPv4
  (10.0.1.1 → s1.p1, 10.0.2.2 → s1.p2), rewriting the Ethernet destination to
  that host's MAC. You provide the forwarding table and entries. The switch
  does NOT decrement the IPv4 TTL.

  The control plane configures a **mean link delay** (ns) per ingress link;
  you provide this per-ingress-port table and entries:

    - the link on s1.p1 has mean link delay **100000000 ns**;
    - the link on s1.p2 has mean link delay **10000000 ns**.

  The switch buffers a bounded number of pending event→follow-up correlations
  (on the order of a few tens). When more correlations are pending than the
  buffer holds, older pending entries may be displaced; a follow-up whose
  remembered contribution has been displaced (or never stored) is forwarded
  UNMODIFIED — the switch MUST NOT apply a stale or wrong contribution.

  ## Per-packet behaviour

   1. **Non-PTP passthrough.** A frame that is not IPv4/UDP with UDP
      destination port 319 or 320 is forwarded normally.

   2. **Event message, domainNumber 0** — Sync (0x0) or Pdelay_Resp (0x3):
      compute the contribution = residence time (entering→leaving the switch)
      + the ingress link's mean delay; remember it, indexed by this message's
      (sourcePortIdentity, sequenceId, kind) where kind is Sync-class for a
      Sync and Pdelay_Resp-class for a Pdelay_Resp. Forward the event message
      **UNMODIFIED**.

   3. **Follow-up message, domainNumber 0** — Follow_Up (0x8, Sync-class) or
      Pdelay_Resp_Follow_Up (0xA, Pdelay_Resp-class): look up the remembered
      contribution for this message's (sourcePortIdentity, sequenceId, kind).
      If one of the MATCHING kind exists: convert it to 2^-16-ns units and
      **ADD** it to this message's correctionField (do not overwrite); clear
      the reserved field; recompute the UDP checksum; and consume the entry so
      it is applied at most once. If none of the matching kind exists, forward
      the follow-up UNMODIFIED.

   4. **Domain filter.** Only domainNumber 0 is handled as above; any other
      domainNumber is forwarded UNMODIFIED.

   5. **Other PTP messages** — Delay_Req (0x1), Pdelay_Req (0x2),
      Delay_Resp (0x9), Announce (0xB), Signaling (0xC), Management (0xD) —
      are forwarded UNMODIFIED.

   6. **Transparency.** A contribution is only ever added to a follow-up's
      correctionField, only for the matching kind, and at most once per
      correlation; it never overwrites the field.

topology:
  switches:
    - name: s1
      device_id: 0
      ports:
        p1: 1
        p2: 2
  links:
    - from: h1
      to: s1.p1
    - from: s1.p2
      to: h2

hosts:
  h1:
    ip: 10.0.1.1/24
    mac: 08:00:00:00:01:01
    port: s1.p1
  h2:
    ip: 10.0.2.2/24
    mac: 08:00:00:00:02:02
    port: s1.p2

custom_headers:
  - file: custom_headers.py
    class: PTP
    description: "IEEE 1588 PTP common header (34 bytes) over UDP/IPv4, ports 319/320"

# Range note (same windows as mut1/mut2; link delay dominates residence):
#   event ingressed s1.p1 -> matching follow-up correctionField in
#       [288028576710656, 288683936710656]
#   event ingressed s1.p2 -> [282130336710656, 282785696710656]
#   Event message and follow-up share PTP (clockIdentity, portNumber,
#   sequenceId); they use different UDP source ports so the harness isolates
#   the follow-up's output from the event's.

test_cases:

# --- G1: functional correctness ---

  - name: sync_forwarded_unmodified_twostep
    visibility: public
    description: |
      A domain-0 Sync (0x0) is forwarded UNMODIFIED (correctionField + reserved
      byte-identical). A one-step implementation that corrects it in transit
      fails.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            messageType: 0x0
            versionPTP: 2
            messageLength: 44
            domainNumber: 0
            correctionField: 0x0001000000000000
            reserved: 0xDEADBEEF
            clockIdentity: 0x001122FFFE334455
            portNumber: 1
            sequenceId: 100
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: unchanged}
        PTP.reserved: {action: unchanged}

  - name: sync_followup_carries_stored_residence
    visibility: public
    description: |
      Sync warm-up, then its paired Follow_Up (0x8, same identity/sequenceId)
      carries the stored (residence + s1.p1 link delay).
    prior_inputs:
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
          - UDP:   {sport: 49152, dport: 319}
          - PTP:
              messageType: 0x0
              versionPTP: 2
              messageLength: 44
              domainNumber: 0
              correctionField: 0x0001000000000000
              reserved: 0x00000000
              clockIdentity: 0x001122FFFE334455
              portNumber: 1
              sequenceId: 110
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49153, dport: 320}
        - PTP:
            messageType: 0x8
            versionPTP: 2
            messageLength: 44
            domainNumber: 0
            correctionField: 0x0001000000000000
            reserved: 0x12345678
            clockIdentity: 0x001122FFFE334455
            portNumber: 1
            sequenceId: 110
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: change_to_range, min: 288028576710656, max: 288683936710656}
        PTP.reserved: {action: change_to, value: 0}

  - name: non_ptp_passthrough_unmodified
    visibility: public
    description: |
      A non-PTP packet (IPv4/TCP) is forwarded toward h2 with the Ethernet
      destination rewritten and TTL unchanged.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 6}
        - TCP:   {sport: 5000, dport: 80, flags: "S"}
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        Ether.dst: {action: change_to, value: "08:00:00:00:02:02"}
        IP.ttl: {action: unchanged}

  - name: pdelay_resp_followup_carries_residence
    visibility: hidden
    description: |
      The SECOND correlation class. A Pdelay_Resp (0x3) warm-up, then its
      paired Pdelay_Resp_Follow_Up (0xA, same identity/sequenceId) MUST carry
      the stored (residence + s1.p1 link delay). Requires handling the 0x3↔0xA
      pairing in addition to 0x0↔0x8.
    prior_inputs:
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
          - UDP:   {sport: 49152, dport: 319}
          - PTP:
              messageType: 0x3
              versionPTP: 2
              messageLength: 54
              domainNumber: 0
              correctionField: 0x0001000000000000
              reserved: 0x00000000
              clockIdentity: 0x00CAFEFFFE001122
              portNumber: 3
              sequenceId: 120
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49153, dport: 320}
        - PTP:
            messageType: 0xA
            versionPTP: 2
            messageLength: 54
            domainNumber: 0
            correctionField: 0x0001000000000000
            reserved: 0x87654321
            clockIdentity: 0x00CAFEFFFE001122
            portNumber: 3
            sequenceId: 120
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: change_to_range, min: 288028576710656, max: 288683936710656}
        PTP.reserved: {action: change_to, value: 0}

  - name: pdelay_resp_forwarded_unmodified
    visibility: hidden
    description: |
      A Pdelay_Resp (0x3) event message is forwarded UNMODIFIED in transit
      (its contribution is remembered for its follow-up, not applied to itself).
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            messageType: 0x3
            versionPTP: 2
            messageLength: 54
            domainNumber: 0
            correctionField: 0x0001000000000000
            reserved: 0x0000ABCD
            clockIdentity: 0x00CAFEFFFE001122
            portNumber: 3
            sequenceId: 121
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: unchanged}
        PTP.reserved: {action: unchanged}

  - name: orphan_followup_forwarded_unmodified
    visibility: hidden
    description: |
      A Follow_Up with no previously-seen matching Sync is forwarded
      UNMODIFIED (cold-start / orphan).
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49153, dport: 320}
        - PTP:
            messageType: 0x8
            versionPTP: 2
            messageLength: 44
            domainNumber: 0
            correctionField: 0x0000000000000055
            reserved: 0xABCDEF01
            clockIdentity: 0x00AABBFFFECCDDEE
            portNumber: 9
            sequenceId: 777
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: unchanged}
        PTP.reserved: {action: unchanged}

# --- G2: cross-class isolation + bounded-table robustness ---

  - name: cross_class_no_leak
    visibility: hidden
    description: |
      CROSS-CLASS ISOLATION. A Sync (0x0) is stored, then a
      Pdelay_Resp_Follow_Up (0xA) arrives with the SAME sourcePortIdentity and
      sequenceId but a DIFFERENT kind. It MUST be forwarded UNMODIFIED — there
      is no stored Pdelay_Resp for this key, and a Pdelay_Resp_Follow_Up must
      not consume the Sync's entry. A correlation key that omits the message
      kind (keying only on sourcePortIdentity+sequenceId) wrongly applies the
      Sync's contribution and fails here.
    prior_inputs:
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
          - UDP:   {sport: 49152, dport: 319}
          - PTP:
              messageType: 0x0
              versionPTP: 2
              messageLength: 44
              domainNumber: 0
              correctionField: 0x0001000000000000
              reserved: 0x00000000
              clockIdentity: 0x001122FFFE334455
              portNumber: 1
              sequenceId: 230
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49153, dport: 320}
        - PTP:
            messageType: 0xA
            versionPTP: 2
            messageLength: 54
            domainNumber: 0
            correctionField: 0x0001000000000000
            reserved: 0x33333333
            clockIdentity: 0x001122FFFE334455
            portNumber: 1
            sequenceId: 230
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: unchanged}
        PTP.reserved: {action: unchanged}

  - name: multiple_pending_correlations_resolve_correctly
    visibility: hidden
    description: |
      With several correlations pending concurrently in the bounded buffer
      (two Syncs and one Pdelay_Resp), the Follow_Up for one specific Sync MUST
      receive that Sync's contribution — not another pending entry's. Tests
      that the bounded table keys distinct pending correlations independently.
    prior_inputs:
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
          - UDP:   {sport: 49152, dport: 319}
          - PTP: {messageType: 0x0, versionPTP: 2, messageLength: 44, domainNumber: 0, correctionField: 0x0001000000000000, reserved: 0, clockIdentity: 0x001122FFFE334455, portNumber: 1, sequenceId: 240}
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
          - UDP:   {sport: 49152, dport: 319}
          - PTP: {messageType: 0x0, versionPTP: 2, messageLength: 44, domainNumber: 0, correctionField: 0x0001000000000000, reserved: 0, clockIdentity: 0x001122FFFE334455, portNumber: 1, sequenceId: 241}
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
          - UDP:   {sport: 49152, dport: 319}
          - PTP: {messageType: 0x3, versionPTP: 2, messageLength: 54, domainNumber: 0, correctionField: 0x0001000000000000, reserved: 0, clockIdentity: 0x00CAFEFFFE001122, portNumber: 3, sequenceId: 240}
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49153, dport: 320}
        - PTP:
            messageType: 0x8
            versionPTP: 2
            messageLength: 44
            domainNumber: 0
            correctionField: 0x0001000000000000
            reserved: 0x11111111
            clockIdentity: 0x001122FFFE334455
            portNumber: 1
            sequenceId: 241
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: change_to_range, min: 288028576710656, max: 288683936710656}
        PTP.reserved: {action: change_to, value: 0}

# --- G3: regression for v1model bug patterns ---

  - name: followup_udp_checksum_recomputed
    visibility: hidden
    description: |
      Regression for the #1 silent-failure bug family. After applying the
      stored correction to a Follow_Up (rewriting correctionField + clearing
      reserved, inside the UDP payload), the UDP checksum MUST be recomputed
      over the full payload. The check recomputes the UDP checksum over the
      EMITTED output and asserts it matches the emitted field.
    prior_inputs:
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
          - UDP:   {sport: 49152, dport: 319}
          - PTP:
              messageType: 0x0
              versionPTP: 2
              messageLength: 44
              domainNumber: 0
              correctionField: 0x0001000000000000
              reserved: 0x00000000
              clockIdentity: 0x001122FFFE334455
              portNumber: 1
              sequenceId: 400
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49153, dport: 320}
        - PTP:
            messageType: 0x8
            versionPTP: 2
            messageLength: 44
            domainNumber: 0
            correctionField: 0x0001000000000000
            reserved: 0x0F0F0F0F
            clockIdentity: 0x001122FFFE334455
            portNumber: 1
            sequenceId: 400
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        UDP.chksum: {action: checksum_valid}
        PTP.correctionField: {action: change_to_range, min: 288028576710656, max: 288683936710656}
        PTP.reserved: {action: change_to, value: 0}

  - name: delay_req_forwarded_unmodified
    visibility: hidden
    description: |
      Delay_Req (0x1) has no follow-up in this task; it is forwarded
      UNMODIFIED. Catches a switch that corrects it in transit.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            messageType: 0x1
            versionPTP: 2
            messageLength: 44
            domainNumber: 0
            correctionField: 0x0001000000000000
            reserved: 0x000000AA
            clockIdentity: 0x001122FFFE334455
            portNumber: 1
            sequenceId: 500
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: unchanged}
        PTP.reserved: {action: unchanged}

  - name: sync_other_domain_forwarded_unmodified
    visibility: hidden
    description: |
      A Sync with domainNumber = 5 (outside {0}) is forwarded UNMODIFIED and
      not remembered.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 319}
        - PTP:
            messageType: 0x0
            versionPTP: 2
            messageLength: 44
            domainNumber: 5
            correctionField: 0x0001000000000000
            reserved: 0x44556677
            clockIdentity: 0x001122FFFE334455
            portNumber: 1
            sequenceId: 301
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        PTP.correctionField: {action: unchanged}
        PTP.reserved: {action: unchanged}

# --- Added hidden tests: broaden coverage of
#     the checksum-after-modification surface across both follow-up classes and
#     ports, plus more two-step robustness cases. Pattern semantics unchanged. ---

  - name: pdelay_resp_followup_checksum_recomputed
    visibility: hidden
    description: |
      Checksum-after-modification on the SECOND class. After applying the
      stored correction to a Pdelay_Resp_Follow_Up (0xA), the UDP checksum MUST
      be recomputed over the full modified payload.
    prior_inputs:
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
          - UDP:   {sport: 49152, dport: 319}
          - PTP: {messageType: 0x3, versionPTP: 2, messageLength: 54, domainNumber: 0, correctionField: 0x0001000000000000, reserved: 0, clockIdentity: 0x00CAFEFFFE001122, portNumber: 3, sequenceId: 410}
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 17}
        - UDP:   {sport: 49153, dport: 320}
        - PTP:
            messageType: 0xA
            versionPTP: 2
            messageLength: 54
            domainNumber: 0
            correctionField: 0x0001000000000000
            reserved: 0x0F0F0F0F
            clockIdentity: 0x00CAFEFFFE001122
            portNumber: 3
            sequenceId: 410
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        UDP.chksum: {action: checksum_valid}
        PTP.correctionField: {action: change_to_range, min: 288028576710656, max: 288683936710656}
        PTP.reserved: {action: change_to, value: 0}

  - name: sync_followup_port2_checksum_recomputed
    visibility: hidden
    description: |
