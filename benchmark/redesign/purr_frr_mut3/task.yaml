    port: s1.p3
  h4:
    ip: 10.0.4.4/24
    mac: 08:00:00:00:04:04
    port: s1.p4
test_cases:
- name: ipv4_to_10_0_4_4
  visibility: public
  description: Dest 10.0.4.4 — /24 match, primary p4 is up.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
    - IP:
        src: 10.0.1.1
        dst: 10.0.4.4
        ttl: 64
  expected:
    behavior: forward
    output_port: s1.p4
    transformations:
      Ether.dst:
        action: change_to
        value: 08:00:00:00:04:04
      Ether.src:
        action: change_to
        value: ff:ff:ff:ff:ff:ff
      IP.ttl:
        action: decremented_by
        delta: 1
