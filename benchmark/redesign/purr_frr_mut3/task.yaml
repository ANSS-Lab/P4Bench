task_name: purr_frr_mut3
task_type: full_program
complexity: medium
source: paper
pattern: P-PURRFastReroute
pattern_version: '1.0'
seed:
  frr_groups:
  - prefix: 10.0.0.0
    prefix_len: 16
    primary_port: 4
    backup_port: 2
    primary_mac: 08:00:00:00:04:04
    backup_mac: 08:00:00:00:02:02
  - prefix: 10.0.2.0
    prefix_len: 24
    primary_port: 2
    backup_port: 3
    primary_mac: 08:00:00:00:02:02
    backup_mac: 08:00:00:00:03:03
  - prefix: 10.0.3.0
    prefix_len: 24
    primary_port: 3
    backup_port: 4
    primary_mac: 08:00:00:00:03:03
    backup_mac: 08:00:00:00:04:04
  - prefix: 10.0.4.0
    prefix_len: 24
    primary_port: 4
    backup_port: 2
    primary_mac: 08:00:00:00:04:04
    backup_mac: 08:00:00:00:02:02
  - prefix: 10.0.2.55
    prefix_len: 32
    primary_port: 4
    backup_port: 2
    primary_mac: 08:00:00:00:04:04
    backup_mac: 08:00:00:00:02:02
  - prefix: 10.0.4.77
    prefix_len: 32
    primary_port: 2
    backup_port: 3
    primary_mac: 08:00:00:00:02:02
    backup_mac: 08:00:00:00:03:03
  port_down:
  - 2
  - 3
  frr_match_kind: lpm
  frr_table_capacity: unbounded
  port_down_capacity: 64
  liveness_source: control_plane_table
  cascaded_backup: true
  ttl_decrement_strict: true
  default_action_on_miss: drop
  faithfulness: D5.2_cascaded_protection
description: |
  A switch s1 with four host-facing ports participates in a small fault-
  tolerant overlay. Each of its four hosts is a directly attached peer
  that the switch must keep reachable through any single egress-port
  failure — and in some cases through simultaneous failures of multiple
  egress ports. The forwarding mechanism is based on a fast-reroute
  primitive inspired by "PURR: A Primitive for Reconfigurable Fast
  Reroute" (CoNEXT 2019). Although the original PURR work targets
  ASIC-class deployments at scale, the principle the switch must
  implement here is the same one PURR isolates: every protected
  destination network is associated, at install time, with TWO
  next-hops — a "primary" choice and a "backup" choice — so that any
  per-packet failover decision can be made by an in-pipeline demux
  rather than by recirculation, control-plane up-calls, or any other
  out-of-band mechanism.

  The cluster operator has deliberately chosen a configuration in which
  several FRR groups can experience concurrent port-down events. In the
  configuration in force for this task — which YOUR control plane
  installs, enumerated in full under "Control plane" below — more than
  one of the four host-facing ports is marked down at the same time, so
  the program MUST NOT make any assumption about at most one failure
  being active. (For clarity, "marked down" here is a property of a
  port at the moment a packet arrives, not a topology-permanent state.)

  ## Topology and roles

    - s1.p1 — connection point for host h1. h1's IPv4 address is
              10.0.1.1 and its hardware address is 08:00:00:00:01:01.
    - s1.p2 — connection point for host h2. h2's IPv4 address is
              10.0.2.2 and its hardware address is 08:00:00:00:02:02.
    - s1.p3 — connection point for host h3. h3's IPv4 address is
              10.0.3.3 and its hardware address is 08:00:00:00:03:03.
    - s1.p4 — connection point for host h4. h4's IPv4 address is
              10.0.4.4 and its hardware address is 08:00:00:00:04:04.

  Although the physical ports may be reorganised by future operator
  changes, the four-host arrangement above is fixed for the purposes of
  this task.

  ## Frame eligibility

  A frame received on any of the four ports is eligible for further
  inspection by the forwarding logic only when it carries an IPv4
  datagram. Frames whose Ethernet payload is not IPv4 — for example
  ARP requests/replies, IPv6 packets, raw LLDP advertisements, or any
  unrecognised EtherType — MUST be discarded. Such frames MUST NOT
  alter any internal state, MUST NOT be forwarded out any port, and
  MUST NOT cause the switch to generate a response of any kind.
  Discarded frames are silently dropped; the switch does not emit ICMP
  errors in this task.

  ## Forwarding decision (applies to each IPv4 datagram individually)

  For every IPv4 datagram that has been admitted by the eligibility
  check above, the switch performs the following decision procedure.
  The steps are described separately for clarity but they execute in
  the data plane as part of a single per-packet pipeline.

    1. **Destination lookup against the protected-network set.** Your
       control plane installs, at the start of the task, the set of
       "protected destination networks" enumerated verbatim under
       "Control plane" below. Each entry of this set
       specifies (a) a destination IPv4 prefix, (b) the primary
       next-hop for that prefix (an egress port together with the
       Ethernet destination address to write into the forwarded frame),
       and (c) a backup next-hop with the same shape. The matching
       entry for an incoming datagram is selected by **longest-prefix
       match** on the IPv4 destination address: among the entries whose
       prefix covers the datagram's destination, the entry with the
       LARGEST prefix length wins. A datagram whose destination is not
       covered by ANY installed entry MUST be discarded.

    2. **Primary liveness probe.** Your control plane separately
       installs the list of egress ports that are currently to be
       treated as "down" (enumerated under "Control plane" below). A
       port is considered up if and only if it is NOT in
       that list. The data plane reads this list to determine whether
       the matched entry's primary egress port is currently down.

    3. **Primary path.** If the primary's egress port is up, the
       primary next-hop is selected and used in the egress step below.

    4. **Backup path.** Otherwise (the primary's egress port is down),
       the switch examines whether the matched entry's BACKUP egress
       port is itself in the down list.

         4a. If the backup's port is UP, the backup next-hop is
             selected.
         4b. If the backup's port is ALSO down — that is, both ports
             of the matched entry's pair are currently in the down
             list — the datagram MUST be discarded. No alternative
             path is taken and no third next-hop is consulted.

  The phrasing "matched entry's pair" in clause 4 refers to the SAME
  entry chosen at step 1 — i.e., the longest-prefix entry — even when
  that entry happens to be a host route (/32) embedded inside a less-
  specific entry (/24, /16) that would have chosen a different pair.
  The shorter-prefix entry's pair MUST NOT be consulted as an
  additional fallback. (This clause is what makes the longest-prefix
  selection in step 1 binding rather than advisory.)

  The mechanism in clauses 2–4 is the data-plane realisation of the
  PURR primitive: no recirculation, no control-plane upcall, no
  re-execution of the destination lookup; the decision uses exactly
  one destination lookup followed by at most one primary-port liveness
  check and at most one backup-port liveness check. The data plane
  MUST NOT discard a packet, take a backup, or take a primary based
  on a destination's liveness rather than its egress port's liveness;
  the liveness probe is keyed on the PORT, not on the host.

  ## Per-packet egress transformation (applies to admitted datagrams)

  The frame that emerges on the chosen egress port MUST satisfy ALL of
  the following requirements.

    - The output is sent on the chosen next-hop's egress port (the
      primary's port if the primary path was taken, or the backup's
      port if the backup path was taken).
    - The Ethernet destination address is rewritten to the chosen
      next-hop's destination MAC. When the backup path is selected,
      this is the BACKUP's destination MAC; it is NOT the primary's
      MAC even though they belong to the same matched entry.
    - The Ethernet source address is rewritten to the prior frame's
      Ethernet destination address — i.e., the address that the frame
      was sent TO on ingress is re-used as the address the switch
      sends FROM on egress. (This convention is local to this
      deployment; do not infer a port-specific MAC from it.)
    - The IPv4 hop count is exactly one less than on ingress.
    - Every other field of the packet — including but not limited to
      the IPv4 source address, the IPv4 destination address, any L4
      header (TCP/UDP/ICMP), and any payload — is byte-identical to
      the received packet.

  Discarded packets produce no output frame at any port and MUST NOT
  alter any internal state. The switch keeps no per-flow or
  per-destination counters, accumulates no telemetry, and emits no
  notification of the drop; the switch's only job is to forward or
  discard.

  ## Control plane

  This task is JOINT data-plane + control-plane. In addition to the P4
  program, YOU author the control-plane entries (the `entries.json` your
  submission returns). The test harness installs exactly the entries you
  emit — it reads your compiled program's P4Info and issues the
  corresponding table-add commands — and nothing else. There is no
  separate or hidden fixture: if one of the bindings below is not present
  in the entries you author, it is not installed, and any packet that
  would have matched it is discarded. Both of the following MUST be
  installed by your control plane, exactly as specified.

  ### Protected destination networks (install all six)

  Each row gives a destination prefix and its two next-hops; a next-hop
  is an egress port together with the Ethernet destination MAC to write
  into the forwarded frame. The lookup keys on the IPv4 destination by
  longest-prefix match (see step 1 above).

    - 10.0.0.0/16   → primary: s1.p4, dst-MAC 08:00:00:00:04:04
                       backup:  s1.p2, dst-MAC 08:00:00:00:02:02
    - 10.0.2.0/24   → primary: s1.p2, dst-MAC 08:00:00:00:02:02
                       backup:  s1.p3, dst-MAC 08:00:00:00:03:03
    - 10.0.3.0/24   → primary: s1.p3, dst-MAC 08:00:00:00:03:03
                       backup:  s1.p4, dst-MAC 08:00:00:00:04:04
    - 10.0.4.0/24   → primary: s1.p4, dst-MAC 08:00:00:00:04:04
                       backup:  s1.p2, dst-MAC 08:00:00:00:02:02
    - 10.0.2.55/32  → primary: s1.p4, dst-MAC 08:00:00:00:04:04
                       backup:  s1.p2, dst-MAC 08:00:00:00:02:02
    - 10.0.4.77/32  → primary: s1.p2, dst-MAC 08:00:00:00:02:02
                       backup:  s1.p3, dst-MAC 08:00:00:00:03:03

  Notes on this set, all consequences of the longest-prefix rule in
  step 1 and the "matched entry's pair is binding" rule in clause 4:

    - The 10.0.0.0/16 entry is a catch-all. Any IPv4 destination that
      falls inside 10.0.0.0/16 but is NOT covered by a more-specific
      entry above is matched by it and uses (primary s1.p4, backup
      s1.p2). For example 10.0.5.5 and 10.0.255.99 match ONLY the /16
      and are therefore forwarded via the /16's pair — they are NOT
      discarded.
    - Each /32 host route deliberately carries a DIFFERENT (primary,
      backup) pair from the /24 that encloses it. By longest-prefix
      match the /32 wins for its exact address, so 10.0.2.55 uses the
      /32's pair (not 10.0.2.0/24's) and 10.0.4.77 uses the /32's pair
      (not 10.0.4.0/24's).
    - A destination outside 10.0.0.0/16 entirely (e.g. 192.168.55.1) is
      covered by NO entry and is discarded (step 1, last sentence).

  ### Currently-down ports

  For the whole of this task run, ports s1.p2 and s1.p3 are DOWN; ports
  s1.p1 and s1.p4 are UP. Install this liveness snapshot into whatever
  structure your program uses for the port-liveness probe of step 2.
  (The switch is not asked to detect link failure itself — see "what is
  NOT part of this task" below.)

  Your P4 program defines the table/match-action structures; the
  harness's installer reads those structures from the compiled
  program's P4Info and emits the install commands for the entries you
  authored above.

  ## Notes on what is NOT part of this task

    - The switch is not asked to perform any link-failure DETECTION;
      the down list is supplied externally.
    - The switch is not asked to emit ICMP errors on drop.
    - The switch is not asked to maintain any per-flow state,
      connection-tracking table, or rate-limiting counter.
    - The switch is not asked to fragment, MTU-clamp, or otherwise
      alter the IPv4 payload size.
    - The switch is not asked to handle IPv6, MPLS, or any encapsulated
      tunnel; ONLY IPv4 datagrams.

  These exclusions are listed for clarity; do not interpret them as
  requirements to add the corresponding mechanisms in disabled form.
  The simplest data-plane realisation that satisfies the four
  forwarding-decision steps and the per-packet egress transformation
  above is the intended one.
