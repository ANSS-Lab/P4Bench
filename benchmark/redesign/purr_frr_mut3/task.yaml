  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p3: 3
      p4: 4
  links:
  - from: h1
    to: s1.p1
  - from: s1.p2
    to: h2
  - from: s1.p3
    to: h3
  - from: s1.p4
    to: h4
