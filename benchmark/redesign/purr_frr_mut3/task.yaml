- name: multi_down_10_0_4_x_uses_primary
  visibility: hidden
  description: 'Multi-port-down: p2+p3 down — 10.0.4.x''s group (primary=p4 up) MUST take primary regardless.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
    - IP:
        src: 10.0.1.1
        dst: 10.0.4.4
        ttl: 64
  expected:
    behavior: forward
    output_port: s1.p4
    transformations:
      Ether.dst:
        action: change_to
        value: 08:00:00:00:04:04
      Ether.src:
        action: change_to
        value: ff:ff:ff:ff:ff:ff
      IP.ttl:
        action: decremented_by
        delta: 1
- name: arp_frame_drop
  visibility: public
  description: Non-IPv4 (ARP ethertype) frame.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
        type: 2054
  expected:
    behavior: drop
- name: regression_conditional_deparser_smoke
  visibility: hidden
  description: Successful forward — output must be a well-formed Ether+IPv4 packet.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
    - IP:
        src: 10.0.1.1
        dst: 10.0.3.3
        ttl: 64
  expected:
    behavior: forward
    output_port: s1.p4
    transformations:
      Ether.dst:
        action: change_to
        value: 08:00:00:00:04:04
      Ether.src:
        action: change_to
        value: ff:ff:ff:ff:ff:ff
      IP.ttl:
        action: decremented_by
        delta: 1
- name: regression_std_metadata_drop_smoke_part1
  visibility: hidden
  description: 'Pre-trace: a non-IPv4 frame is dropped.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
        type: 2054
  expected:
    behavior: drop
- name: regression_std_metadata_drop_smoke_part2
  visibility: hidden
  description: After a prior-trace drop, a subsequent IPv4 forward must still succeed.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
    - IP:
        src: 10.0.1.1
        dst: 10.0.4.4
        ttl: 64
  expected:
    behavior: forward
    output_port: s1.p4
    transformations:
      Ether.dst:
        action: change_to
        value: 08:00:00:00:04:04
      Ether.src:
        action: change_to
        value: ff:ff:ff:ff:ff:ff
      IP.ttl:
        action: decremented_by
        delta: 1
scoring:
  public_weight: 0.2
  hidden_weight: 0.8
