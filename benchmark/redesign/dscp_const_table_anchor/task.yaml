    output_port: s1.p2
    transformations:
      Ether.src:
        action: unchanged
      IP.dst:
        action: unchanged
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
- name: ecn_smuggle_no_reclassify
  visibility: hidden
  description: EF with ECN=01 (TOS 185) → s1.p2 (same as ECN=0); the ECN bits neither change the class nor are rewritten on egress.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:01:00
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        tos: 185
