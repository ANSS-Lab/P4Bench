      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
- name: non_ipv4_arp_to_default
  visibility: hidden
  description: A non-IPv4 frame (ARP) has no DS field → default class s1.p4; must not classify on garbage.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
    - ARP:
        pdst: 10.0.2.2
        psrc: 10.0.1.1
  expected:
    behavior: forward
    output_port: s1.p4
    transformations:
      Ether.src:
        action: unchanged
- name: ef_dscp_not_remarked
  visibility: hidden
  description: EF packet (TOS 184) → s1.p2 with IP.tos UNCHANGED — the BA classifier forwards, it does NOT remark the DSCP.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:01:00
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        tos: 184
    - UDP:
        sport: 40000
        dport: 5000
  expected:
