        action: unchanged
      IP.dst:
        action: unchanged
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
- name: af11_header_preservation
  visibility: hidden
  description: AF11 (TOS 40) → s1.p3 with IPv4 src/dst/TTL/TOS and Ether src all UNCHANGED. Catches a TTL-decrement or MAC-rewrite.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:01:00
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        tos: 40
