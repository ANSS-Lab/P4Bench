    transformations:
      Ether.src:
        action: unchanged
      IP.dst:
        action: unchanged
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
- name: be_ecn_ignored
  visibility: hidden
  description: BE with ECN=10 (TOS 2) → s1.p4 (DSCP 0, class unchanged by ECN).
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:01:00
    - IP:
