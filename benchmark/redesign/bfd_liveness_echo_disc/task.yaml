task_name: bfd_liveness_echo_disc
task_type: full_program
complexity: medium
source: rfc
pattern: P-BFDLiveness
pattern_version: '1.0'

seed:
  sessions:
    - local_discr: 286331153
      remote_discr: 0
      local_state: Down
      remote_state: Down
      peer_ip: "10.0.1.1"
      local_ip: "10.0.0.1"
      port_binding: 1
      hop_type: single_hop
      role: active
      detect_mult: 3
      desired_min_tx_interval: 1000000
      required_min_rx_interval: 1000000
      required_min_echo_rx_interval: 0
      local_udp_src_port: 49152
    - local_discr: 572662306
      remote_discr: 0
      local_state: Down
      remote_state: Down
      peer_ip: "10.0.2.2"
      local_ip: "10.0.0.2"
      port_binding: 2
      hop_type: single_hop
      role: active
      detect_mult: 3
      desired_min_tx_interval: 1000000
      required_min_rx_interval: 1000000
      required_min_echo_rx_interval: 0
      local_udp_src_port: 49153
  session_capacity: 64
  packet_format_faithfulness: D5.3_echo_rfc5880
  origination_mode: generator_entry_table
  ttl_strictness: strict_255
  echo_enabled: true
  liveness_export: none
  failure_action_breadth: link_down_only

description: |
  A switch s1 sits between two attached hosts and runs a
  protocol-driven liveness check against each of them. The check
  follows the Bidirectional Forwarding Detection (BFD) protocol
  for single-hop IPv4 paths, per RFC 5880 (the core protocol) and
  RFC 5881 (the single-hop encapsulation). The switch terminates
  two configured BFD sessions — one with each host — and must
  consume valid BFD control packets, drop invalid ones, advance a
  per-session state machine, and reply to "Poll" requests with
  the corresponding "Final" reply. Traffic that is NOT a BFD
  control packet is unaffected — it is passed through to a
  downstream forwarding pipeline. You author both the P4 program
  and the control-plane table entries that realise these sessions
  and the forwarding pipeline (see "Control plane" below).

  ## What a BFD control packet looks like on the wire

  Every BFD control packet on this task is encapsulated as
  Ethernet + IPv4 + UDP + BFD, with UDP destination port 3784.
  Inside the UDP payload sits a 24-byte BFD section comprising:

    - A protocol version (3 bits) which MUST equal 1.
    - A 5-bit diagnostic code.
    - A 2-bit state field with values: 0=AdminDown, 1=Down,
      2=Init, 3=Up.
    - Six 1-bit flags in the following order: P (Poll), F (Final),
      C (Control Plane Independent), A (Authentication Present),
      D (Demand), M (Multipoint).
    - An 8-bit detection multiplier (MUST be nonzero).
    - An 8-bit length field (MUST be at least 24).
    - A 32-bit "My Discriminator" — the sender's session id (MUST
      be nonzero).
    - A 32-bit "Your Discriminator" — echo of the receiver's
      session id, or 0 if the sender has not yet learned it.
    - Three 32-bit time fields: Desired Min TX Interval,
      Required Min RX Interval, Required Min Echo RX Interval
      (each in microseconds).

  ## Per-packet behaviour

  For every frame s1 receives:

   1. **Non-BFD passthrough.** If the frame is NOT a BFD packet —
      i.e. NOT an IPv4 / UDP packet whose UDP destination port is
      3784 (BFD control, rules 2–6) or 3785 (BFD echo, rule 7) — it
      MUST be passed through to the downstream forwarding pipeline
      (the one your control plane installs; see "Control plane"
      below). The switch MUST NOT consume or alter such traffic
      beyond the forwarding rewrite that pipeline specifies.

   2. **Reception cascade — drop on any of the following.** For a
      BFD control packet, drop it (no state change, no response)
      if ANY of these hold:
        a. Protocol version is not 1.
        b. Length field is less than 24.
        c. Detection multiplier is 0.
        d. Multipoint (M) flag is set.
        e. My Discriminator is 0.
        f. Your Discriminator is nonzero AND no configured
           session has a matching local discriminator.
        g. The packet's IPv4 TTL is not 255 (single-hop spoof
           protection).

   3. **Session lookup.** If Your Discriminator is nonzero, look
      up the session by Your Discriminator. If Your Discriminator
      is 0, look up the session by (source IPv4 address, ingress
      port). On miss with Your Discriminator nonzero, the packet
      has already been dropped by rule 2(f). On miss with Your
      Discriminator zero, drop the packet.

   4. **State advance.** Given the looked-up session's current
      local_state and the received state field, transition per
      the following table (RFC 5880 §6.8.6). Each configured
      session begins in local_state Down (RFC 5880 §6.8.1) and
      stays there until advanced by the cascade below:

        - If received state is AdminDown: local_state → Down.
        - Else if local_state is Down:
            received state Down → local_state Init;
            received state Init → local_state Up;
            received state Up   → local_state stays Down.
        - Else if local_state is Init:
            received state Init → local_state Up;
            received state Up   → local_state Up;
            received state Down → local_state stays Init.
        - Else if local_state is Up:
            received state Down → local_state Down;
            received state {Init, Up} → local_state stays Up.

      The switch also records the received My Discriminator as
      the session's remote discriminator, and the received state
      as the session's remote_state.

   5. **Poll / Final reply.** If the received packet has the
      Poll flag set (P == 1), the switch MUST immediately emit a
      BFD control packet back to the peer with:
        - F=1, P=0;
        - Your Discriminator = received My Discriminator;
        - My Discriminator = session's local discriminator;
        - State = updated local_state;
        - Detection multiplier, Length, time fields = the
          session's configured values;
        - IPv4 TTL = 255;
        - UDP destination port = 3784, source port = session's
          configured source port;
        - Source IP and destination IP per the session's
          configured endpoints.
      The reply is emitted out the port through which the
      session's peer is reachable (same as the ingress port for
      single-hop sessions).

   6. **Consume the ingress BFD packet.** After processing,
      the original ingress BFD control packet itself MUST NOT be
      forwarded — it is the addressee of the protocol message
      and is consumed.

   7. **BFD Echo reflection.** A BFD Echo packet — an IPv4 / UDP
      packet whose UDP destination port is 3785 — MUST be reflected
      straight back to its sender: swap the IPv4 source and
      destination addresses and emit the packet out the **ingress
      port it arrived on**, leaving every other field (Ethernet
      addresses, UDP ports, TTL, payload) unchanged. Echo packets
      are NOT subject to the §6.8.6 reception cascade (no version /
      TTL / discriminator checks apply), carry no BFD control
      section, are NOT matched against any session, and do NOT
      advance any session's state machine — the switch simply loops
      the probe back so the sender can time its own forwarding path.
      In particular, the reflected packet leaves on the ingress port
      regardless of where the downstream forwarding table would
      route its (pre-swap) destination address. (RFC 5880 §6.4 /
      §6.8.9 echo function; single-hop encapsulation per RFC 5881.)

  Note: this task does NOT exercise the protocol's periodic
  origination or detection-time expiry behaviours; the harness
  injects only ingress packets, not the kind of timer events
  those rules require. Reference solutions MAY leave any
  periodic-emit or timeout-driven logic unimplemented for the
  purposes of this task; they will not be tested.

  ## Topology

  Two-host topology, with s1 terminating both sessions:
    - h1 attaches at s1.p1; h1's IPv4 address is 10.0.1.1, MAC
      08:00:00:00:01:01.
    - h2 attaches at s1.p2; h2's IPv4 address is 10.0.2.2, MAC
      08:00:00:00:02:02.
    - s1's IPv4 endpoint for the session with h1 is 10.0.0.1
      with MAC 08:00:00:00:00:01.
    - s1's IPv4 endpoint for the session with h2 is 10.0.0.2
      with MAC 08:00:00:00:00:02.

  ## Control plane

  Your submission includes the control-plane table entries (the
  `entries.json` half of the response). The evaluation harness
  installs exactly the entries you provide and nothing else, so the
  following state MUST be installed by your control plane:

    - The two BFD sessions, each binding a local discriminator to
      its (peer IPv4, ingress port, session parameters). The
      established-session lookup is keyed on the packet's Your
      Discriminator (matched against a session's local
      discriminator):
        * h1 session: local discriminator 0x11111111 (286331153),
          peer 10.0.1.1, ingress port s1.p1;
        * h2 session: local discriminator 0x22222222 (572662306),
          peer 10.0.2.2, ingress port s1.p2.
    - An initial-packet mapping from (peer IPv4, ingress port) to
      the same session, used to disambiguate the first packet of a
      session whose Your Discriminator is 0:
        * (10.0.1.1, s1.p1) → h1 session;
        * (10.0.2.2, s1.p2) → h2 session.
    - A downstream forwarding table that, for non-BFD IPv4 traffic
      from h1 to h2 (or vice versa), maps the destination IP to the
      egress port and rewrites the destination MAC:
        * dst 10.0.2.2 → egress s1.p2, dst MAC 08:00:00:00:02:02 (h2);
        * dst 10.0.1.1 → egress s1.p1, dst MAC 08:00:00:00:01:01 (h1).

  You are free to choose the table and action names and the internal
  structures used to realise this behaviour.

topology:
  switches:
    - name: s1
      device_id: 0
      ports:
        p1: 1
        p2: 2
  links:
    - from: h1
      to: s1.p1
    - from: s1.p2
      to: h2

hosts:
  h1:
    ip: 10.0.1.1/24
    mac: 08:00:00:00:01:01
    port: s1.p1
  h2:
    ip: 10.0.2.2/24
    mac: 08:00:00:00:02:02
    port: s1.p2

custom_headers:
  - file: custom_headers.py
    class: BFD
    description: "RFC 5880 §4.1 mandatory section — 24-byte BFD control header"

# Sessions 0/1 expose the following local discriminators:
#   session 0: local_discr = 0x11111111 (286331153), peer = h1
#   session 1: local_discr = 0x22222222 (572662306), peer = h2

test_cases:

# --- G1: functional correctness ---

  - name: rx_session0_first_packet_down_to_init
    visibility: public
    description: |
      Session 0, first packet of the handshake. Peer (h1) sends a
      BFD packet with My Discriminator = 0xAAAA0001, Your
      Discriminator = 0 (peer has not yet learned ours), state =
      Down. The switch resolves the session by (source IP,
      ingress port), advances local_state Down → Init, records
      remote_discr = 0xAAAA0001 and remote_state = Down. The
      ingress packet is consumed (no forward).
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 255, proto: 17}
        - UDP:   {sport: 49152, dport: 3784}
        - BFD:
            version: 1
            diag: 0
            state: 1                          # Down
            flag_P: 0
            flag_F: 0
            flag_C: 0
            flag_A: 0
            flag_D: 0
            flag_M: 0
            detect_mult: 3
            length: 24
            my_discr: 0xAAAA0001
            your_discr: 0x00000000
            desired_min_tx_interval: 1000000
            required_min_rx_interval: 1000000
            required_min_echo_rx_interval: 0
    expected:
      behavior: drop

  - name: rx_session0_second_packet_init_to_up
    visibility: hidden
    description: |
      Session 0, peer has learned our discriminator and is now
      sending state=Init. With local_state currently Init (set by
      the prior packet), local_state advances Init → Up.
    prior_inputs:
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 255, proto: 17}
          - UDP:   {sport: 49152, dport: 3784}
          - BFD:
              version: 1
              diag: 0
              state: 1                          # Down
              flag_P: 0
              flag_F: 0
              flag_C: 0
              flag_A: 0
              flag_D: 0
              flag_M: 0
              detect_mult: 3
              length: 24
              my_discr: 0xAAAA0001
              your_discr: 0x00000000
              desired_min_tx_interval: 1000000
              required_min_rx_interval: 1000000
              required_min_echo_rx_interval: 0
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 255, proto: 17}
        - UDP:   {sport: 49152, dport: 3784}
        - BFD:
            version: 1
            diag: 0
            state: 2                          # Init
            flag_P: 0
            flag_F: 0
            flag_C: 0
            flag_A: 0
            flag_D: 0
            flag_M: 0
            detect_mult: 3
            length: 24
            my_discr: 0xAAAA0001
            your_discr: 0x11111111
            desired_min_tx_interval: 1000000
            required_min_rx_interval: 1000000
            required_min_echo_rx_interval: 0
    expected:
      behavior: drop

  - name: rx_session0_poll_yields_final_reply
    visibility: public
    description: |
      Session 0 is Up. Peer sends a Poll (P=1) packet. The switch
      MUST emit a Final (F=1, P=0) reply on the ingress port,
      addressed back to the peer, with discriminators swapped and
      the session's local_state echoed back.
    prior_inputs:
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 255, proto: 17}
          - UDP:   {sport: 49152, dport: 3784}
          - BFD:
              version: 1
              diag: 0
              state: 1
              flag_P: 0
              flag_F: 0
              flag_C: 0
              flag_A: 0
              flag_D: 0
              flag_M: 0
              detect_mult: 3
              length: 24
              my_discr: 0xAAAA0001
              your_discr: 0x00000000
              desired_min_tx_interval: 1000000
              required_min_rx_interval: 1000000
              required_min_echo_rx_interval: 0
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 255, proto: 17}
          - UDP:   {sport: 49152, dport: 3784}
          - BFD:
              version: 1
              diag: 0
              state: 2
              flag_P: 0
              flag_F: 0
              flag_C: 0
              flag_A: 0
              flag_D: 0
              flag_M: 0
              detect_mult: 3
              length: 24
              my_discr: 0xAAAA0001
              your_discr: 0x11111111
              desired_min_tx_interval: 1000000
              required_min_rx_interval: 1000000
              required_min_echo_rx_interval: 0
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 255, proto: 17}
        - UDP:   {sport: 49152, dport: 3784}
        - BFD:
            version: 1
            diag: 0
            state: 3                          # Up
            flag_P: 1                         # Poll
            flag_F: 0
            flag_C: 0
            flag_A: 0
            flag_D: 0
            flag_M: 0
            detect_mult: 3
            length: 24
            my_discr: 0xAAAA0001
            your_discr: 0x11111111
            desired_min_tx_interval: 1000000
            required_min_rx_interval: 1000000
            required_min_echo_rx_interval: 0
    expected:
      behavior: forward
      output_port: s1.p1
      transformations:
        IP.src: {action: change_to, value: "10.0.0.1"}
        IP.dst: {action: change_to, value: "10.0.1.1"}
        IP.ttl: {action: change_to, value: 255}
        UDP.sport: {action: change_to, value: 49152}
        UDP.dport: {action: change_to, value: 3784}
        BFD.flag_F: {action: change_to, value: 1}
        BFD.flag_P: {action: change_to, value: 0}
        BFD.your_discr: {action: change_to, value: 0xAAAA0001}
        BFD.my_discr: {action: change_to, value: 0x11111111}
        BFD.state: {action: change_to, value: 3}

  - name: rx_session1_isolation_from_session0
    visibility: hidden
    description: |
      Session 1 (h2) is independent from session 0 (h1). A first
      packet on s1.p2 from h2 advances session 1, not session 0.
      The packet is consumed; no forward.
    input:
      port: s1.p2
      layers:
        - Ether: {src: "08:00:00:00:02:02", dst: "08:00:00:00:00:02"}
        - IP:    {src: "10.0.2.2", dst: "10.0.0.2", ttl: 255, proto: 17}
        - UDP:   {sport: 49153, dport: 3784}
        - BFD:
            version: 1
            diag: 0
            state: 1
            flag_P: 0
            flag_F: 0
            flag_C: 0
            flag_A: 0
            flag_D: 0
            flag_M: 0
            detect_mult: 3
            length: 24
            my_discr: 0xBBBB0002
            your_discr: 0x00000000
            desired_min_tx_interval: 1000000
            required_min_rx_interval: 1000000
            required_min_echo_rx_interval: 0
    expected:
      behavior: drop

  - name: rx_non_bfd_packet_passthrough
    visibility: public
    description: |
      A non-BFD packet (ICMP from h1 to h2) MUST pass through to
      the downstream forwarding pipeline your control plane
      installs; the packet leaves s1.p2 with destination MAC
      rewritten to h2's MAC.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 1}
        - ICMP:  {type: 8, code: 0, id: 1, seq: 1}
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        Ether.dst: {action: change_to, value: "08:00:00:00:02:02"}

# --- G2: resource robustness / boundary ---

  - name: drop_bfd_ttl_not_255
    visibility: hidden
    description: |
      A well-formed single-hop BFD packet with IPv4 TTL = 64
      (not 255) MUST be dropped. RFC 5881 §5 single-hop spoof
      protection.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 64, proto: 17}
        - UDP:   {sport: 49152, dport: 3784}
        - BFD:
            version: 1
            diag: 0
            state: 1
            flag_P: 0
            flag_F: 0
            flag_C: 0
            flag_A: 0
            flag_D: 0
            flag_M: 0
            detect_mult: 3
            length: 24
            my_discr: 0xAAAA0001
            your_discr: 0x00000000
            desired_min_tx_interval: 1000000
            required_min_rx_interval: 1000000
            required_min_echo_rx_interval: 0
    expected:
      behavior: drop

  - name: drop_bfd_version_mismatch
    visibility: hidden
