              flag_C: 0
              flag_A: 0
              flag_D: 0
              flag_M: 0
              detect_mult: 3
              length: 24
              my_discr: 0xAAAA0001
              your_discr: 0x00000000
              desired_min_tx_interval: 1000000
              required_min_rx_interval: 1000000
              required_min_echo_rx_interval: 0
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 255, proto: 17}
          - UDP:   {sport: 49152, dport: 3784}
          - BFD:
              version: 1
              diag: 0
              state: 2
              flag_P: 0
              flag_F: 0
              flag_C: 0
              flag_A: 0
              flag_D: 0
              flag_M: 0
              detect_mult: 3
              length: 24
              my_discr: 0xAAAA0001
              your_discr: 0x11111111
              desired_min_tx_interval: 1000000
              required_min_rx_interval: 1000000
              required_min_echo_rx_interval: 0
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 255, proto: 17}
        - UDP:   {sport: 49152, dport: 3784}
        - BFD:
            version: 1
