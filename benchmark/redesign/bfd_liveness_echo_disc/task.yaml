      After this packet, session 0 is Down. We verify by sending
      a follow-up Down packet from the peer; the response cycle
      restarts (Down → Init).

      This test sends only the AdminDown packet (state=0). It is
      consumed; no forward.
    prior_inputs:
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 255, proto: 17}
