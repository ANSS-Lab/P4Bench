# --- G4: BFD Echo reflection (R5) ---

  - name: echo_reflects_back_on_ingress_p1
    visibility: public
    description: |
      A BFD Echo packet (UDP destination port 3785) from h1 MUST be
      reflected back out the ingress port with its IPv4 source and
      destination addresses swapped; every other field is unchanged.
      Echo is not subject to the BFD control reception cascade and
      does not touch any session.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 64, proto: 17}
        - UDP:   {sport: 50000, dport: 3785}
    expected:
      behavior: forward
      output_port: s1.p1
      transformations:
        IP.src: {action: change_to, value: "10.0.0.1"}
        IP.dst: {action: change_to, value: "10.0.1.1"}

  - name: echo_reflects_back_on_ingress_p2
    visibility: hidden
    description: |
      Session-2 side echo: a BFD Echo packet from h2 on s1.p2 is
      reflected back out s1.p2 with IPv4 src/dst swapped.
    input:
      port: s1.p2
      layers:
        - Ether: {src: "08:00:00:00:02:02", dst: "08:00:00:00:00:02"}
        - IP:    {src: "10.0.2.2", dst: "10.0.0.2", ttl: 255, proto: 17}
        - UDP:   {sport: 50001, dport: 3785}
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        IP.src: {action: change_to, value: "10.0.0.2"}
        IP.dst: {action: change_to, value: "10.0.2.2"}

  - name: echo_reflected_on_ingress_not_routed_by_dst_ip
    visibility: hidden
    description: |
      An echo packet on s1.p1 whose IPv4 destination is h2's address
      (10.0.2.2) — which the downstream forwarding table would send
      out s1.p2 — MUST still be reflected out the INGRESS port s1.p1,
      not routed by destination IP. IPv4 src/dst are swapped.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 255, proto: 17}
        - UDP:   {sport: 53000, dport: 3785}
    expected:
      behavior: forward
      output_port: s1.p1
      transformations:
        IP.src: {action: change_to, value: "10.0.2.2"}
        IP.dst: {action: change_to, value: "10.0.1.1"}

  - name: echo_reflects_without_session_or_spoof_check
    visibility: hidden
    description: |
      Echo carries no session binding: a packet on s1.p2 with source
      IP 10.0.1.1 (h1's address, which would FAIL the BFD control
      spoof check on this port) is still reflected, because echo is a
      pure loopback with no (source IP, ingress port) session lookup.
      Reflected out s1.p2 with IPv4 src/dst swapped.
    input:
      port: s1.p2
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:02"}
        - IP:    {src: "10.0.1.1", dst: "10.0.0.2", ttl: 255, proto: 17}
        - UDP:   {sport: 52000, dport: 3785}
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        IP.src: {action: change_to, value: "10.0.0.2"}
        IP.dst: {action: change_to, value: "10.0.1.1"}

  - name: echo_reflects_regardless_of_ttl
    visibility: hidden
    description: |
      Echo packets are exempt from the single-hop TTL=255 rule that
      applies to BFD control packets: a TTL=200 echo on s1.p1 is
      still reflected (out s1.p1, IPv4 src/dst swapped, TTL left
      unchanged), whereas a TTL=200 BFD control packet would be
      dropped.
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 200, proto: 17}
        - UDP:   {sport: 54000, dport: 3785}
    expected:
      behavior: forward
      output_port: s1.p1
      transformations:
        IP.src: {action: change_to, value: "10.0.0.1"}
        IP.dst: {action: change_to, value: "10.0.1.1"}
