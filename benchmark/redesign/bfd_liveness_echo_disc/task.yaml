# --- G3: security / bypass / regression for v1model bug patterns ---

  - name: spoof_bfd_wrong_source_drops
    visibility: hidden
    description: |
      Off-link spoof: a BFD packet for session 0 arrives on s1.p2
      (h2's port, not h1's) with source IP 10.0.1.1 (claiming to
      be h1). Because the initial-packet session_lookup keys on
      (source_ip, ingress_port), the spoof MUST NOT bind to
      session 0; the lookup misses on both tables (your_discr=0
      with no (10.0.1.1, p2) match; your_discr != 0 would also
      miss). MUST drop.
    input:
      port: s1.p2
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:02"}
        - IP:    {src: "10.0.1.1", dst: "10.0.0.2", ttl: 255, proto: 17}
        - UDP:   {sport: 49152, dport: 3784}
        - BFD:
            version: 1
            diag: 0
            state: 1
            flag_P: 0
            flag_F: 0
            flag_C: 0
            flag_A: 0
            flag_D: 0
            flag_M: 0
            detect_mult: 3
            length: 24
            my_discr: 0xAAAA0001
            your_discr: 0x00000000
            desired_min_tx_interval: 1000000
            required_min_rx_interval: 1000000
            required_min_echo_rx_interval: 0
    expected:
      behavior: drop

  - name: regression_std_metadata_drop_smoke
    visibility: hidden
    description: |
      Cross-packet contamination check. After a malformed BFD packet is dropped (R1), the
      subsequent non-BFD ICMP forward MUST proceed normally. A
      reference that reads `standard_metadata.drop` to test "was
      the previous packet dropped?" cross-contaminates the
      decision and would fail this test.
    prior_inputs:
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 255, proto: 17}
          - UDP:   {sport: 49152, dport: 3784}
          - BFD:
              version: 1
              diag: 0
              state: 1
              flag_P: 0
              flag_F: 0
              flag_C: 0
              flag_A: 0
              flag_D: 0
              flag_M: 1                      # malformed (M bit set)
              detect_mult: 3
              length: 24
              my_discr: 0xAAAA0001
              your_discr: 0x00000000
              desired_min_tx_interval: 1000000
              required_min_rx_interval: 1000000
              required_min_echo_rx_interval: 0
    input:
      port: s1.p1
      layers:
        - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
        - IP:    {src: "10.0.1.1", dst: "10.0.2.2", ttl: 64, proto: 1}
        - ICMP:  {type: 8, code: 0, id: 1, seq: 1}
    expected:
      behavior: forward
      output_port: s1.p2
      transformations:
        Ether.dst: {action: change_to, value: "08:00:00:00:02:02"}

  - name: regression_conditional_deparser_on_reply
    visibility: hidden
    description: |
      Conditional-deparser check.
      The Final reply emitted by the Poll/Final rule MUST carry
      a full Eth+IPv4+UDP+BFD layer stack with all fields
      intact. References that conditionally emit the BFD header
      inside the deparser ("packet.emit(hdr.bfd)" inside an
      `if`) silently corrupt the reply when the condition
      mis-evaluates. Same scenario as
      rx_session0_poll_yields_final_reply, but asserts the
      BFD field values bit-equal.
    prior_inputs:
      - port: s1.p1
        layers:
          - Ether: {src: "08:00:00:00:01:01", dst: "08:00:00:00:00:01"}
          - IP:    {src: "10.0.1.1", dst: "10.0.0.1", ttl: 255, proto: 17}
          - UDP:   {sport: 49152, dport: 3784}
          - BFD:
              version: 1
