- name: request_on_server_port_drop
  visibility: hidden
  goal_class: G3
  description: A bootstrap request seen arriving from the server side is in the wrong direction (the relay only forwards requests received from clients) and is dropped.
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 0a:00:00:00:00:10
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.1.50
        dst: 255.255.255.255
        ttl: 64
        proto: 17
    - UDP:
        sport: 68
        dport: 67
    - DHCP:
        op: 1
        hops: 0
        xid: 2882338817
        giaddr: 0.0.0.0
  expected:
    behavior: drop
- name: reply_on_access_port_drop
  visibility: hidden
  goal_class: G3
  description: A bootstrap reply seen arriving from the client side is in the wrong direction (the relay only returns replies received from the server) and is dropped.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:20
        dst: 08:00:00:00:02:01
    - IP:
        src: 192.168.100.10
        dst: 192.168.100.1
        ttl: 64
        proto: 17
    - UDP:
        sport: 67
        dport: 68
    - DHCP:
        op: 2
        hops: 1
        xid: 2882338817
        giaddr: 10.0.1.1
  expected:
    behavior: drop
- name: non_dhcp_udp_drop
  visibility: hidden
  goal_class: G3
  description: A UDP frame that is not a bootstrap message (a different application port) is outside the relay's scope and is dropped.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:10
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.1.51
        dst: 192.168.100.10
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 53
  expected:
    behavior: drop
- name: non_ipv4_drop
  visibility: hidden
  goal_class: G3
  description: A non-IPv4 frame (ARP) on the access link is outside the relay's scope and is dropped.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:10
        dst: 08:00:00:00:01:01
        type: 2054
    - ARP:
        op: 1
        psrc: 10.0.1.52
        pdst: 10.0.1.1
  expected:
    behavior: drop
