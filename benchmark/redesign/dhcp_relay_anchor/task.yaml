- name: reply_unknown_giaddr_drop
  visibility: hidden
  goal_class: G2
  description: A server reply whose gateway address names no interface the relay serves is dropped.
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 0a:00:00:00:00:20
        dst: 08:00:00:00:02:01
    - IP:
        src: 192.168.100.10
        dst: 192.168.100.1
        ttl: 64
        proto: 17
    - UDP:
