task_name: ecmp_selector_anchor
task_type: full_program
complexity: medium
source: rfc
pattern: P-ECMPSelector
pattern_version: '1.0'
seed:
  routes:
  - dst_prefix: 10.0.2.0/24
    next_hop_ports:
    - s1.p2
    - s1.p3
    - s1.p4
  miss_behaviour: drop
description: |
  Implement an equal-cost multipath (ECMP) forwarder on a single switch s1, per
  RFC 2992. For each IPv4 packet, look up its destination address by longest-
  prefix match to find a GROUP of equal-cost next-hop ports, then choose ONE of
  those ports for the packet and forward it there. There is no per-flow state.

  ## Routing policy (control-plane installed)

   - Destination in 10.0.2.0/24 → an equal-cost group of next-hop ports
     {s1.p2, s1.p3, s1.p4}: forward the packet out exactly ONE of these.
   - Any other destination, and any non-IPv4 frame → drop.

  ## How the next-hop is chosen

  The next-hop for a packet is selected by hashing the packet's flow identity —
  its 5-tuple (IPv4 source address, IPv4 destination address, IP protocol, L4
  source port, L4 destination port) — and using the hash to pick one member of
  the group. The selection MUST satisfy the two RFC 2992 properties:

   1. CONSISTENCY: every packet belonging to the same flow (same 5-tuple) is
      forwarded out the SAME next-hop port, so a TCP stream is never reordered.
      The choice must depend ONLY on the 5-tuple — never on a field that varies
      packet-to-packet within a flow such as the TTL or the IPv4 identification.
   2. DISTRIBUTION: across many distinct flows, the traffic spreads over the
      group — the next-hop is genuinely a function of the hash, not a constant.

  The chosen next-hop port MUST always be a member of the matched group.

  ## Required behaviour / invariants

   - A flow's packets all leave on one group member (consistency).
   - Distinct flows use ≥ 2 of the group's members (distribution).
   - The egress port is always one of the matched group's members.
   - A packet whose destination matches no route, and any non-IPv4 frame, is
     dropped (the switch must declare an explicit miss/default behaviour).

  ## Topology

  One switch s1. Ingress is s1.p1; the equal-cost next-hops are s1.p2, s1.p3,
  s1.p4. (Port s1.p5 is present but unused at this configuration.)
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p3: 3
      p4: 4
      p5: 5
  links:
  - from: h1
    to: s1.p1
  - from: s1.p2
    to: h2
  - from: s1.p3
    to: h3
  - from: s1.p4
    to: h4
  - from: s1.p5
    to: h5
hosts:
  h1:
    ip: 10.0.1.1
    mac: 08:00:00:00:01:01
    port: s1.p1
  h2:
    ip: 10.0.2.2
    mac: 08:00:00:00:02:02
    port: s1.p2
  h3:
    ip: 10.0.3.3
    mac: 08:00:00:00:03:03
    port: s1.p3
  h4:
    ip: 10.0.4.4
    mac: 08:00:00:00:04:04
    port: s1.p4
  h5:
    ip: 10.0.5.5
    mac: 08:00:00:00:05:05
    port: s1.p5
