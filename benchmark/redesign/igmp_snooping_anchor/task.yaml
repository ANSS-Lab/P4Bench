description: |-
  Implement an L2 multicast switch for BMv2 (v1model) that learns multicast
  group membership directly in the data plane by observing IGMP messages, and
  delivers multicast traffic only to the hosts that asked for it.

  Topology: one switch with four host ports (p1..p4) sharing a single multicast
  domain. Both the P4 program and any table / multicast-group entries are yours
  to author.

  Required behaviour, per IPv4 packet:

  - Membership signalling. IGMP messages (IPv4 protocol 2) carry a message type
    and a multicast group address. A Membership Report (an IGMPv2 report, type
    0x16, or an IGMPv1 report, type 0x12) means the host on the ingress port
    wants to receive the named group: that port becomes a member of that group.
    A Leave Group message (type 0x17) means the host on the ingress port no
    longer wants the group: that port stops being a member. A Membership Query
    (type 0x11) causes no membership change here. Joining a port that is already
    a member, or leaving a group a port never joined, has no extra effect. An
    IGMP message is consumed by the switch — it is never itself delivered as
    multicast traffic to the member hosts.

  - Multicast delivery. A multicast data packet (an IPv4 packet that is not IGMP,
    whose destination is a multicast address in 224.0.0.0/4) must be delivered to
    exactly the set of ports that are currently members of its group, and to no
    others — never to non-member ports, and never back out the port it arrived
    on. If the group currently has no members, the packet is dropped. The packet
    is delivered unmodified. Address range 224.0.0.0/24 is treated like any other
    multicast group.

  - Membership is learned only from the IGMP messages above; ordinary multicast
    data packets never change which ports belong to a group. A port's membership
    in a group persists until that port leaves the group — there is no timeout.

  Anything that is not IPv4, and any IPv4 unicast traffic, is out of scope and
  dropped.

  The observable outcome is which ports receive a multicast data packet after a
  sequence of joins and leaves. Your switch must compute the live member set from
  the full history of those messages, not from a fixed configuration.
test_cases:
- name: join_then_data_to_member
  visibility: public
  goal_class: G1
  description: A host on port 2 sends an IGMP Membership Report for a multicast group; then a multicast data packet for that group arrives on port 1. The data is delivered only to port 2 (the joined port) and to no other port.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 01:00:5e:01:01:01
    - IP:
        src: 10.0.0.1
        dst: 239.1.1.1
        ttl: 64
        proto: 17
    - UDP:
        sport: 5000
        dport: 1234
  expected:
    behavior: multicast
    output_ports:
    - s1.p2
  prior_inputs:
  - port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 01:00:5e:01:01:01
    - IP:
        src: 10.0.0.2
        dst: 239.1.1.1
        ttl: 1
        proto: 2
    - IGMP:
        type: 22
        mrtime: 0
        chksum: 0
        gaddr: 239.1.1.1
