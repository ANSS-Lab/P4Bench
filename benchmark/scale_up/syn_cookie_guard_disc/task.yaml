- name: cookie_bound_to_4tuple_cross_replay_dropped
  visibility: hidden
  description: A cookie minted for flow A (source port 40001) is replayed inside an ACK on flow B's 4-tuple (source port 40002). Because the cookie binds all four 4-tuple fields, flow B recomputes a different
    cookie and the replay is dropped. Catches a partial-key or constant cookie.
