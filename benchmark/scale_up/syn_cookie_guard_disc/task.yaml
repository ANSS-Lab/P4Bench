task_name: syn_cookie_guard_disc
task_type: full_program
complexity: high
source: rfc
pattern: P-SYNCookieGuard
pattern_version: '1.0'
seed:
  protected_servers:
  - 10.0.2.2
  whitelist:
  - 10.0.9.0/24
  cookie_faithfulness: D5.0_truncated_hash
  faithfulness: D5.0_truncated_hash
  cookie_hash_algo: custom_keyed
  cookie_secret: 1516992653
  state_capacity: unbounded
  eviction_policy: none
  idle_timeout_s: 300
  cookie_validity_epochs: 1
  epoch_period_s: 64
  track_halfopen: false
  halfopen_capacity: 1024
  syn_rate_activation: false
  syn_rate_threshold: 128
  reference_impl_shown: false
description: "A switch s1 stands in front of a single protected server and shields it from\nTCP SYN-flood resource exhaustion. Rather than letting every connection attempt\nconsume server-side connection\
  \ state, the switch answers an unestablished\nconnection attempt with a stateless cryptographic challenge and only lets a\nflow through once the challenge is answered correctly. The approach follows the\n\
  SYN-cookie mechanism described in RFC 4987 (TCP SYN Flooding Attacks and Common\nMitigations).\n\n## Topology and roles\n  - s1.p1 \u2014 the side facing untrusted clients; connection attempts arrive\
  \ here.\n    A client used in the tests holds 10.0.1.1 (hardware address\n    08:00:00:00:01:01).\n  - s1.p2 \u2014 the side facing the protected server, which holds 10.0.2.2\n    (hardware address 08:00:00:00:02:02).\n\
  \  - The protected server is 10.0.2.2; its TCP service is on port 80.\n  - A trusted source prefix 10.0.9.0/24 is exempt from the challenge.\n  - A fixed secret value 0x5A6B788D is shared by the challenge\
  \ and its\n    verification (it does not change during the task).\n\n## The cookie value\n  For a connection attempt the switch derives a 32-bit cookie from the\n  connection's own identity and the shared\
  \ secret, using 32-bit wrapping\n  arithmetic:\n\n      let k      = (source port << 16) | destination port\n      cookie     = (source IPv4 address + destination IPv4 address\n                    + k\
  \ + 0x5A6B788D)  modulo 2^32\n\n  The four-tuple (source address, destination address, source port,\n  destination port) and the secret fully determine the cookie; nothing else\n  enters it. Two connection\
  \ attempts that differ in any one of those fields\n  yield different cookies.\n\n## Behaviour, in priority order (first applicable wins)\n  1. A non-IPv4 frame is discarded.\n  2. A packet whose destination\
  \ is not the protected server is forwarded\n     normally toward its next hop: its hop count is decremented by one and its\n     Ethernet destination is set to that next hop. The switch is transparent\n\
  \     outside the protected server.\n  3. A non-TCP packet addressed to the protected server is forwarded toward the\n     server in the same way (hop count decremented, Ethernet destination set to\n\
  \     the server). The challenge applies only to TCP.\n  4. A TCP packet addressed to the protected server whose source address lies\n     in the trusted prefix is forwarded to the server (hop count decremented,\n\
  \     Ethernet destination set to the server's). Trusted sources are never\n     challenged.\n  5. A TCP packet addressed to the protected server that belongs to a\n     connection the switch has already\
  \ admitted is forwarded to the server in\n     the same way.\n  6. A pure connection-open request to the protected server (the SYN flag set,\n     the ACK flag clear) for which no admitted connection\
  \ exists is answered by\n     a switch-originated reply sent back toward the originator, and the original\n     request is consumed (NOT forwarded to the server). The reply:\n        - is addressed back\
  \ to the originator (the IPv4 addresses and the TCP\n          port numbers of the request are swapped);\n        - has both the SYN and ACK flags set;\n        - carries, as its sequence number, the\
  \ cookie for the request's\n          four-tuple;\n        - acknowledges the request (its acknowledgement number is the request's\n          sequence number plus one);\n        - is a complete, well-formed\
  \ Ethernet/IPv4/TCP packet that an unmodified\n          receiver would accept (in particular both the IPv4 and the TCP\n          checksums are valid for the emitted bytes), with a fresh hop count.\n\
  \     Crucially, answering the request creates NO per-connection state on the\n     switch: an unanswered challenge leaves no footprint, which is what lets the\n     switch absorb a flood the server's\
  \ own connection backlog could not.\n  7. A pure acknowledgement to the protected server (the ACK flag set, the SYN\n     flag clear) for which no admitted connection exists is admitted only if its\n\
  \     acknowledgement number, minus one, equals the cookie for its own\n     four-tuple. On a match the switch records the connection as admitted and\n     forwards the packet to the server (hop count\
  \ decremented, Ethernet\n     destination set to the server's). The acknowledgement number minus one not\n     matching the cookie means the packet is NOT admitted.\n  8. Any other TCP packet addressed\
  \ to the protected server (an acknowledgement\n     whose cookie does not check out, an unusual flag combination, a stray\n     segment) is discarded.\n\n## On discard\n  A discarded packet produces no\
  \ output toward the server and MUST NOT create,\n  remove, or alter any admitted-connection record. In particular, a connection\n  is recorded as admitted ONLY by rule 7 (a correctly answered challenge)\
  \ and\n  NEVER by rule 6 (a connection-open request).\n\n## Control plane\n  The next-hop forwarding information (which port and Ethernet address reach a\n  given destination) is supplied externally;\
  \ the switch does not invent it.\n"
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
  links:
  - from: h_cli
    to: s1.p1
  - from: s1.p2
    to: h_srv
hosts:
  h_cli:
    ip: 10.0.1.1/24
    mac: 08:00:00:00:01:01
    port: s1.p1
  h_srv:
    ip: 10.0.2.2/24
    mac: 08:00:00:00:02:02
    port: s1.p2
test_cases:
- name: syn_to_protected_not_forwarded
  visibility: public
  description: 'A pure SYN from an untrusted client to the protected server with no established connection MUST trigger a stateless cookie challenge: the guard answers with a switch-originated SYN-ACK toward
    the client and does NOT forward the SYN onward to the server. Observable effect: no packet reaches the server port (the SYN-ACK leaves back toward the client). A guard that forwards the SYN to the server
    fails here.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 1
        proto: 6
    - TCP:
        sport: 40001
        dport: 80
        flags: S
        seq: 268435456
        ack: 0
  expected:
    behavior: drop
- name: valid_cookie_ack_admits_and_forwards
  visibility: public
  description: 'A returning ACK whose acknowledgement number equals cookie+1 for its own 4-tuple validates the challenge: the guard pins the flow to the established table and forwards the ACK to the server,
    decrementing TTL and rewriting the destination MAC to the server''s.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 1
        proto: 6
    - TCP:
        sport: 40001
        dport: 80
        flags: A
        seq: 268435457
        ack: 179076065
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.dst:
        action: unchanged
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:02
