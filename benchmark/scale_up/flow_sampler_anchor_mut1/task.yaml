task_name: flow_sampler_anchor_mut1
task_type: full_program
complexity: medium
source: rfc
pattern: P-FlowSampler
pattern_version: '1.0'
seed:
  egress_map:
  - dst: 10.0.1.1
    egress_port: 1
  - dst: 10.0.2.2
    egress_port: 2
  default_egress: 2
  non_ipv4_egress: 2
  sample_rate: 2
  collector_port: 3
  sampler_scope: global
  sampler_cells: 1
  sample_header: none
  hash_algo: crc32
  faithfulness: D5.0_count_based
description: "Implement a deterministic 1-in-N packet sampler on a single switch s1, in the\nspirit of an sFlow-style telemetry agent (RFC 3176) under the flow-selection\nframework of RFC 7014. The switch\
  \ forwards every packet normally and, on a\nfixed, repeating schedule, also delivers a copy of selected packets to a\ndedicated telemetry collector port.\n\n## Required behaviour\n\n - The switch maintains\
  \ an internal packet counter that advances by exactly one\n   for every IPv4 packet it processes, in arrival order.\n - Every IPv4 packet is forwarded on its normal egress port according to the\n   destination\
  \ policy below. Forwarding is non-destructive: the forwarded packet\n   is delivered unchanged (no header field is rewritten and no hop count is\n   decremented).\n - On every Nth IPv4 packet \u2014 that\
  \ is, whenever the counter reaches an exact\n   multiple of the sampling interval N = 2 \u2014 the switch ALSO delivers a verbatim\n   copy of that packet to the telemetry collector port. This sample\
  \ is additive:\n   the original packet is still forwarded normally on its egress. Sampling is\n   deterministic and count-based: the copy is emitted on exactly the 2nd, 4th,\n   6th, ... packet and on\
  \ no others.\n - A packet that is not on a sampling boundary is forwarded only; no copy is\n   delivered to the collector port. The collector port carries sampled copies\n   only \u2014 never a mis-routed\
  \ original.\n - A frame that is not IPv4 is forwarded on its static egress but is NOT sampled\n   and MUST NOT advance the sampler counter (the sampler observes the IPv4\n   packet stream only).\n - The\
  \ sampled copy preserves the original packet's headers and payload (it is a\n   copy, not a move); the original in flight is not mutated by the sampling.\n\n## Forwarding policy (destination \u2192 egress)\n\
  \nThe control plane installs these as table entries.\n\n    | destination IP | egress port |\n    |----------------|-------------|\n    | 10.0.1.1       | s1.p1       |\n    | 10.0.2.2       | s1.p2 \
  \      |\n\nA packet whose destination is not listed is forwarded on the default egress\ns1.p2. The telemetry collector is s1.p3 \u2014 distinct from every forwarding egress.\n\n## Topology\n\nOne switch\
  \ s1 with three ports:\n  - h1 at s1.p1. IPv4 10.0.1.1, MAC 08:00:00:00:01:01.\n  - h2 at s1.p2. IPv4 10.0.2.2, MAC 08:00:00:00:02:02.\n  - the telemetry collector at s1.p3 (receives sampled copies only).\n"
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p3: 3
  links:
  - from: h1
    to: s1.p1
  - from: s1.p2
    to: h2
  - from: s1.p3
    to: collector
hosts:
  h1:
    ip: 10.0.1.1
    mac: 08:00:00:00:01:01
    port: s1.p1
  h2:
    ip: 10.0.2.2
    mac: 08:00:00:00:02:02
    port: s1.p2
  collector:
    ip: 10.0.3.3
    mac: 08:00:00:00:03:03
    port: s1.p3
test_cases:
- name: single_packet_forwarded_not_sampled
  visibility: public
  description: A single IPv4 packet on a fresh switch is forwarded on its normal egress and is NOT sampled (the sampler counter reaches 1, which is not a multiple of the sampling interval). No copy appears
    on the telemetry collector port.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 2
        proto: 6
    - TCP:
        sport: 5000
        dport: 80
        flags: S
  expected:
    behavior: forward
    output_port: s1.p2
- name: nth_packet_is_sampled_to_collector
  visibility: public
  description: 'After 1 identical packets have advanced the counter, the next (the 2th) packet is forwarded on its normal egress AND a verbatim copy of it is mirrored to the telemetry collector port. The
    sample is additive: the original is still forwarded normally.'
  prior_inputs:
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        proto: 6
    - TCP:
        sport: 5000
        dport: 80
        flags: S
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
