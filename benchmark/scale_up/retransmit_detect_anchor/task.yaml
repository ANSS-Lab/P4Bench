task_name: retransmit_detect_anchor
task_type: full_program
complexity: medium
source: paper
pattern: P-RetransmitDetect
pattern_version: '1.0'
seed:
  forward_port: 2
  collector_port: 3
  detect_marker_field: ipv4_dscp_bit
  flow_capacity: unbounded
  eviction: none
  seq_faithfulness: D8.0_byte_range
  hash_algo: crc32
  observable_surface: mark_count_mirror
  count_strictness: false
failure_modes:
- mark_rewound_by_stale_retransmit
- retransmit_dropped_instead_of_forwarded
- payload_len_misderived_reads_ack_as_data
- no_modulo_2_32_wrap_handling
- mirror_omitted_or_orphaned
- marker_set_on_every_segment_or_never
- distinct_flows_share_one_mark
description: "Implement an in-network TCP retransmission / loss detector on a single switch\ns1. The switch tracks, per TCP flow, the highest data byte it has forwarded so\nfar, and flags any data segment\
  \ that re-sends bytes it has already forwarded \u2014\nevidence of upstream loss or a spurious retransmission timeout. Detection is\nnon-destructive: a flagged segment is still delivered. Inspired by\
  \ LossRadar\n(Li et al., CoNEXT 2016) and Dapper (Ghasemi et al., SOSR 2017).\n\n## Topology\n\nOne switch s1 with three ports:\n  - s1.p1 \u2014 the sender side; monitored TCP traffic arrives here.\n\
  \  - s1.p2 \u2014 the FORWARD port; every forwarded segment leaves here.\n  - s1.p3 \u2014 the COLLECTOR port; a mirrored copy of each detected\n            retransmission is sent here (telemetry sink).\n\
  \nHosts: h_a (10.0.1.1) on s1.p1, h_b (10.0.2.2) reachable via s1.p2, and a\ntelemetry collector on s1.p3.\n\n## Flow and sequence model\n\nA flow is identified by the 5-tuple (IPv4 source, IPv4 destination,\
  \ IP\nprotocol, TCP source port, TCP destination port). For a TCP data segment, the\nnumber of data bytes it carries is the IPv4 total length minus the IPv4 header\nlength minus the TCP header length;\
  \ a segment whose data length is zero is a\ncontrol segment (SYN / FIN / RST / bare ACK). A data segment occupies the byte\nrange that starts at its TCP sequence number and spans its data-byte count;\
  \ the\nfar edge of that range is (sequence number + data byte count). Sequence numbers\nadvance over the connection's byte stream and wrap modulo 2^32.\n\nFor each flow the switch maintains the highest\
  \ forwarded byte index seen so far\n(the high-water mark): the largest far edge of any data segment forwarded for\nthat flow, modulo 2^32.\n\n## Required behaviour (numbered MUST / MUST-NOT)\n\n  1. A\
  \ frame that is not a TCP-over-IPv4 segment MUST be forwarded unchanged on\n     the forward port (s1.p2). It MUST NOT be dropped and MUST NOT be flagged \u2014\n     this is a transport monitor, not\
  \ a filter.\n  2. A TCP segment carrying zero data bytes (a control / pure-ACK segment) MUST\n     be forwarded unchanged on the forward port. It MUST NOT alter any flow's\n     high-water mark and MUST\
  \ NOT be flagged.\n  3. The first data segment of a previously-unseen flow MUST be forwarded\n     unflagged, and the flow's high-water mark MUST be established at that\n     segment's far edge.\n  4.\
  \ A data segment whose far edge is strictly greater than the flow's current\n     high-water mark is new (in-order or gap-filling) data: it MUST be forwarded\n     unflagged, and the high-water mark MUST\
  \ be advanced to the segment's far\n     edge.\n  5. A data segment whose far edge is at or below the flow's current high-water\n     mark re-sends already-forwarded bytes \u2014 it is a RETRANSMISSION.\
  \ On a\n     retransmission the switch MUST:\n       a. set a detected-marker bit on the segment (the low bit of the IPv4\n          DSCP field \u2014 i.e. the egress packet's IPv4 type-of-service byte\n\
  \          becomes 4 where an unflagged segment leaves it 0);\n       b. send a mirrored copy of the segment to the collector port (s1.p3) in\n          addition to forwarding it;\n       c. still forward\
  \ the segment on the forward port (s1.p2);\n       d. NOT advance the high-water mark.\n     The forwarded copy and the mirrored copy both carry the detected-marker\n     bit. The IPv4 source and destination\
  \ addresses MUST be left unchanged on\n     every copy.\n  6. The high-water mark is non-decreasing per flow: a retransmission MUST NOT\n     lower it, and distinct flows have independent marks.\n\n##\
  \ Comparisons are modulo 2^32\n\nAll sequence comparisons MUST be performed in modulo-2^32 arithmetic so a\nsegment whose far edge wraps past zero is still classified correctly.\n\n## Control plane\n\n\
  The switch maps the sender-side ingress to the forward port and the collector\nport. Any control-plane entries your design needs (e.g. an egress-port table)\nare installed by your own control plane; the\
  \ test harness provides only the\npacket stream.\n"
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p3: 3
  links:
  - from: h_a
    to: s1.p1
  - from: s1.p2
    to: h_b
  - from: s1.p3
    to: collector
hosts:
  h_a:
    ip: 10.0.1.1
    mac: 08:00:00:00:01:01
    port: s1.p1
  h_b:
    ip: 10.0.2.2
    mac: 08:00:00:00:02:02
    port: s1.p2
  collector:
    ip: 10.0.3.3
    mac: 08:00:00:00:03:03
    port: s1.p3
test_cases:
- name: first_segment_forward_no_flag
  visibility: public
  description: "The first data segment of a new TCP flow (h_a:5000 \u2192 h_b:80, seq=1000, 64 bytes) establishes the per-flow high-water mark and is forwarded out the forward port with the detected-marker\
    \ bit CLEAR and no mirrored copy. There is no prior byte range it could have re-sent."
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 63
        proto: 6
        tos: 0
    - TCP:
        sport: 5000
        dport: 80
        seq: 1000
        flags: A
    - Raw:
        load_hex: abababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.src:
        action: unchanged
      IP.dst:
        action: unchanged
      IP.tos:
        action: change_to
        value: 0
- name: in_order_advance_no_flag
  visibility: public
  description: "After the first 64-byte segment (seq 1000) the next in-order segment (seq=1064, 64 bytes) advances the flow's high-water mark to 1128 and is forwarded unflagged \u2014 its far edge exceeds\
    \ the stored mark, so it is new data, not a retransmission."
  prior_inputs:
  - port: s1.p1
    layers: &id001
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        proto: 6
        tos: 0
    - TCP:
        sport: 5000
        dport: 80
        seq: 1000
        flags: A
    - Raw:
        load_hex: abababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 63
        proto: 6
        tos: 0
    - TCP:
        sport: 5000
        dport: 80
        seq: 1064
        flags: A
    - Raw:
        load_hex: abababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.src:
        action: unchanged
      IP.dst:
        action: unchanged
      IP.tos:
        action: change_to
        value: 0
- name: retransmit_detected_flag_and_mirror
  visibility: public
  description: "Re-sending the first segment (seq=1000, 64 bytes) re-sends bytes already covered by the flow's forwarded byte stream \u2014 a retransmission. The switch sets the detected-marker bit, mirrors\
    \ a copy to the telemetry collector port, and STILL forwards the segment on the forward port. Both the forwarded and the mirrored copy carry the marker."
  prior_inputs:
  - port: s1.p1
    layers: *id001
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 63
        proto: 6
        tos: 0
    - TCP:
        sport: 5000
        dport: 80
        seq: 1000
        flags: A
    - Raw:
        load_hex: abababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababababab
  expected:
    behavior: forward
    output_ports:
    - s1.p2
    - s1.p3
    transformations:
      IP.tos:
        action: change_to
        value: 4
      IP.src:
        action: unchanged
      IP.dst:
        action: unchanged
- name: non_tcp_passthrough_no_flag
  visibility: public
  description: 'A non-TCP frame (UDP) is forwarded unchanged on the forward port with the detected-marker bit CLEAR. The NF is transport-assistance, not a filter: it neither drops nor flags non-TCP traffic.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 63
        proto: 17
        tos: 0
    - UDP:
        sport: 5000
        dport: 53
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.src:
        action: unchanged
      IP.dst:
        action: unchanged
      IP.tos:
        action: change_to
        value: 0
