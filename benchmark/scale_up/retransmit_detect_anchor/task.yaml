- name: retransmit_does_not_rewind_mark
  visibility: hidden
  description: "After advancing the mark to 1128 (segments 1000 then 1064), re-sending the FIRST segment (seq=1000) is flagged as a retransmission, AND the mark stays at 1128: a later in-order segment at\
    \ 1128 must still be accepted as new. This test packet is the stale retransmit \u2014 it is detected and must not rewind the high-water mark (the classic unconditional-write bug)."
  prior_inputs:
  - port: s1.p1
    layers: *id001
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
