- name: arp_passthrough_no_flag
  visibility: hidden
  description: "An ARP frame (non-IP, non-TCP) is forwarded unchanged on the forward port and never flagged \u2014 R0 forwards all non-TCP traffic."
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
        type: 2054
