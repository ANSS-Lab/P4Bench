task_name: afq_per_flow_budget_mut2
task_type: full_program
complexity: high
source: paper
paper_ref: Sharma et al., Approximating Fair Queueing on Reconfigurable Switches, NSDI 2018
pattern: P-ApproxFairQueueing
pattern_version: '1.0'
seed:
  window: 2
  quantum: 1024
  fair_share_k: 4
  sketch_rows: 2
  sketch_width: 16
  hash_polynomial: crc32
  hash_independence: pairwise
  flowkey_fields:
  - hdr.ipv4.srcAddr
  eligibility_protocol: tcp
  byte_accounting: on_wire_length
  faithfulness: D5.2_lossy_quantum
  workload_skew: adversarial_collision
  access_port: 1
  core_port: 2
  core_mac: 08:00:00:00:02:01
failure_modes:
- long_sequence_stateful_drift
- multi_checksum_selectivity
- nested_conditional_with_early_return
- byte_vs_packet_accounting
- min_across_rows_count_min_sketch
- off_by_one_drop_predicate
- underflow_clamp
description: |
  An access switch s1 must enforce an approximate per-flow fair-bandwidth
  admission policy on TCP traffic between subscribers and an upstream core
  network.

  ## Topology and roles

    - s1 has three external connection points: an ACCESS connection
      (s1.p1) facing subscribers, a CORE connection (s1.p2) facing the
      upstream router whose Ethernet address is 08:00:00:00:02:01, and a
      third connection (s1.p3) that carries no production traffic.
    - Any frame arriving on a connection other than the ACCESS one must be
      discarded.

  ## Eligibility

  A subscriber packet is eligible for admission only when ALL of the
  following hold; the checks short-circuit in the order listed, and a
  packet that fails an earlier check is never inspected against later
  checks and never affects any internal state:

    1. The packet arrived on the ACCESS connection.
    2. The packet carries an IPv4 payload.
    3. The IPv4 payload is TCP.

  ## Per-flow byte accounting

  The switch maintains an approximate per-flow byte estimate using two
  distinct slot indices computed from the IPv4 source address:

    - first index  = the final byte of the source address.
    - second index = the second-to-last byte XOR the third-to-last byte
                     of the source address.

  For each flow, the switch's estimate of total bytes that flow has had
  admitted is the MINIMUM of the byte counts stored at those two slot
  positions. The switch must use this MIN value, not their sum and not
  either single value.

  The switch additionally keeps a single global "total bytes admitted"
  counter incremented on every admission.

  ## Round arithmetic

  The switch derives two per-packet integer quantities (the byte sizes
  below are the on-wire frame length, including Ethernet header):

    - flow_round    = (per-flow byte estimate) divided by 1024, integer.
    - current_round = (global bytes admitted)  divided by 4096, integer.

  It then computes

    round_shift = max(0, flow_round - current_round)

  — the clamp at zero is mandatory: a flow whose round trails the global
  round never has a negative or wrap-around shift.

  ## Admission decision

    - If round_shift is 2 or greater, the packet must be discarded; per-flow
      and global state MUST NOT change as a result of this discard.
    - Otherwise, the packet is admitted. On admission and only on
      admission, the per-flow byte estimate (both slots) and the global
      counter must each be incremented by exactly the on-wire frame
      length, and the packet observed at the CORE connection must
      satisfy:
        - Its IPv4 identification field equals round_shift.
        - Its IPv4 hop count is reduced by exactly one and the datagram
          remains a well-formed IPv4 packet that an unmodified
          downstream receiver would accept.
        - Its Ethernet destination address has been replaced by
          08:00:00:00:02:01.
        - All other fields of the packet are byte-identical to the
          received packet.

  ## Control plane

  No control-plane configuration is supplied. The behaviour is fully
  determined by the per-flow and global state the switch maintains
  internally and by the constants given above.
topology:
  switches:
  - name: s1
    ports:
      p1: 1
      p2: 2
      p3: 3
  links:
  - from: sub
    to: s1.p1
  - from: s1.p2
    to: core
hosts:
  sub:
    ip: 10.0.1.254/24
    mac: 08:00:00:00:01:01
    port: s1.p1
  core:
    ip: 10.200.0.1/24
    mac: 08:00:00:00:02:01
    port: s1.p2
test_cases:
- name: first_packet_admit_round_shift_0
  visibility: public
  description: 'Fresh switch: a single TCP/IPv4 packet on the access port is admitted, the assigned round_shift is 0, written into IP.id; TTL decremented and Ethernet destination rewritten to the core MAC.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:11
        dst: ff:ff:ff:ff:ff:ff
    - IP:
        src: 10.0.1.1
        dst: 8.8.8.8
        ttl: 64
        proto: 6
        id: 48879
    - TCP:
        sport: 5000
        dport: 80
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.id:
        action: change_to
        value: 0
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:01
