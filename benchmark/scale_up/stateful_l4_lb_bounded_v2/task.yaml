        flags: S
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.0.3
        dst: 10.0.100.1
        ttl: 64
        proto: 6
    - TCP:
        sport: 11000
        dport: 8080
        flags: S
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.0.1
        dst: 10.0.100.1
        ttl: 1
