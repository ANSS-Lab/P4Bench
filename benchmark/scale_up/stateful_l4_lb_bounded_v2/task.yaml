- name: adversarial_collision_burst_three_displacements
  visibility: hidden
  description: 'Three same-slot connections engineered to collide at slot 277

    with distinct backend_idx values: FLOW_A (B2) admitted, FLOW_E

    (B1) displaces FLOW_A, then test packet FLOW_G

    (10.0.0.3:12345 → 10.0.100.1:80, ident 0x30396454, slot 277,

    B0) displaces FLOW_E. Expects forward on s1.p2 + monitor on

    s1.p6, asserting the burst yields a clean displacement chain

    rather than collapsing to a single resident or aliasing

    backends.

    '
  prior_inputs:
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
