description: |-
  Implement an explicit congestion-feedback stamper for BMv2 (v1model). The
  switch tracks how much feedback-carrying traffic it has handled for each
  traffic class, turns that into a locally computed SIGNED congestion-feedback
  value for the class, and folds that value into a feedback field carried by
  passing packets — but only ever to make the field MORE RESTRICTIVE (more
  negative), never less, so the most-congested switch along a path is the one
  whose feedback the receiver ends up seeing.

  Topology: traffic arrives on port 1. The destination IPv4 address selects an
  outgoing port: 10.0.1.0/24 leaves on port 1, 10.0.2.0/24 on port 2,
  10.0.3.0/24 on port 3. A packet whose destination matches no route is dropped.

  Feedback packets are identified by a small shim carried on UDP destination
  port 9999: its first four bytes are a 32-bit feedback value (field name
  RCPFeedback.value), interpreted as a SIGNED two's-complement integer. A packet
  that is not UDP, or is UDP on any other destination port, carries no feedback
  field.

  Required behaviour, per packet:

  - Ordinary traffic. A packet with no feedback shim is forwarded on its normal
    forwarding decision, completely unmodified. Non-IPv4 frames are dropped.

  - Congestion accounting, per traffic class. For a feedback-carrying packet, the
    switch counts it against the load of its TRAFFIC CLASS and from that
    accumulated load derives the class's currently advertised signed feedback. A
    packet's traffic class is its DiffServ code point (the high six bits of the
    IPv4 type-of-service byte), NOT its outgoing port: two packets on the SAME
    outgoing link but with DIFFERENT DiffServ code points belong to DIFFERENT
    classes and accumulate load independently. The signed feedback must be a
    deterministic function of the traffic the switch has seen for that class (so
    the same packet train always yields the same feedback, run to run) and must
    get MORE NEGATIVE as the class accumulates more load — a busier class
    advertises more congestion. Each class's load is maintained over a bounded
    window of the most recent feedback packets of that class and is reset at the
    window boundary, counted in packets (there is no wall-clock timer); the value
    must never wrap or overflow.

  - Exact feedback law. Number the feedback packets of each class 1, 2, 3, …
    within a window of the 16 most recent feedback packets of that class (the
    per-class counter resets after every 16 feedback packets of that class,
    counted independently per DiffServ class); call this per-class count the
    load, so a class's first feedback packet in a window has load 1. Before
    folding, the class's advertised signed feedback for the packet is computed
    as

        feedback(load) = target_rate / (1 + load) − target_rate / 2

    using integer (floor) division, with target_rate = 1000000 (so the constant
    offset is target_rate / 2 = 500000). The result is written into the 32-bit
    field as a two's-complement signed value — a negative value v is stored as
    2^32 + v — and never wraps beyond 32 bits. Worked examples: load 1 gives
    1000000 / 2 − 500000 = 0; load 2 gives 1000000 / 3 − 500000 = −166667;
    load 4 gives 1000000 / 5 − 500000 = −300000.

  - Signed feedback folding. The switch compares the signed feedback the packet
    already carries with its own signed feedback for the packet's class. If the
    switch's value is more restrictive (more negative) than the value in the
    field, it overwrites the field with its own value. If the field already
    carries a value at least as restrictive (equal or more negative) — i.e. some
    earlier, busier hop already wrote it — the switch leaves the field untouched.
    The switch must never make the feedback less negative. Either way the packet
    is forwarded on its normal forwarding decision; the accounting and folding
    never change which port a packet leaves on and never drop it.

  Both the P4 program and any table entries are yours to author. The observable
  behaviour the switch must get right is the signed value left in the feedback
  field after each packet, the choice never to raise that value, that each
  DiffServ traffic class is accounted independently, and the bounded packet-count
  window over which a class's load is maintained.
test_cases:
- name: stamp_signed_feedback_on_underutilised_field
  visibility: public
  goal_class: G1
  description: A feedback packet arrives on a cold congestion class carrying a large POSITIVE (under-utilised / least-restrictive) signed feedback value. The switch computes its own signed feedback for the class (which at a cold class is more restrictive — smaller, toward zero or negative) and overwrites the field with that more-restrictive signed value, then forwards on the normal outgoing port. The feedback field is read and written as a signed two's-complement value.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
        tos: 40
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 500000
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: change_to
        value: 0
- name: preserve_more_negative_upstream_feedback
  visibility: public
  goal_class: G1
  description: A feedback packet arrives carrying a value that is ALREADY more restrictive (more NEGATIVE) than this switch's signed feedback — a more-congested upstream hop wrote it. The switch leaves the field UNCHANGED (it never makes the feedback less negative) and forwards the packet.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
        tos: 40
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 4294167296
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: unchanged
- name: ordinary_packet_forwarded_unmodified
