- name: equal_feedback_preserved
  visibility: hidden
  goal_class: G2
  description: A feedback packet whose signed value exactly equals the switch's cold-class signed feedback (zero) is left UNCHANGED — the fold overwrites only when STRICTLY more restrictive (more negative). Forwarded normally.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
        tos: 40
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 0
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: unchanged
