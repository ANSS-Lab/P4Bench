task_name: port_scan_detect_anchor
task_type: full_program
complexity: high
source: paper
pattern: P-PortScanDetect
pattern_version: '1.0'
seed:
  scan_key: distinct_dst_ip
  scan_threshold: 8
  scanner_action: drop
  source_table_capacity: 4096
  bitmap_width: 1024
  rows: 1
  distinct_estimator: exact_set
  hash_polynomial: crc32
  window_packets: 65536
  control_reset_enabled: true
  workload_skew: uniform
  persistence_strict: true
  control_port: 511
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p511: 511
  links:
  - from: monitored
    to: s1.p1
  - from: s1.p2
    to: uplink
  - from: control
    to: s1.p511
hosts:
  monitored:
    note: monitored sources; ingress on s1.p1
  uplink:
    note: normal egress / next hop 08:00:00:00:02:02 on s1.p2
  control:
    note: operator control port s1.p511 (window reset)
description: |-
  Implement a per-source scan detector for BMv2 (v1model). The switch monitors
  each IPv4 source address and blocks any source that fans out across too many
  distinct destinations, while letting ordinary traffic through.

  Topology: port 1 carries the monitored traffic; port 2 is the normal egress
  toward next hop 08:00:00:00:02:02. Port 511 is the operator control port.

  Required behaviour, per IPv4 packet (non-IPv4 frames are dropped):

  - Distinct-destination tracking. For each source, count how many DISTINCT
    destination IP addresses it has contacted in the current detection window.
    Contacting the same destination repeatedly counts once — a source that only
    ever talks to one destination is never a scanner, no matter how many packets
    it sends.

  - Block decision. A source whose number of distinct destinations grows beyond 8
    is a scanner: the packet that takes the source past 8 distinct destinations,
    and every later packet from that source, is dropped. A source that has
    contacted 8 or fewer distinct destinations is not a scanner. The first 8
    distinct destinations are allowed through; the source is blocked starting from
    the destination that makes its distinct count exceed 8. Once a source is
    blocked it stays blocked for the rest of the window — even packets to a
    destination it already contacted are dropped.

  - Forwarding. A packet from a source that is not (yet) blocked leaves on port 2
    toward the next hop, with its hop count decremented and its header integrity
    preserved. A packet with an expired hop count is dropped.

  - Window reset. A packet arriving on the control port (port 511) is an operator
    reset: it clears all per-source tracking and all block decisions, and is
    itself consumed (not forwarded). A source blocked before the reset is allowed
    through again afterwards. The detection window is measured in packets, not in
    time.

  Block decisions must be per-source: one source's behaviour must never cause a
  different source to be blocked or allowed incorrectly. Both the P4 program and
  its table entries are yours to author.
test_cases:
- name: benign_single_forward
  visibility: public
  goal_class: G1
  description: A single packet from a fresh source to one destination is forwarded on the normal egress port with its hop count decremented and Ether.dst rewritten to the next hop — a source contacting one destination is never a scanner.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.5.1
        dst: 10.0.9.1
        ttl: 1
        proto: 6
    - TCP:
        sport: 4000
        dport: 80
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:02
