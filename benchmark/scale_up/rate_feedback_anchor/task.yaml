- name: no_route_drop
  visibility: hidden
  goal_class: G2
  description: A feedback packet whose destination matches no route is dropped.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 8.8.8.8
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 5000000
  expected:
    behavior: drop
- name: adversary_cannot_raise_field
  visibility: hidden
  goal_class: G3
  description: An adversarial sender presents a feedback packet whose field is ALREADY far more restrictive (much smaller) than the switch's value, trying to coerce the switch into raising it to a faster rate. The switch PRESERVES the smaller value — it never increases the field — even against a crafted small value.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 1
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: unchanged
- name: deterministic_stamp_not_qdepth
  visibility: hidden
  goal_class: G3
  description: The same single feedback packet on a cold link is stamped to a fixed deterministic value derived from the packet-count signal, not from a queue-depth read (which would be ~0 and run-varying). The expected stamp is bit-identical run to run.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40001
        dport: 9999
    - RCPFeedback:
        value: 5000000
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: change_to
        value: 500000
- name: non_ipv4_drop
  visibility: hidden
  goal_class: G3
  description: A non-IPv4 frame (ARP) carries no forwarding class and is dropped before any signal update.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
        type: 2054
    - ARP:
        op: 1
        psrc: 10.0.9.9
        pdst: 10.0.2.50
  expected:
    behavior: drop
- name: udp_non_feedback_port_forwarded
  visibility: hidden
  goal_class: G3
  description: A UDP packet on a non-feedback destination port (53, not the feedback demux port) carries no feedback field and is forwarded unmodified — the feedback path is keyed on the specific demux port, not on UDP in general.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 53
  expected:
    behavior: forward
    output_port: s1.p2
    transformations: {}
- name: preserve_branch_then_stamp_branch_consistent
  visibility: hidden
  goal_class: G3
  description: Following a preserve (no-rewrite) packet, a subsequent feedback packet on the same cold-ish link whose field exceeds the advertised value is still correctly stamped — the no-rewrite branch does not corrupt the deparsed feedback header for the later rewrite branch.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.3.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 5000000
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      RCPFeedback.value:
        action: change_to
        value: 333333
  prior_inputs:
  - port: s1.p1
