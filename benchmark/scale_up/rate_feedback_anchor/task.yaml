task_name: rate_feedback_anchor
task_type: full_program
complexity: high
source: paper
pattern: P-RateFeedback
pattern_version: '1.0'
seed:
  feedback_header: rcp_rate
  feedback_semantics: rcp_rate
  faithfulness: D5.0_rcp_single_rate
  signal_keying: per_egress_port
  n_signal_classes: 8
  aggregation_mode: packet_count
  aggregation_window: 64
  aggregate_lower_better: true
  path_min_strict: true
  target_rate: 1000000
  default_action: forward
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p3: 3
  links:
  - from: host
    to: s1.p1
  - from: s1.p2
    to: link2
  - from: s1.p3
    to: link3
hosts:
  host:
    note: feedback senders + ordinary traffic; ingress on s1.p1
  link2:
    note: outgoing link for 10.0.2.0/24; congestion class 2; s1.p2
  link3:
    note: outgoing link for 10.0.3.0/24; congestion class 3; s1.p3
description: |-
  Implement an explicit-rate congestion-feedback stamper for BMv2 (v1model). The
  switch tracks how much feedback-carrying traffic it has handled for each of its
  outgoing links, turns that into a locally advertised "fair rate" for the link,
  and writes that rate into a feedback field carried by passing packets — but
  only ever to LOWER the field, never to raise it, so the most-congested switch
  along a path is the one whose rate the receiver ends up seeing.

  Topology: traffic arrives on port 1. The destination IPv4 address selects an
  outgoing port: 10.0.1.0/24 leaves on port 1, 10.0.2.0/24 on port 2,
  10.0.3.0/24 on port 3. A packet whose destination matches no route is dropped.
  The outgoing port also identifies which link's congestion the packet
  contributes to and is rated against.

  Feedback packets are identified by a small shim carried on UDP destination
  port 9999: its first four bytes are a 32-bit advertised-rate value (field name
  RCPFeedback.value). A packet that is not UDP, or is UDP on any other
  destination port, carries no feedback field.

  Required behaviour, per packet:

  - Ordinary traffic. A packet with no feedback shim is forwarded on its normal
    forwarding decision, completely unmodified. Non-IPv4 frames are dropped.

  - Congestion accounting. For a feedback-carrying packet, the switch counts it
    against its outgoing link's load and from that accumulated load derives the
    link's currently advertised rate, by this exact deterministic rule (so the same
    packet train always yields the same advertised rate, run to run):
      - Each outgoing link keeps a load count that starts at 0. Handling a
        feedback-carrying packet for the link increments that link's load count by
        1 BEFORE the advertised rate is computed, so the first feedback packet on a
        cold link is rated at load 1. The count rolls back to 0 once it has counted
        64 packets for the link and then resumes counting. Each link's load count
        is independent: one link's traffic must not affect another link's rate.
      - The advertised rate is target_rate / (1 + load), using integer (floored)
        division, with target_rate = 1000000, then clamped to a minimum of 1. So
        the rate gets smaller as the link accumulates more load, and it never
        collapses to 0, underflows, or wraps to an enormous value under heavy load.
        (A cold link's first feedback packet is rated at load 1 and so advertises
        1000000 / 2 = 500000.)

  - Rate stamping. The switch compares the feedback field the packet already
    carries with its own advertised rate for the packet's outgoing link. If the
    switch's rate is more restrictive (lower) than the value in the field, it
    overwrites the field with its own rate. If the field already carries a value
    at least as restrictive (equal or lower) — i.e. some earlier, busier hop
    already wrote it — the switch leaves the field untouched. The switch must
    never increase the field. Either way the packet is forwarded on its normal
    forwarding decision; the rate accounting and stamping never change which port
    a packet leaves on and never drop it.

  Both the P4 program and any table entries are yours to author. The observable
  behaviour the switch must get right is the value left in the feedback field
  after each packet, the choice never to raise that value, and that each
  outgoing link's congestion is accounted independently.
test_cases:
- name: stamp_switch_value_on_uncongested_field
  visibility: public
  goal_class: G1
  description: A feedback packet arrives on a cold link (this switch has seen no prior feedback traffic for the outgoing link) carrying a high (least-restrictive) advertised-rate value. The switch computes its own lower advertised rate for the link and overwrites the feedback field with that smaller value, then forwards the packet on its normal outgoing port. No other field changes.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 5000000
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: change_to
        value: 500000
- name: preserve_more_restrictive_upstream_value
  visibility: public
  goal_class: G1
  description: A feedback packet arrives on a cold link carrying a value that is ALREADY more restrictive (smaller) than this switch's advertised rate — an upstream bottleneck wrote it. The switch leaves the field UNCHANGED (it never raises it) and forwards the packet.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 10
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: unchanged
