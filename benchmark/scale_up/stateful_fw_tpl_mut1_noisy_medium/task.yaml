- name: outbound_ttl_one_dropped_at_d52
  visibility: public
  description: 'Tier-3 R8 TTL-floor: an outbound TCP packet ingressing with TTL=1 MUST drop (post-decrement TTL would be 0). At Tier-1/Tier-2 the same packet is forwarded with TTL=0; the spec tightens at
    D5.2_tcp_state_tracking to drop instead. Anchors invariant no_zero_ttl_emission.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 1
        proto: 6
    - TCP:
        sport: 3000
        dport: 80
        flags: S
  expected:
    behavior: drop
- name: outbound_ttl_two_decrements_to_one
  visibility: hidden
  description: "Tier-3 R8 boundary: an outbound TCP packet with TTL=2 (strictly > 1) MUST still be forwarded. Egress observer sees TTL=1 (decremented by exactly one). Distinguishes the R8 floor at TTL \u2264\
    \ 1 from naive 'drop all low TTL' implementations."
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 2
        proto: 6
    - TCP:
        sport: 3001
        dport: 80
        flags: S
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:02
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:02
