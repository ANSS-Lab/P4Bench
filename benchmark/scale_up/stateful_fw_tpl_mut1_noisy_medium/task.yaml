task_name: stateful_fw_tpl_mut1_noisy_medium
task_type: full_program
complexity: high
source: synthesis
pattern: P-StatefulFW
pattern_version: '1.0'
seed:
  internal_subnet: 10.0.1.0/24
  external_subnet: 10.0.2.0/24
  default_policy: permit_out_deny_in
  state_capacity: 64
  eviction_policy: timeout
  idle_timeout_s: 300
  faithfulness: D5.2_tcp_state_tracking
  reflexive_strict: true
failure_modes:
- inbound_acl_keyed_on_3tuple_subset_only
- non_tcp_inbound_admitted
- non_ipv4_admitted
- lpm_miss_silently_forwarded_to_default_port
- outbound_protocol_filtered_against_acl
- ttl_not_decremented_on_admit
- ether_src_mac_left_unchanged
- reflexive_keyed_on_forward_5tuple_not_reverse
- reflexive_table_installed_from_inbound_packets
- tcp_state_advanced_on_any_flag_combination
- strict_eviction_replaces_existing_entries_under_pressure
description: "s1 sits between an internal zone and an external zone and decides,\nfor each packet it receives, whether to forward it (producing one\negress packet, on one of the two ports, with the rewrites\
  \ below) or\ndrop it (producing no egress).\n\n## Topology\n\n  - s1.p1 \u2014 internal port. Host h1 (10.0.1.1, MAC 08:00:00:00:01:01)\n            is on this side; the internal zone is 10.0.1.0/24.\n\
  \  - s1.p2 \u2014 external port. Host h2 (10.0.2.2, MAC 08:00:00:00:02:02)\n            is on this side.\n\ns1 has no management interface of its own \u2014 it receives traffic only\non s1.p1 and s1.p2,\
  \ and it never originates frames; any handling of\nmanagement or telemetry traffic is performed by an out-of-band path\nthat does not touch s1's data plane.\n\n## Operator configuration\n\nBefore any\
  \ traffic is processed, the operator supplies:\n\n  - a routing table \u2014 a finite collection of entries, each pairing\n    an IPv4 destination prefix with an egress port and two Ethernet\n    addresses;\n\
  \  - an admit list \u2014 a finite set of\n    (src-IP, dst-IP, src-port, dst-port) tuples.\n\nThe operator does not configure anything else; in particular, the\ncondition in (D6)(b) below is determined\
  \ by s1 alone in response to\nthe traffic it sees.\n\nEach routing-table entry additionally carries a 16-bit routing-domain\ntag, set by the operator at install time. s1 stores this tag alongside\nthe\
  \ entry but does not consult it when selecting an entry, computing\nthe egress port, performing the MAC rewrite, or decrementing the hop\ncount; the tag is metadata for the operator's own audit pipeline.\n\
  \n## Drop conditions\n\nA packet is dropped iff at least one of the following holds:\n\n  (D1) it is not IPv4;\n  (D2) its IPv4 hop count on ingress is at most 1;\n  (D3) its IPv4 More-Fragments flag\
  \ is set, or its fragment offset\n       is non-zero;\n  (D4) it arrived on s1.p1 and its IPv4 source address is not in\n       10.0.1.0/24;\n  (D5) it arrived on s1.p2 and is not TCP;\n  (D6) it arrived\
  \ on s1.p2, is TCP, and is admitted by neither of\n       the following:\n         (a) its 4-tuple is in the admit list; or\n         (b) there is an in-scope past packet f (see \"In-scope past\n    \
  \         packets\" below) with the same L4 protocol, satisfying\n                 f.src-IP   = this.dst-IP,\n                 f.dst-IP   = this.src-IP,\n                 f.src-port = this.dst-port,\n\
  \                 f.dst-port = this.src-port,\n             and additionally, because this packet is TCP, the\n             sequence of TCP flag combinations across f, all earlier\n             packets\
  \ already admitted via (b) against this same f,\n             and this packet, is a legal prefix of the standard TCP\n             handshake-and-teardown sequence;\n  (D7) no entry in the routing table\
  \ has a prefix covering the IPv4\n       destination address of the packet.\n\n## In-scope past packets\n\nAt any moment s1 is paying attention to at most K = 64 past packets \u2014\neach was received\
  \ on s1.p1, is IPv4 TCP or IPv4 UDP, and was\nforwarded by s1. When a TCP or UDP packet received on s1.p1 is\nforwarded and the attended count already equals K, the new packet\nis forwarded normally but\
  \ is not added to the attended set; no\nattended packet is displaced. A packet leaves the attended set\nonce a long enough period has elapsed during which no s1.p2 packet\nmatched it under (D6)(b).\n\n\
  It is conventional to maintain the in-scope past-packet records as a\nhash table keyed on the originating internal packet's 4-tuple\n(src-IP, dst-IP, src-port, dst-port), so the install operation is a\n\
  single insert without any index transformation.\n\n## Forwarded packet\n\nA forwarded packet is byte-identical to the received packet except:\nit appears on the egress port of the most-specific routing-table\n\
  entry whose prefix covers the received packet's IPv4 destination;\nits Ethernet source and destination are the two MAC addresses from\nthat entry; its IPv4 hop count is one less than the received\npacket's.\
  \ (Equivalently: an IPv4 packet arriving with TTL value 0\nor 1 is discarded under (D2) before any of the above takes effect.)\n"
topology:
  switches:
  - name: s1
    ports:
      p1: 1
      p2: 2
  links:
  - from: h1
    to: s1.p1
  - from: s1.p2
    to: h2
hosts:
  h1:
    ip: 10.0.1.1/24
    mac: 08:00:00:00:01:01
    port: s1.p1
  h2:
    ip: 10.0.2.2/24
    mac: 08:00:00:00:02:02
    port: s1.p2
test_cases:
- name: outbound_tcp_forward
  visibility: public
  description: TCP from internal host h1 (10.0.1.1) to external host h2 (10.0.2.2) is forwarded out the external port; the next-hop Ether.dst becomes h2's MAC, Ether.src becomes the switch's external MAC,
    and TTL decrements by one.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        proto: 6
    - TCP:
        sport: 1000
        dport: 80
        flags: S
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:02
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:02
- name: outbound_udp_forward
  visibility: public
  description: "UDP from the internal zone is forwarded \u2014 the default policy permit_out_deny_in admits any IPv4 protocol outbound (RFC 2979 \xA74 transparent-firewall behaviour). Same TTL/MAC rewrites\
    \ apply."
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        proto: 17
    - UDP:
        sport: 5000
        dport: 53
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:02
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:02
- name: inbound_tcp_with_acl_match
  visibility: public
  description: "Inbound TCP from h2:80 to h1:1000 matches the first ACL entry (srcIP=10.0.2.2, dstIP=10.0.1.1, srcPort=80, dstPort=1000) and is admitted; LPM forwards to the internal port with TTL\u2212\
    1 and the internal-side next-hop MACs."
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 08:00:00:00:00:02
    - IP:
        src: 10.0.2.2
        dst: 10.0.1.1
        ttl: 64
        proto: 6
    - TCP:
        sport: 80
        dport: 1000
        flags: A
  expected:
    behavior: forward
    output_port: s1.p1
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:01:01
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:01
- name: inbound_tcp_no_acl_match_drop
  visibility: public
  description: "Inbound TCP whose 4-tuple is NOT in the pre-authorised ACL set is dropped. RFC 2979 \xA73 default-deny: external traffic with no explicit permit must be discarded."
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 08:00:00:00:00:02
    - IP:
        src: 10.0.2.2
        dst: 10.0.1.1
        ttl: 64
        proto: 6
    - TCP:
        sport: 9999
        dport: 55555
        flags: S
  expected:
    behavior: drop
- name: non_ipv4_arp_drop
  visibility: public
  description: "Non-IPv4 traffic (ARP) is dropped unconditionally regardless of ingress port (R1: \xACheader_present(ipv4) \u2192 drop)."
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
        type: 2054
    - ARP:
        op: 1
        psrc: 10.0.1.1
        pdst: 10.0.2.2
        hwsrc: 08:00:00:00:01:01
  expected:
    behavior: drop
- name: inbound_tcp_second_acl_match
  visibility: hidden
  description: "The second ACL entry (h2:443 \u2192 h1:2000) admits inbound traffic independently of the first; an implementation that only honours a single hard-coded 4-tuple fails this case."
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 08:00:00:00:00:02
    - IP:
        src: 10.0.2.2
        dst: 10.0.1.1
        ttl: 64
        proto: 6
    - TCP:
        sport: 443
        dport: 2000
        flags: A
  expected:
    behavior: forward
    output_port: s1.p1
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:01:01
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:01
- name: inbound_tcp_wrong_srcport_drop
  visibility: hidden
  description: Inbound TCP whose srcAddr/dstAddr/dstPort match an ACL entry but whose srcPort differs (9999 vs 80) MUST drop. Anchors the exact-match-on-4-tuple discipline.
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 08:00:00:00:00:02
    - IP:
        src: 10.0.2.2
        dst: 10.0.1.1
        ttl: 64
        proto: 6
    - TCP:
        sport: 9999
        dport: 1000
        flags: S
  expected:
    behavior: drop
- name: inbound_tcp_wrong_dport_drop
  visibility: hidden
  description: "Inbound TCP whose srcPort is in the ACL but dstPort differs (9999 vs 1000) MUST drop. Same exact-match invariant \u2014 both endpoints of the 4-tuple are load-bearing."
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 08:00:00:00:00:02
    - IP:
        src: 10.0.2.2
        dst: 10.0.1.1
        ttl: 64
        proto: 6
    - TCP:
        sport: 80
        dport: 9999
        flags: S
  expected:
    behavior: drop
- name: inbound_tcp_wrong_srcaddr_drop
  visibility: hidden
  description: Inbound TCP from a srcAddr other than the ACL'd 10.0.2.2 (here 10.0.2.99) MUST drop, even when ports match. An implementation that keys on (srcPort, dstPort) only fails this case.
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 08:00:00:00:00:02
    - IP:
        src: 10.0.2.99
        dst: 10.0.1.1
        ttl: 64
        proto: 6
    - TCP:
        sport: 80
        dport: 1000
        flags: A
  expected:
    behavior: drop
- name: inbound_udp_drop
  visibility: hidden
  description: "UDP arriving on the external port is dropped \u2014 the firewall only inspects TCP inbound; all other IPv4 protocols are denied without consulting the ACL."
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 08:00:00:00:00:02
    - IP:
        src: 10.0.2.2
        dst: 10.0.1.1
        ttl: 64
        proto: 17
    - UDP:
        sport: 53
        dport: 5000
  expected:
    behavior: drop
- name: inbound_icmp_drop
  visibility: hidden
  description: "ICMP arriving on the external port is dropped \u2014 same rationale as inbound UDP. Default-deny means no implicit ICMP echo."
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 08:00:00:00:00:02
    - IP:
        src: 10.0.2.2
        dst: 10.0.1.1
        ttl: 64
        proto: 1
    - ICMP: {}
  expected:
    behavior: drop
- name: inbound_arp_drop
  visibility: hidden
  description: "ARP from the external port is dropped by R1 (\xACIPv4) before the zone-policy is consulted. This is distinct from case 5 only in ingress port \u2014 the rule fires on either side."
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: ff:ff:ff:ff:ff:ff
        type: 2054
    - ARP:
        op: 1
        psrc: 10.0.2.2
        pdst: 10.0.1.1
        hwsrc: 08:00:00:00:02:02
  expected:
    behavior: drop
- name: outbound_no_lpm_match_drop
  visibility: hidden
  description: An outbound IPv4 packet whose destination falls outside both subnets installed in the LPM table (here 192.168.99.99) is dropped. The default-action of the LPM table is drop.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 192.168.99.99
        ttl: 64
        proto: 6
    - TCP:
        sport: 1000
        dport: 80
        flags: S
  expected:
    behavior: drop
- name: outbound_non_ipv4_unknown_ethertype_drop
  visibility: hidden
  description: "A frame with an unknown EtherType (0x88B5, IEEE Std 802 \u2014 local experimental) MUST be dropped. R1 catches all non-IPv4 frames, not just ARP."
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
        type: 34997
  expected:
    behavior: drop
- name: outbound_second_distinct_flow_forwarded
  visibility: hidden
  description: A second outbound TCP flow (different sport/dport from case 1) is admitted; the firewall imposes no per-flow eligibility on the trusted side at Tier-1 (D5.0_stateless_acl).
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        proto: 6
    - TCP:
        sport: 2000
        dport: 443
        flags: S
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:02
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:02
- name: reflexive_return_admitted_after_outbound_install
  visibility: hidden
  description: "Reflexive admission (D5.1+): an outbound TCP flow from h1 (sport 33000 \u2192 dport 33001 to h2) installs a reverse-direction reflexive entry. The matching inbound TCP packet from h2 (sport\
    \ 33001 \u2192 dport 33000 to h1) is then admitted to the internal port \u2014 independently of the static ACL, which would otherwise drop this 4-tuple."
  prior_inputs:
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        proto: 6
    - TCP:
        sport: 33000
        dport: 33001
        flags: S
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 08:00:00:00:00:02
    - IP:
        src: 10.0.2.2
        dst: 10.0.1.1
        ttl: 2
        proto: 6
    - TCP:
        sport: 33001
        dport: 33000
        flags: SA
  expected:
    behavior: forward
    output_port: s1.p1
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:01:01
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:01
- name: reflexive_unrelated_inbound_still_denied
  visibility: hidden
  description: Reflexive admission is keyed on the exact reverse 4-tuple. An inbound packet whose 4-tuple does NOT mirror any previously-admitted outbound flow (and is not in the static ACL) must still
    be dropped, even if other reflexive entries exist for unrelated flows.
  prior_inputs:
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        proto: 6
    - TCP:
        sport: 33000
        dport: 33001
        flags: S
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 08:00:00:00:00:02
    - IP:
        src: 10.0.2.2
        dst: 10.0.1.1
        ttl: 2
        proto: 6
    - TCP:
        sport: 33051
        dport: 33050
        flags: SA
  expected:
    behavior: drop
- name: reflexive_second_distinct_flow_admits
  visibility: public
  description: "A second outbound TCP flow with different ports (sport 41000 \u2192 dport 41001) installs its own reverse-5-tuple entry. The return packet matching THAT flow's reverse-tuple must be admitted,\
    \ demonstrating that the reflexive table is a real per-flow set, not a single slot."
  prior_inputs:
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        proto: 6
    - TCP:
        sport: 41000
        dport: 41001
        flags: S
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:02:02
        dst: 08:00:00:00:00:02
    - IP:
        src: 10.0.2.2
        dst: 10.0.1.1
        ttl: 2
        proto: 6
    - TCP:
        sport: 41001
        dport: 41000
        flags: SA
  expected:
    behavior: forward
    output_port: s1.p1
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:01:01
      Ether.src:
        action: change_to
        value: 08:00:00:00:00:01
- name: strict_reflexive_capacity_overflow_drops_return
