- name: first_new_flow_lands_on_backend_zero
  visibility: public
  description: Fresh switch. First eligible TCP packet is a new flow; the round-robin counter is 0 so the flow is bound to backend B0.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.100.1
        ttl: 1
        proto: 6
    - TCP:
        sport: 4000
        dport: 80
        flags: S
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.dst:
        action: change_to
        value: 10.0.2.10
      IP.ttl:
        action: decremented_by
        delta: 1
      Ether.dst:
        action: change_to
        value: 08:00:00:00:02:01
