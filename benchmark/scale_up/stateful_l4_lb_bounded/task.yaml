task_type: full_program
complexity: high
source: synthesis
pattern: P-StatefulLB
pattern_version: '1.0'
seed:
  vip: 10.0.100.1
  backends:
  - 10.0.2.10
  - 10.0.2.20
  - 10.0.2.30
  assign: round_robin
  flow_table_capacity: 256
  eviction_policy: FIFO_collision_displace
  faithfulness: D5.0_exact
  persistence_strict: false
failure_modes:
- miss_branch_does_not_check_resident_identity
- counter_does_not_advance_on_displacement
- displacement_in_one_bucket_corrupts_another
- modn_via_bitmask_with_non_power_of_two
- eviction_silently_drops_instead_of_reassigning
- identity_zero_sentinel_collision
description: |
  A switch s1 fronts a single virtual service address with three real
  back-end servers, distributing TCP connections across them while
  preserving the connection-to-server binding for the life of each
  connection — within a bounded amount of per-connection state.

  ## Topology and roles

    - s1.p1 — connection point facing clients.
    - s1.p2 — connection point facing back-end server B0
              (address 10.0.2.10, hardware 08:00:00:00:02:01).
    - s1.p3 — connection point facing back-end server B1
              (address 10.0.2.20, hardware 08:00:00:00:02:02).
    - s1.p4 — connection point facing back-end server B2
              (address 10.0.2.30, hardware 08:00:00:00:02:03).
    - The advertised service address is 10.0.100.1; no host owns it
      directly — the switch terminates and re-targets traffic to it.

  ## Eligibility

  A packet is eligible for admission only when ALL of the following hold,
  in this short-circuited order; failing an earlier check means later
  checks are not consulted and no internal state changes:

    1. The packet is an IPv4 datagram.
    2. The packet's IPv4 destination address equals the service address.
    3. The IPv4 payload is TCP.

  A frame that fails any of these (e.g. an ARP frame, an IPv4 packet to a
  non-service address, or an IPv4 packet to the service address that is
  not TCP) must be discarded.

  ## Connection identity

  Two TCP packets are considered to belong to the SAME connection if and
  only if they agree on the 5-tuple
  (IPv4 source, IPv4 destination, TCP source port, TCP destination port,
  IPv4 protocol). Any difference in any of those five components produces
  a different connection.

  ## Backend assignment

  The switch keeps an internal record of which back-end each connection
  has been bound to. The first time a packet of a given connection is
  admitted, the switch chooses a back-end as follows:

    - The switch maintains a single integer "selector" that begins at zero
      on power-on and advances by exactly one immediately after each
      first-of-a-connection admission. The selector advances ONLY on
      first-of-a-connection admissions; never on subsequent packets of an
      already-admitted connection, and never on packets that were
      discarded as ineligible.
    - A first-of-a-connection packet is bound to back-end (selector value
      AT THE TIME OF THIS ADMISSION, taken modulo three).

  ## Per-connection state — bounded with deterministic slot assignment

  The switch maintains EXACTLY 256 binding slots, indexed 0..255. The
  slot index assigned to a connection is determined by the connection's
  5-tuple via the following time-invariant function:

      slot(c) = ( srcAddr  XOR  dstAddr
                XOR  ((sport << 16) | dport)
                XOR  proto ) & 0xFF

  That is, take the bitwise XOR (over 32-bit words) of the IPv4 source
  address, the IPv4 destination address, the 32-bit value formed by
  placing the TCP source port in the high 16 bits and the TCP destination
  port in the low 16 bits, and the IPv4 protocol number; then keep only
  the low 8 bits. Two distinct connections may map to the same slot.

  Each slot holds AT MOST ONE connection's binding at any instant.

  ## Per-collision displacement (eviction)

  A first-of-a-connection admission proceeds as follows:

    - Compute the new connection's slot via the function above.
    - If the slot is empty, install the new binding there.
    - If the slot already holds a DIFFERENT connection's binding (i.e.
      one whose 5-tuple differs from the arriving connection's), that
      resident binding is forgotten (evicted) and the new binding takes
      its place. The evicted connection's next arriving packet — should
      one arrive — is treated as a first-of-a-connection packet again,
      advancing the selector and being assigned a fresh back-end (which
      may differ from its original).
    - The selector advances exactly once, regardless of whether the slot
      was empty or held a colliding resident.

  Subsequent packets of a STILL-RESIDENT connection (one whose binding has
  not been evicted) must always reach the SAME back-end the connection
  was originally bound to. The implementation must distinguish "this
  slot holds the arriving connection's binding" from "this slot holds a
  DIFFERENT connection's binding that happens to map to the same slot":
  the former is a hit (no eviction, no selector advance); the latter is
  a miss (eviction, selector advance).

  Two independence properties follow from the rule above and are probed
  by the test suite:

    (i)  As long as no two admitted connections have been mapped to the
         same slot, every admitted connection remains bound to its
         originally-assigned back-end on replay.
    (ii) A displacement at slot K must not perturb the binding stored at
         any other slot J ≠ K.

  ## On admission

  When a packet is admitted, the packet observed at the bound back-end's
  connection point must satisfy ALL of:

    - Its IPv4 destination address has been replaced by the bound
      back-end's address.
    - Its Ethernet destination address has been replaced by the bound
      back-end's hardware address.
    - Its IPv4 hop count is exactly one less than on ingress, and the
      datagram remains a well-formed IPv4 packet that an unmodified
      downstream receiver would accept.
    - All other fields of the packet are byte-identical to the received
      packet (including the IPv4 source address and the TCP ports).

  Discarded packets produce NO output and MUST NOT alter any of the
  switch's internal state — neither the per-connection bindings nor the
  selector.

  ## Control plane

  No control-plane configuration is supplied; the entire VIP / back-end
  relationship and the round-robin policy are determined by the switch's
  internal state and the constants above.
