task_name: three_color_marker_anchor
task_type: full_program
complexity: medium
source: rfc
pattern: P-ThreeColorMarker
pattern_version: '1.0'
seed:
  mode: color_blind
  pbs: 6000
  cbs: 3000
  peak_quantum: 1500
  committed_quantum: 600
  token_unit: bytes
  green_dscp: 10
  yellow_dscp: 12
  red_dscp: 14
  red_action: remark
description: |
  Implement a two-rate three-color marker on a single switch s1, per RFC 2698.
  The switch meters one aggregate stream of IPv4 packets against a peak budget
  and a committed budget, colors each packet green / yellow / red, writes the
  color into the packet's DS field, and forwards it.

  ## State: two byte budgets, shared across the whole IPv4 stream

  Maintain two non-negative byte counters:

   - a PEAK budget, maximum 6000 bytes, and
   - a COMMITTED budget, maximum 3000 bytes.

  Both budgets start full (peak = 6000, committed = 3000). They persist across
  packets — i.e. the color a packet receives depends on the packets that came
  before it.

  ## Per-packet processing

  Let B be the size of the arriving packet in bytes, measured as the IPv4 total
  length (the IP header plus everything after it; the Ethernet header does NOT
  count). For each IPv4 packet, in order:

   1. REPLENISH both budgets, then CAP them at their maxima:
        peak      = min(6000, peak + 1500)
        committed = min(3000, committed + 600)
      The caps are mandatory — a budget must never exceed its maximum however
      many small packets have arrived.
   2. COLOR and CHARGE:
        - if  peak - B < 0        → the packet is RED.   Charge NEITHER budget.
        - else if committed - B<0 → the packet is YELLOW. Subtract B from the
                                     PEAK budget only (never below 0).
        - else                    → the packet is GREEN.  Subtract B from BOTH
                                     budgets (never below 0).
   3. MARK: set the packet's DSCP (the top 6 bits of the IPv4 DS/TOS byte) to
      the color's codepoint, leaving the low 2 bits (ECN) unchanged:
        GREEN → DSCP 10 (TOS byte 40 when ECN=0)
        YELLOW→ DSCP 12 (TOS byte 48 when ECN=0)
        RED   → DSCP 14 (TOS byte 56 when ECN=0)
   4. FORWARD the marked packet out port s1.p2.

  ## Required behaviour / invariants

   - A RED packet MUST leave BOTH budgets unchanged (it is charged nothing). A
     packet that overruns the peak budget is colored red but the budgets are not
     touched, so a following conforming packet is unaffected by it.
   - Neither budget is ever negative and neither ever exceeds its maximum.
   - The strict-less-than test matters: a packet whose size B exactly equals the
     remaining peak budget (peak - B == 0) is NOT red.
   - This is a marker, not a routing hop: the IPv4 source, destination, and TTL,
     and the Ethernet addresses, are NOT modified — only the DS field changes.
   - A frame that is not IPv4 is dropped.

  ## Topology

  One switch s1, two ports. Ingress is s1.p1; all marked packets leave on s1.p2.
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
  links:
  - from: h1
    to: s1.p1
  - from: s1.p2
    to: h2
hosts:
  h1:
    ip: 10.0.1.1
    mac: 08:00:00:00:01:01
    port: s1.p1
  h2:
    ip: 10.0.2.2
    mac: 08:00:00:00:02:02
    port: s1.p2
test_cases:
- name: green_cold
  visibility: public
  description: First packet on full budgets. A 1000-byte packet fits both budgets → GREEN (DSCP 10, TOS 40); both budgets are charged.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:01:00
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        tos: 0
    - UDP:
        sport: 40000
        dport: 5000
    - Raw:
        load_hex: ''
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.tos:
        action: change_to
        value: 40
      IP.dst:
        action: unchanged
      IP.ttl:
        action: unchanged
      Ether.src:
        action: unchanged
- name: yellow_cold
  visibility: public
  description: 'A 4000-byte packet on full budgets: it fits the 6000-byte peak budget but overruns the 3000-byte committed budget → YELLOW (DSCP 12, TOS 48); only the peak budget is charged.'
