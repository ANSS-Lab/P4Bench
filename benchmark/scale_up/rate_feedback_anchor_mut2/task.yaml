task_name: rate_feedback_anchor_mut2
task_type: full_program
complexity: high
source: paper
pattern: P-RateFeedback
pattern_version: '1.0'
seed:
  feedback_header: rcp_rate
  feedback_semantics: rcp_rate
  faithfulness: D5.0_rcp_single_rate
  signal_keying: per_egress_port
  n_signal_classes: 8
  aggregation_mode: packet_count
  aggregation_window: 64
  aggregate_lower_better: true
  path_min_strict: false
  target_rate: 1000000
  default_action: forward
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p3: 3
  links:
  - from: host
    to: s1.p1
  - from: s1.p2
    to: link2
  - from: s1.p3
    to: link3
hosts:
  host:
    note: feedback senders + ordinary traffic; ingress on s1.p1
  link2:
    note: outgoing link for 10.0.2.0/24; congestion class 2; s1.p2
  link3:
    note: outgoing link for 10.0.3.0/24; congestion class 3; s1.p3
description: |-
  Implement an explicit-rate congestion-feedback stamper for BMv2 (v1model). The
  switch tracks how much feedback-carrying traffic it has handled for each of its
  outgoing links, turns that into a locally advertised "fair rate" for the link,
  and writes that rate into a feedback field carried by passing packets.

  Topology: traffic arrives on port 1. The destination IPv4 address selects an
  outgoing port: 10.0.1.0/24 leaves on port 1, 10.0.2.0/24 on port 2,
  10.0.3.0/24 on port 3. A packet whose destination matches no route is dropped.
  The outgoing port also identifies which link's congestion the packet
  contributes to and is rated against.

  Feedback packets are identified by a small shim carried on UDP destination
  port 9999: its first four bytes are a 32-bit advertised-rate value (field name
  RCPFeedback.value). A packet that is not UDP, or is UDP on any other
  destination port, carries no feedback field.

  Required behaviour, per packet:

  - Ordinary traffic. A packet with no feedback shim is forwarded on its normal
    forwarding decision, completely unmodified. Non-IPv4 frames are dropped.

  - Congestion accounting. For a feedback-carrying packet, the switch counts it
    against its outgoing link's load and from that accumulated load derives the
    link's currently advertised rate. The advertised rate must be a deterministic
    function of the traffic the switch has seen (so the same packet train always
    yields the same advertised rate, run to run) and must get SMALLER as the link
    accumulates more load — a busier link advertises a lower rate. The advertised
    rate must never collapse below a sane floor or wrap to an enormous value under
    heavy load. The load each link accumulates is tracked independently.

  - Rate stamping. The switch writes its advertised rate for the packet's
    outgoing link into the feedback field, then forwards the packet on its normal
    forwarding decision. The rate accounting and stamping never change which port
    a packet leaves on and never drop it.

  Both the P4 program and any table entries are yours to author. The observable
  behaviour the switch must get right is the value left in the feedback field
  after each packet — the switch's advertised rate for that packet's outgoing
  link — and that each outgoing link's congestion is accounted independently.
test_cases:
- name: stamp_static_value_over_large_field
  visibility: public
  goal_class: G1
  description: A feedback packet carrying a large (least-restrictive) value is forwarded on its normal outgoing port with the feedback field OVERWRITTEN by the switch's advertised value for the link. No other field changes.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 5000000
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: change_to
        value: 500000
- name: stamp_static_value_over_small_field
  visibility: public
  goal_class: G1
  description: A feedback packet carrying a small value is forwarded with the field OVERWRITTEN by the switch's advertised value — the switch writes its own value unconditionally; it does not have to compare against or preserve the incoming value.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 10
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: change_to
        value: 500000
- name: ordinary_packet_forwarded_unmodified
  visibility: public
  goal_class: G1
  description: An ordinary packet (no feedback shim) to a routable destination is forwarded on its normal outgoing port with no field modified.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 6
    - TCP:
        sport: 5000
        dport: 80
  expected:
    behavior: forward
    output_port: s1.p2
    transformations: {}
- name: stamp_static_value_other_egress
  visibility: hidden
  goal_class: G1
  description: A feedback packet destined for a different outgoing link is forwarded out that link's egress port with the field overwritten by the switch's advertised value for that link — the same static value, since each link sees a single (cold) feedback packet.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.3.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 5000000
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      RCPFeedback.value:
        action: change_to
        value: 500000
- name: equal_value_overwrite_no_byte_change
  visibility: hidden
  goal_class: G2
  description: A feedback packet whose carried value already equals the switch's advertised value is forwarded; overwriting it with the identical value leaves the field byte-unchanged. Forwarded normally.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 500000
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: unchanged
- name: stamp_static_value_third_egress
  visibility: hidden
  goal_class: G2
  description: A feedback packet to the first outgoing link (egress port 1) is stamped with the switch's advertised value for that link and forwarded out port 1 — confirms the stamp/forward works on every routable class.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.1.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 5000000
  expected:
    behavior: forward
    output_port: s1.p1
    transformations:
      RCPFeedback.value:
        action: change_to
        value: 500000
- name: no_route_drop
  visibility: hidden
  goal_class: G2
  description: A feedback packet whose destination matches no route is dropped.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 8.8.8.8
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 5000000
  expected:
    behavior: drop
- name: plain_packet_other_egress_unmodified
  visibility: hidden
  goal_class: G2
  description: An ordinary (no-feedback) packet to a second routable destination is forwarded on its normal outgoing port with no field modified — non-feedback traffic is never stamped.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.3.50
        ttl: 64
        proto: 6
    - TCP:
        sport: 5000
        dport: 80
  expected:
    behavior: forward
    output_port: s1.p3
    transformations: {}
- name: crafted_small_field_still_overwritten
  visibility: hidden
  goal_class: G3
  description: A sender presents a feedback packet whose field is far smaller than the switch's value. Under the relaxed (advisory) folding the switch OVERWRITES the field with its own advertised value regardless — it does not need to preserve the smaller incoming value.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 9999
    - RCPFeedback:
        value: 1
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: change_to
        value: 500000
- name: deterministic_stamp_not_qdepth
  visibility: hidden
  goal_class: G3
  description: The same single feedback packet on a cold link is stamped to a fixed deterministic value derived from the packet-count signal, not from a queue-depth read (which would be ~0 and run-varying). The expected stamp is bit-identical run to run.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40001
        dport: 9999
    - RCPFeedback:
        value: 5000000
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: change_to
        value: 500000
- name: non_ipv4_drop
  visibility: hidden
  goal_class: G3
  description: A non-IPv4 frame (ARP) carries no forwarding class and is dropped before any signal update.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
        type: 2054
    - ARP:
        op: 1
        psrc: 10.0.9.9
        pdst: 10.0.2.50
  expected:
    behavior: drop
- name: udp_non_feedback_port_forwarded
  visibility: hidden
  goal_class: G3
  description: A UDP packet on a non-feedback destination port (53, not the feedback demux port) carries no feedback field and is forwarded unmodified — the feedback path is keyed on the specific demux port, not on UDP in general.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40000
        dport: 53
  expected:
    behavior: forward
    output_port: s1.p2
    transformations: {}
- name: stamp_static_value_repeatable
  visibility: hidden
  goal_class: G3
  description: A feedback packet from a different source port to the same cold link is stamped with the identical static advertised value — the stamp depends only on the per-class signal (cold => static), not on the packet's source port.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 0a:00:00:00:00:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.9.9
        dst: 10.0.2.50
        ttl: 64
        proto: 17
    - UDP:
        sport: 40002
        dport: 9999
    - RCPFeedback:
        value: 5000000
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      RCPFeedback.value:
        action: change_to
        value: 500000
