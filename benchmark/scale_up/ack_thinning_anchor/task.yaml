task_name: ack_thinning_anchor
task_type: full_program
complexity: high
source: paper
pattern: P-AckThinning
pattern_version: '1.0'
seed:
  thinning_direction: reverse_only
  dup_ack_budget: 0
  flow_table_capacity: unbounded
  eviction_policy: none
  faithfulness: D5.0_exact
  default_action: forward
  uplink_port: 1
  forward_port: 2
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
  links:
  - from: uplink
    to: s1.p1
  - from: s1.p2
    to: sender
hosts:
  uplink:
    note: asymmetric uplink carrying the TCP acknowledgement stream; ingress on s1.p1
  sender:
    note: data sender; forwarded acknowledgements egress on s1.p2
description: |-
  Implement a TCP acknowledgement-thinning proxy for BMv2 (v1model). On a
  bandwidth-asymmetric link the reverse path is dominated by a flood of pure TCP
  acknowledgements whose information is redundant, because TCP acknowledgements
  are cumulative. The proxy reduces this reverse-path load by dropping the
  redundant acknowledgements, while never withholding acknowledgement information
  the sender still needs.

  Topology: port 1 is the link on which packets arrive; packets that the proxy
  forwards leave on port 2.

  Required behaviour, per packet:

  - Only pure acknowledgements are ever eligible to be dropped. A pure
    acknowledgement is a TCP segment that has its ACK flag set, carries no payload
    (no application data), and is not a connection setup, teardown, or reset
    segment. Everything else is always forwarded: non-TCP traffic, TCP segments
    that carry data, and the SYN / FIN / RST control segments that open, close, or
    reset a connection — these must pass through so the proxy never breaks a
    connection.

  - The proxy tracks, per TCP connection, the most recent acknowledgement it has
    already let through (a connection is identified by its source and destination
    addresses and ports). For a pure acknowledgement:
    * If the connection has not been seen before, forward it (there is nothing to
      compare against yet).
    * If the acknowledgement carries information beyond what the proxy has already
      forwarded for that connection — i.e. it acknowledges more data than any
      earlier one — it MUST be forwarded.
    * Otherwise the acknowledgement is redundant (it acknowledges nothing new) and
      is dropped.

  The one rule that must never be violated: an acknowledgement that advances a
  connection's cumulative acknowledgement is never dropped — dropping it would
  stall the sender. When the proxy has no basis to decide (a connection it has
  not seen), it forwards. The decision depends only on the packets received;
  there is no timer or periodic packet generation.

  Both the P4 program and any table entries it needs are yours to author. The
  per-connection tracking state is yours to maintain in the data plane.
test_cases:
- name: first_ack_forwarded
  visibility: public
  goal_class: G1
  description: The first pure acknowledgement seen for a connection has no earlier acknowledgement to compare against, so it is forwarded on the forward port unchanged; the connection's tracking state is established from it.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
    - IP:
        src: 198.51.100.9
        dst: 10.0.1.50
        ttl: 64
        proto: 6
    - TCP:
        sport: 80
        dport: 5000
        flags: A
        ack: 1000
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.src:
        action: unchanged
      IP.dst:
        action: unchanged
      IP.ttl:
        action: unchanged
      TCP.ack:
        action: unchanged
