        delta: 1
      IP.dst:
        action: unchanged
      DNSQuery.qname:
        action: unchanged
- name: qr_response_dropped
  visibility: public
  description: |
    A packet on UDP/53 whose QR bit is 1 is a DNS response, not a
    query, and MUST NOT be steered as a query — drop it. Catches a
    classifier that gates only on the UDP port and ignores QR.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.0.53
        ttl: 64
        proto: 17
    - UDP:
        sport: 33408
        dport: 53
    - DNSQuery:
        qr: 1
        qdcount: 1
        qname: www.example.com
        qtype: 1
        qclass: 1
  expected:
    behavior: drop
- name: malformed_compression_pointer_drop
  visibility: hidden
  description: |
    A query whose QNAME contains a label-length octet with its high
    bits set (0xC0 — a compression pointer, not a normal label length)
    MUST be dropped under strict handling rather than followed as a
    label length. Raw DNS bytes: header (QR=0, QDCOUNT=1) + label
    'www' + pointer 0xC00C + QTYPE/QCLASS.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.0.53
        ttl: 64
        proto: 17
    - UDP:
        sport: 33409
        dport: 53
    - Raw:
        load_hex: 12340000000100000000000003777777c00c00010001
  expected:
    behavior: drop
- name: checksum_recompute_route_vip_preserved
  visibility: hidden
  description: |
    Route path checksum / VIP discipline: the IPv4 checksum MUST be
    valid after the TTL decrement, and the IPv4 destination MUST remain
    the anycast VIP (a classifier that DNATs in route mode breaks the
    anycast answer path).
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.0.53
        ttl: 100
        proto: 17
    - UDP:
        sport: 33410
        dport: 53
    - DNSQuery:
        qr: 0
        qdcount: 1
        qname: shop.example.com
        qtype: 1
        qclass: 1
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: decremented_by
        delta: 1
      IP.dst:
        action: unchanged
      IP.chksum:
        action: checksum_valid
      DNSQuery.qname:
        action: unchanged
- name: non_dns_udp_port_dropped
  visibility: hidden
  description: |
    A UDP packet to a non-DNS port (5353) is out of scope and MUST be
    dropped — the switch handles only UDP/53 DNS queries.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.0.53
        ttl: 64
        proto: 17
    - UDP:
        sport: 33411
        dport: 5353
    - Raw:
        load_hex: 12340000000100000000000003777777076578616d706c6503636f6d0000010001
  expected:
    behavior: drop
- name: malformed_truncated_label_drop
  visibility: hidden
  description: |
    A DNS query whose QNAME label-length octet claims more bytes than the
    packet actually contains (length octet 0x07 followed by only 'www'
    before the buffer ends) is truncated mid-label and MUST be dropped
    under strict handling, without reading past the buffer end. This is
    malformed rule 2c (the truncated-label case), distinct from the
    compression-pointer (2a) and over-parse-bound (2b) drops already
    covered. Raw DNS bytes: header (QR=0, QDCOUNT=1) + label-length 7 +
    'www' (only 3 bytes present, no terminator/QTYPE).
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.0.53
        ttl: 64
        proto: 17
    - UDP:
        sport: 33412
        dport: 53
    - Raw:
        load_hex: '12340000000100000000000007777777'
  expected:
    behavior: drop
