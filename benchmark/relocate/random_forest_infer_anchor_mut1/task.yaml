task_name: random_forest_infer_anchor_mut1
task_type: full_program
complexity: medium
source: paper
pattern: P-RandomForest
pattern_version: '1.0'
seed:
  model_artifact:
  - tree_id: 0
    tree_weight: 1
    root:
      feature: 0
      threshold: 50
      tie_break: le
      left:
        leaf_class: 0
      right:
        leaf_class: 1
  class_action_entries:
  - leaf_class: 0
    verdict: forward
    egress_port: 2
    mark_value: none
  - leaf_class: 1
    verdict: forward
    egress_port: 3
    mark_value: none
  feature_set:
  - ipv4.ttl
  - ipv4.diffserv
  feature_count: 2
  feature_bit_width: 8
  num_classes: 2
  n_trees: 1
  tree_depth: 1
  vote_aggregation: majority
  tie_break: lowest_index
  action_breadth: forward_only
  unclassified_action: forward_default
  default_egress_port: 4
  model_capacity: unbounded
  workload_skew: uniform
  faithfulness: D5.0_anchor_small_forest
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p3: 3
      p4: 4
  links:
  - from: h1
    to: s1.p1
  - from: s1.p2
    to: h2
  - from: s1.p3
    to: h3
  - from: s1.p4
    to: h4
hosts:
  h1:
    ip: 10.0.1.1/24
    mac: 08:00:00:00:01:01
    port: s1.p1
  h2:
    ip: 10.0.2.2/24
    mac: 08:00:00:00:02:02
    port: s1.p2
  h3:
    ip: 10.0.3.3/24
    mac: 08:00:00:00:03:03
    port: s1.p3
  h4:
    ip: 10.0.4.4/24
    mac: 08:00:00:00:04:04
    port: s1.p4
description: |-
  A switch s1 acts as an in-network traffic classifier: it evaluates a small,
  pre-trained model on every packet and steers the packet to an egress port
  chosen by the model's predicted class, in the spirit of running a trained
  classifier directly in the switch pipeline at line rate (in-network ML
  inference). Clients reach s1 on port s1.p1; three downstream ports s1.p2,
  s1.p3, s1.p4 lead to the per-class destinations.

  The switch is a STATELESS function: every decision follows only from the
  current packet's header fields and the fixed model + class-to-port mapping
  given below — no per-flow or cross-packet state is kept. The same feature value
  always yields the same class and the same egress port.

  ## Features

  The classifier reads one 8-bit feature from each IPv4 packet:

    - the IPv4 TTL field (`ttl`), an 8-bit value 0-255.

  The feature is already 8 bits wide, so it is used as-is (no scaling or
  rounding). (The IPv4 DSCP/ToS byte may be present but does not influence the
  predicted class in this model.)

  ## The model (a single decision tree)

  Classify each IPv4 packet with one decision rule:

    - if `ttl` is **less than or equal to** 50, the predicted class is 0;
    - otherwise (`ttl` greater than 50) the predicted class is 1.

  A TTL value exactly equal to 50 takes the low side, giving class 0.

  ## Per-packet behaviour

  Process every ingress packet by the first matching rule below.

   1. **Not classifiable -> default port.** If the packet is not an IPv4 packet
      (so the TTL feature field is not present), it cannot be classified; forward
      it unchanged to the default port s1.p4. Do not attempt to read a feature
      field that is not present.

   2. **Classify and steer.** For an IPv4 packet, evaluate the rule above and
      forward the packet — unchanged — to the port mapped to the predicted class:

        - class 0 -> forward to s1.p2
        - class 1 -> forward to s1.p3

      The packet is delivered byte-for-byte identical to what arrived (every
      header and the payload unchanged); only the egress port differs by class.
      No field is rewritten and the TTL is not decremented.

  ## Class-to-port mapping (install as control-plane entries)

  | Class | Egress port |
  |-------|-------------|
  | 0     | s1.p2       |
  | 1     | s1.p3       |

  A packet that is not IPv4 goes to the default port s1.p4 unchanged.

  Grounding: in-network ML inference (a trained decision classifier run in the
  switch pipeline).
test_cases:
- name: class0_low_ttl
  visibility: public
  goal_class: G1
  description: 'ttl=40 (<=50): the single tree predicts class 0 -> the packet is steered to the class-0 port s1.p2, unchanged.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 40
        tos: 10
        proto: 6
    - TCP:
        sport: 40000
        dport: 80
    - Raw:
        load: rf-flow-0
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: class1_high_ttl
  visibility: public
  goal_class: G1
  description: 'ttl=90 (>50): the single tree predicts class 1 -> steered to the class-1 port s1.p3, unchanged.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 90
        tos: 40
        proto: 6
    - TCP:
        sport: 40000
        dport: 443
    - Raw:
        load: rf-flow-1
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: class1_mid_ttl
  visibility: public
  goal_class: G1
  description: 'ttl=200 (>50): class 1 -> s1.p3. Confirms the steer follows the ttl split and not the (unused) DSCP byte.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 200
        tos: 10
        proto: 6
    - TCP:
        sport: 40004
        dport: 80
    - Raw:
        load: rf-flow-1b
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: boundary_ttl_eq_50_low
  visibility: hidden
  goal_class: G2
  description: ttl=50 sits EXACTLY on the tree's <=50 threshold; the 'le' tie-break takes the low branch -> class 0 -> s1.p2. An off-by-one that encodes <= as < flips this to class 1 and mis-steers to s1.p3.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 50
        tos: 10
        proto: 6
    - TCP:
        sport: 40006
        dport: 80
    - Raw:
        load: rf-bnd-b
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: boundary_ttl_eq_51_high
  visibility: hidden
  goal_class: G2
  description: ttl=51 is just above the 50 threshold (high branch) -> class 1 -> s1.p3. The just-above partner of the ttl==50 boundary.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 51
        tos: 40
        proto: 6
    - TCP:
        sport: 40007
        dport: 80
    - Raw:
        load: rf-bnd-c
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: feature_all_ones_max
  visibility: hidden
  goal_class: G2
  description: 'Maximum representable 8-bit features (ttl=255, tos=255): ttl>50 -> class 1 -> s1.p3. Confirms no quantisation wrap/overflow at the all-ones edge.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 255
        tos: 255
        proto: 6
    - TCP:
        sport: 40008
        dport: 80
    - Raw:
        load: rf-max
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: dscp_does_not_change_class
  visibility: hidden
  goal_class: G2
  description: 'ttl=40 (<=50) -> class 0 -> s1.p2 regardless of the DSCP/ToS byte (tos=63 here): the lone tree splits only on ttl, so the declared-but-unused second feature must not affect the verdict.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 40
        tos: 63
        proto: 6
    - TCP:
        sport: 40009
        dport: 80
    - Raw:
        load: rf-dscp-noise
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: unclassifiable_arp_to_default
  visibility: hidden
  goal_class: G2
  description: A non-IPv4 frame (ARP) carries no TTL feature and cannot be classified; it is forwarded unchanged to the default port s1.p4 without reading any absent feature field.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
        type: 2054
    - ARP:
        op: 1
        psrc: 10.0.1.1
        pdst: 10.0.2.2
  expected:
    behavior: forward
    output_port: s1.p4
- name: determinism_same_ttl_noise_payload
  visibility: hidden
  goal_class: G3
  description: Same ttl=40 as class0_low_ttl but a different payload and L4 source port (non-feature fields) -> still class 0 -> s1.p2. The tree must classify only on the configured ttl feature, deterministically per packet.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 40
        tos: 40
        proto: 6
    - TCP:
        sport: 51234
        dport: 8080
    - Raw:
        load: a-completely-different-payload
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: read_invalid_feature_guard_icmp
  visibility: hidden
  goal_class: G3
  description: 'An IPv4 ICMP packet (a non-TCP/UDP transport): ttl=40 still classifies on the IPv4 ttl feature -> class 0 -> s1.p2, with no read of an absent transport feature.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 40
        tos: 10
        proto: 1
    - ICMP:
        type: 8
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: payload_roundtrip_class1
  visibility: hidden
  goal_class: G3
  description: A class-1 packet (ttl=90) with a distinctive payload is forwarded to s1.p3 with every header and the payload delivered byte-for-byte unchanged — the classifier steers, it does not rewrite the packet.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 90
        tos: 40
        proto: 6
    - TCP:
        sport: 40011
        dport: 443
    - Raw:
        load: DISTINCT-PAYLOAD-PRESERVED-0xDEADBEEF
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
