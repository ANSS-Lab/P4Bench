task_name: netlock_anchor
task_type: full_program
complexity: medium
source: paper
pattern: P-NetLock
pattern_version: '1.0'
seed:
  lock_ids:
  - 0
  - 1
  - 2
  - 3
  lock_mode: exclusive
  deny_mode: drop
  waiter_fifo_depth: 0
  grant_response: forward_to_port
  release_check_holder: true
  index_mode: direct
  hash_algo: crc16
  lock_table_capacity: 1024
  faithfulness: D5.0_exclusive
description: |
  Implement an in-switch exclusive lock service on a single switch s1. A lock
  manager that would normally live on a host/coordinator is relocated into the
  data plane: the switch itself grants and releases locks, holding per-lock state
  on the switch and driven entirely by the lock control messages it receives.
  Grounded in NetLock (Yu et al., NSDI 2020).

  ## Lock control messages

  Clients coordinate by sending lock control messages. Each message is a small
  header riding on UDP addressed to the lock-service UDP port (0xABCD). The header
  carries:

    - op         the operation: LOCK (1) or UNLOCK (2)
    - mode       lock mode: EXCLUSIVE (0)  (this service is exclusive-only)
    - status     a result marker the switch sets on a reply: REQ (0), GRANT (1),
                 NACK (2). Requests arrive with status REQ.
    - lock_id    which lock the message targets
    - client_id  the id of the requesting client

  The service manages four locks, with ids 0, 1, 2, and 3.

  ## Topology

  One switch s1 with four ports:
    - s1.p1 — client A (10.0.0.1, MAC 08:00:00:00:00:01, client id 1)
    - s1.p2 — client B (10.0.0.2, MAC 08:00:00:00:00:02, client id 2)
    - s1.p3 — client C (10.0.0.3, MAC 08:00:00:00:00:03, client id 3)
    - s1.p4 — the coordinator port (10.0.0.254), where the switch delivers every
              GRANT and NACK reply.

  Clients send their requests with the Ethernet destination set to the switch
  MAC 08:00:00:00:00:fe.

  ## Required behaviour

  Each lock is either FREE or HELD by exactly one client. A lock starts FREE.
  Process each received message in order; the per-lock state persists across
  messages.

   1. A frame that does not carry a lock-message header (e.g. ordinary UDP to a
      different port, or ARP) is out of scope: it MUST be dropped and MUST NOT
      change any lock state.

   2. LOCK on a FREE lock: bind the requesting client as the holder of that lock
      (the lock becomes HELD by that client), set the message status to GRANT,
      and forward the reply out the coordinator port s1.p4.

   3. LOCK on a lock already HELD by another client: the request is denied. It
      MUST be dropped (no reply); the existing holder is unchanged. A lock that
      is already held MUST NOT be granted to a second client — this is the
      mutual-exclusion guarantee.

   4. UNLOCK from the lock's current holder: release the lock (it returns to
      FREE) and consume the message — an UNLOCK produces no reply of its own. The
      release is observable only because a subsequent LOCK on that lock is now
      granted.

   5. UNLOCK from a client that is NOT the current holder: the release is rejected
      and the message MUST be dropped; the lock stays HELD by its current holder.
      Only the holder may release a lock.

   6. UNLOCK on a lock that is already FREE: a no-op — drop the message; the lock
      stays FREE.

  Each lock is independent: holding one lock does not affect any other lock id.
  There is no waiter queue — a request that cannot be granted immediately is
  denied, not held pending. There is no lease or timeout: a lock is released only
  by an explicit UNLOCK from its holder.

  On every GRANT/NACK reply delivered to the coordinator port, the IPv4 Hop count
  is decremented by one as the packet transits the switch (ordinary forwarding).
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p3: 3
      p4: 4
  links:
  - from: h1
    to: s1.p1
  - from: h2
    to: s1.p2
  - from: h3
    to: s1.p3
  - from: s1.p4
    to: coord
