test_cases:
- name: lock_free_grant
  visibility: public
  description: Client A sends a LOCK request for lock 0, which is free. The switch binds A as the holder and forwards a GRANT (status set to GRANT) out the coordinator port s1.p4.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:01
        dst: 08:00:00:00:00:fe
    - IP:
        src: 10.0.0.1
        dst: 10.0.0.254
        ttl: 2
        proto: 17
    - UDP:
        sport: 5001
        dport: 43981
    - LockMsg:
        op: 1
        mode: 0
        status: 0
        lock_id: 0
        client_id: 1
  expected:
    behavior: forward
    output_port: s1.p4
    transformations:
      LockMsg.status:
        action: change_to
        value: 1
      IP.ttl:
        action: decremented_by
        delta: 1
- name: grant_then_deny_held_lock
