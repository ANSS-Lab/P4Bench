task_name: netlock_anchor_mut2
task_type: full_program
complexity: medium
source: paper
pattern: P-NetLock
pattern_version: '1.0'
seed:
  lock_ids:
  - 0
  - 1
  - 2
  - 3
  lock_mode: shared_exclusive
  deny_mode: drop
  waiter_fifo_depth: 4
  grant_response: forward_to_port
  release_check_holder: true
  index_mode: direct
  hash_algo: crc16
  lock_table_capacity: 256
  faithfulness: D5.2_fifo_fairness
description: "Implement an in-switch reader/writer lock service with a fair waiter queue on a\nsingle switch s1. A lock manager that would normally live on a host/coordinator\nis relocated into the data\
  \ plane: the switch itself grants, queues, and releases\nlocks, holding per-lock state on the switch and driven entirely by the lock\ncontrol messages it receives. Grounded in NetLock (Yu et al., NSDI\
  \ 2020).\n\n## Lock control messages\n\nClients coordinate by sending lock control messages. Each message is a small\nheader riding on UDP addressed to the lock-service UDP port (0xABCD). The header\n\
  carries:\n\n  - op         the operation: LOCK (1) or UNLOCK (2)\n  - mode       requested lock mode: EXCLUSIVE (0) or SHARED (1)\n  - status     a result marker the switch sets on a reply: REQ (0), GRANT\
  \ (1),\n               NACK (2). Requests arrive with status REQ.\n  - lock_id    which lock the message targets\n  - client_id  the id of the requesting client\n\nThe service manages four locks, with\
  \ ids 0, 1, 2, and 3.\n\n## Topology\n\nOne switch s1 with four ports:\n  - s1.p1 \u2014 client A (10.0.0.1, MAC 08:00:00:00:00:01, client id 1)\n  - s1.p2 \u2014 client B (10.0.0.2, MAC 08:00:00:00:00:02,\
  \ client id 2)\n  - s1.p3 \u2014 client C (10.0.0.3, MAC 08:00:00:00:00:03, client id 3)\n  - s1.p4 \u2014 the coordinator port (10.0.0.254), where the switch delivers every\n            GRANT reply.\n\
  \nClients send their requests with the Ethernet destination set to the switch\nMAC 08:00:00:00:00:fe.\n\n## Required behaviour\n\nEach lock is either FREE, or HELD in one of two modes:\n  - SHARED  \u2014\
  \ held concurrently by one or more clients (readers);\n  - EXCLUSIVE \u2014 held by exactly one client (a writer), with no other holders.\nA lock starts FREE. Process each received message in order; per-lock\
  \ state (the\nholders and the waiter queue) persists across messages.\n\nA SHARED request is COMPATIBLE with a lock currently held SHARED; an EXCLUSIVE\nrequest is incompatible with any current holder,\
  \ and any request is incompatible\nwith a current EXCLUSIVE holder. Each lock also has a bounded FIFO waiter queue\n(capacity 4) of clients waiting for it, served oldest-first.\n\n 1. A frame that does\
  \ not carry a lock-message header (e.g. ordinary UDP to a\n    different port, or ARP) is out of scope: it MUST be dropped and MUST NOT\n    change any lock or waiter state.\n\n 2. LOCK on a FREE lock:\
  \ grant it. Bind the requesting client as a holder in the\n    requested mode (SHARED makes the lock SHARED-held with that one reader;\n    EXCLUSIVE makes it EXCLUSIVE-held), set the message status to\
  \ GRANT, leave\n    the granted client id in the message, and forward the reply out s1.p4.\n\n 3. SHARED LOCK on a lock already held SHARED (compatible): admit the requester\n    as an additional concurrent\
  \ reader, set status GRANT, and forward the reply\n    out s1.p4. The earlier readers keep their grants.\n\n 4. LOCK that is NOT immediately grantable \u2014 an EXCLUSIVE request while the lock\n    has\
  \ any holder, or a SHARED request while the lock is held EXCLUSIVE \u2014 is\n    ENQUEUED at the tail of that lock's waiter FIFO (if the queue has room) and\n    the request is consumed with NO immediate\
  \ reply (it will be granted later,\n    on a release). The current holder(s) are unchanged. A held lock is never\n    granted to an incompatible requester immediately: that is the mutual-\n    exclusion\
  \ / reader-writer guarantee.\n\n 5. UNLOCK from a current holder of the lock: that holder relinquishes its grant.\n    - If other (shared) holders remain, the lock stays HELD by them and the\n      UNLOCK\
  \ is consumed with no reply.\n    - If that was the last holder and the waiter FIFO is non-empty: dequeue the\n      FIFO HEAD (the oldest waiter), grant it the lock \u2014 bind it as the new\n      holder\
  \ in the mode it requested \u2014 set status GRANT, set the message's\n      client id to the granted (head) client, and forward the reply out s1.p4.\n      The head waiter, never a later-arriving waiter,\
  \ is the one served \u2014 this\n      is the FIFO-fairness guarantee.\n    - If that was the last holder and the FIFO is empty: the lock returns to\n      FREE and the UNLOCK is consumed with no reply.\n\
  \n 6. UNLOCK from a client that is NOT a current holder of the lock: rejected \u2014 the\n    message MUST be dropped and the lock and its waiters are unchanged. Only a\n    holder may release.\n\n 7.\
  \ UNLOCK on a lock that is already FREE: a no-op \u2014 drop the message.\n\nEach lock is independent: holding or queueing on one lock does not affect any\nother lock id. There is no lease or timeout:\
  \ a lock is released only by an\nexplicit UNLOCK from one of its holders.\n\nOn every GRANT reply delivered to the coordinator port, the IPv4 Hop count is\ndecremented by one as the packet transits the\
  \ switch (ordinary forwarding).\n"
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p3: 3
      p4: 4
  links:
  - from: h1
    to: s1.p1
  - from: h2
    to: s1.p2
  - from: h3
    to: s1.p3
  - from: s1.p4
    to: coord
hosts:
  h1:
    ip: 10.0.0.1
    mac: 08:00:00:00:00:01
    port: s1.p1
  h2:
    ip: 10.0.0.2
    mac: 08:00:00:00:00:02
    port: s1.p2
  h3:
    ip: 10.0.0.3
    mac: 08:00:00:00:00:03
    port: s1.p3
  coord:
    ip: 10.0.0.254
    mac: 08:00:00:00:00:fe
    port: s1.p4
test_cases:
- name: exclusive_lock_free_grant
  visibility: public
  description: Client A sends an EXCLUSIVE LOCK request for lock 0, which is free. The switch binds A as the exclusive holder and forwards a GRANT (status set to GRANT, granted client id A) out the coordinator
    port s1.p4.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:01
        dst: 08:00:00:00:00:fe
    - IP:
        src: 10.0.0.1
        dst: 10.0.0.254
        ttl: 2
        proto: 17
    - UDP:
        sport: 5001
        dport: 43981
    - LockMsg:
        op: 1
        mode: 0
        status: 0
        lock_id: 0
        client_id: 1
  expected:
    behavior: forward
    output_port: s1.p4
    transformations:
      LockMsg.status:
        action: change_to
        value: 1
      LockMsg.client_id:
        action: change_to
        value: 1
      IP.ttl:
        action: decremented_by
        delta: 1
