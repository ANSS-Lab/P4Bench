    layers:
    - Ether:
        src: 08:00:00:00:00:02
        dst: 08:00:00:00:00:fe
    - IP:
        src: 10.0.0.2
        dst: 10.0.0.254
        ttl: 2
        proto: 17
    - UDP:
        sport: 5002
        dport: 43981
    - LockMsg:
        op: 1
        mode: 1
        status: 0
        lock_id: 0
        client_id: 2
  expected:
    behavior: forward
    output_port: s1.p4
    transformations:
      LockMsg.status:
        action: change_to
        value: 1
      LockMsg.client_id:
        action: change_to
