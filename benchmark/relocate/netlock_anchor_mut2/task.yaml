  description: "A plain IPv4/UDP frame to an ordinary port (no lock-message header) is out of scope for the lock service and is dropped \u2014 and it must not mutate any lock or waiter state."
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:01
        dst: 08:00:00:00:00:fe
    - IP:
        src: 10.0.0.1
        dst: 10.0.0.254
        ttl: 2
        proto: 17
    - UDP:
        sport: 5001
        dport: 53
  expected:
    behavior: drop
- name: non_lock_arp_dropped
  visibility: hidden
  description: 'An ARP frame carries no lock-message header and is dropped by the lock service (R0: only lock control messages are handled).'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:01
        dst: ff:ff:ff:ff:ff:ff
        type: 2054
    - ARP:
        op: 1
        psrc: 10.0.0.1
        pdst: 10.0.0.254
        hwsrc: 08:00:00:00:00:01
  expected:
    behavior: drop
- name: double_lock_same_free_second_not_double_granted
  visibility: hidden
  description: "Two clients race for the same free lock 3: A's LOCK arrives first and is granted exclusive; B's LOCK for the same lock is then enqueued (consumed, no reply) \u2014 never a second concurrent\
    \ GRANT. A correct read-test-write admits exactly ONE exclusive holder; the loser queues."
  prior_inputs:
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:01
        dst: 08:00:00:00:00:fe
    - IP:
        src: 10.0.0.1
        dst: 10.0.0.254
        ttl: 64
        proto: 17
    - UDP:
        sport: 5001
        dport: 43981
    - LockMsg:
        op: 1
        mode: 0
        status: 0
        lock_id: 3
        client_id: 1
  input:
    port: s1.p2
    layers:
    - Ether:
        src: 08:00:00:00:00:02
        dst: 08:00:00:00:00:fe
    - IP:
        src: 10.0.0.2
        dst: 10.0.0.254
        ttl: 2
        proto: 17
    - UDP:
        sport: 5002
        dport: 43981
    - LockMsg:
        op: 1
        mode: 0
        status: 0
        lock_id: 3
        client_id: 2
  expected:
    behavior: drop
- name: shared_release_grants_queued_exclusive
  visibility: hidden
  description: "A holds a SHARED lock on lock 2; an EXCLUSIVE request from C is enqueued (blocked by the shared holder). When the shared holder A releases lock 2, the queued exclusive waiter C is granted\
    \ (GRANT, granted client id C) \u2014 the writer waits behind the reader and is served on release."
  prior_inputs:
  - port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:01
        dst: 08:00:00:00:00:fe
    - IP:
        src: 10.0.0.1
        dst: 10.0.0.254
        ttl: 64
        proto: 17
    - UDP:
        sport: 5001
        dport: 43981
    - LockMsg:
        op: 1
        mode: 1
        status: 0
        lock_id: 2
        client_id: 1
  - port: s1.p3
    layers:
    - Ether:
        src: 08:00:00:00:00:03
        dst: 08:00:00:00:00:fe
    - IP:
        src: 10.0.0.3
        dst: 10.0.0.254
        ttl: 64
        proto: 17
    - UDP:
        sport: 5003
        dport: 43981
    - LockMsg:
        op: 1
        mode: 0
        status: 0
        lock_id: 2
        client_id: 3
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:01
        dst: 08:00:00:00:00:fe
    - IP:
        src: 10.0.0.1
        dst: 10.0.0.254
        ttl: 2
        proto: 17
    - UDP:
        sport: 5001
        dport: 43981
    - LockMsg:
        op: 2
        mode: 0
        status: 0
        lock_id: 2
        client_id: 1
  expected:
    behavior: forward
    output_port: s1.p4
    transformations:
      LockMsg.status:
        action: change_to
        value: 1
      LockMsg.client_id:
        action: change_to
        value: 3
      IP.ttl:
        action: decremented_by
        delta: 1
