description: |-
  A switch s1 acts as an in-network traffic classifier: it evaluates a
  pre-trained random forest (a set of decision trees that VOTE) on every packet
  and steers the packet to an egress port chosen by the forest's predicted class,
  in the spirit of running a trained classifier directly in the switch pipeline
  at line rate (in-network ML inference). Clients reach s1 on port s1.p1; three
  downstream ports s1.p2, s1.p3, s1.p4 lead to the per-class destinations.

  The switch is a STATELESS function: every decision follows only from the
  current packet's header fields and the fixed model + class-to-port mapping
  given below — no per-flow or cross-packet state is kept. The same feature
  values always yield the same class and the same egress port.

  ## Features

  The classifier reads three 8-bit features from each IPv4 packet, used by every
  tree of the forest:

    - feature 0 = the IPv4 TTL field (`ttl`), an 8-bit value 0-255.
    - feature 1 = the IPv4 DSCP/ToS field (`tos`/`diffserv`), the 8-bit
      type-of-service byte.
    - feature 2 = the IPv4 total-length field (`total length`), taken modulo 256
      (its low 8 bits) so it is an 8-bit feature like the others.

  ## The model (a forest of six decision trees)

  Classify each IPv4 packet by walking EACH of the six trees from its root. At
  each decision node, compare the named feature to the node's threshold: if the
  feature value is **less than or equal to** the threshold, take the left branch;
  otherwise take the right branch. A leaf gives that tree's predicted class. A
  feature value equal to a threshold takes the left/low branch exactly as written.

    Tree 0 (on ttl):
      ttl <= 32 ?
        yes -> ttl <= 16 ?  yes -> class 0   no -> class 1
        no  -> ttl <= 96 ?
                 yes -> ttl <= 64 ?  yes -> class 1   no -> class 0
                 no  -> ttl <= 160 ? yes -> class 1   no -> class 0

    Tree 1 (on tos):
      tos <= 8 ?
        yes -> class 0
        no  -> tos <= 24 ?
                 yes -> class 1
                 no  -> tos <= 48 ?  yes -> class 0   no -> class 1

    Tree 2 (on total length):
      length <= 40 ?
        yes -> class 0
        no  -> length <= 60 ?
                 yes -> class 1
                 no  -> length <= 200 ?  yes -> class 0   no -> class 1

    Tree 3 (on ttl, then tos):
      ttl <= 100 ?
        yes -> tos <= 20 ?  yes -> class 1   no -> class 0
        no  -> class 1

    Tree 4 (on total length, then ttl):
      length <= 50 ?
        yes -> ttl <= 50 ?  yes -> class 0   no -> class 1
        no  -> class 0

    Tree 5 (on tos, then total length):
      tos <= 32 ?
        yes -> length <= 45 ?  yes -> class 0   no -> class 1
        no  -> class 1

  ## Combining the trees' votes

  Each of the six trees votes for one class. The packet's class is the class that
  receives the MOST votes (the majority). The six votes can split EVENLY (three
  for class 0 and three for class 1); in that case — and in any tie in the vote
  counters — the class with the LOWER index (0 before 1) wins. The vote is
  recomputed independently for each packet from that packet's own features.

  ## Per-packet behaviour

  Process every ingress packet by the first matching rule below.

   1. **Not classifiable -> default port.** If the packet is not an IPv4 packet
      (so the feature fields are not present), it cannot be classified; forward it
      unchanged to the default port s1.p4. Do not attempt to read feature fields
      that are not present.

   2. **Classify and steer.** For an IPv4 packet, evaluate the six trees, take the
      majority class (breaking a tie toward the lower class index), then forward
      the packet — unchanged — to the port mapped to that class:

        - class 0 -> forward to s1.p2
        - class 1 -> forward to s1.p3

      The packet is delivered byte-for-byte identical to what arrived (every
      header and the payload unchanged); only the egress port differs by class.
      No field is rewritten and the TTL is not decremented.

  ## Class-to-port mapping (install as control-plane entries)

  | Majority class | Egress port |
  |----------------|-------------|
  | 0              | s1.p2       |
  | 1              | s1.p3       |

  A packet that is not IPv4 goes to the default port s1.p4 unchanged.

  Grounding: in-network ML inference (random-forest-on-switch; the trees' per-
  packet votes are combined by majority, ties broken toward the lower class
  index).
test_cases:
- name: ensemble_class0_majority
  visibility: public
  goal_class: G1
  description: 'ttl=90, tos=40, total length 40 bytes: the six trees vote 4:2 for class 0 -> the majority class 0 steers the packet to s1.p2, unchanged. The golden many-tree forest path; reading any single tree mis-steers.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 90
        tos: 40
        proto: 6
    - TCP:
        sport: 40000
        dport: 443
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: ensemble_class1_majority
  visibility: public
  goal_class: G1
  description: 'ttl=200, tos=10 (53-byte packet): the six trees vote 4:2 for class 1 -> majority class 1 -> s1.p3, unchanged. Confirms the third feature (total length) participates in the vote.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 200
        tos: 10
        proto: 6
    - TCP:
        sport: 40004
        dport: 80
    - Raw:
        load: rf-disagree-0
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
