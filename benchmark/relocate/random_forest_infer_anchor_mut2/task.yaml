        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: vote_tie_3_3_resolves_class0
  visibility: hidden
  goal_class: G2
  description: 'ttl=40, tos=10 (40-byte packet): the six trees split EXACTLY 3:3 between class 0 and class 1 — an even vote tie. The tie MUST resolve to the lowest class index (0) -> s1.p2. A non-deterministic or highest-index tie-break mis-steers to s1.p3. This even-vote tie is only reachable in an even forest (the odd 3-tree anchor never sees it).'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 40
        tos: 10
        proto: 6
    - TCP:
        sport: 40020
        dport: 80
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
