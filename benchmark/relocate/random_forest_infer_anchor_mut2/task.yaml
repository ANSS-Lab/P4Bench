- name: unclassifiable_arp_to_default
  visibility: hidden
  goal_class: G2
  description: A non-IPv4 frame (ARP) carries no TTL/DSCP/length features and cannot be classified; it is forwarded unchanged to the default port s1.p4 without reading any absent feature field.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
        type: 2054
    - ARP:
        op: 1
        psrc: 10.0.1.1
        pdst: 10.0.2.2
  expected:
    behavior: forward
    output_port: s1.p4
- name: determinism_same_features_noise_payload
  visibility: hidden
  goal_class: G3
  description: ttl=120, tos=50 (40-byte packet) classified twice — once here with a benign sport/dport and once via a noisy variant — must yield the SAME six-tree majority and the SAME egress port. The forest votes only on the configured features and resets its per-class vote counters every packet.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 120
        tos: 50
        proto: 6
    - TCP:
        sport: 40030
        dport: 80
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: read_invalid_feature_guard_icmp
  visibility: hidden
  goal_class: G3
  description: 'An IPv4 ICMP packet (a non-TCP/UDP transport): ttl=200, tos=10 still classifies on the IPv4 features (ttl, diffserv, total length) -> the six-tree majority steers it, with no read of an absent transport feature.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 200
        tos: 10
        proto: 1
    - ICMP:
        type: 8
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: payload_roundtrip_majority
  visibility: hidden
  goal_class: G3
  description: A packet (ttl=90, tos=40) with a distinctive payload is forwarded to its majority-class port with every header and the payload delivered byte-for-byte unchanged — the forest steers, it does not rewrite the packet. The payload length feeds the total-length feature but the payload bytes are preserved.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 90
        tos: 40
        proto: 6
    - TCP:
        sport: 40011
        dport: 443
    - Raw:
        load: DISTINCT-PAYLOAD-PRESERVED-0xDEADBEEF
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
