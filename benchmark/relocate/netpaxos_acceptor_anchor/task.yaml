        msg_type: 1
        inst: 0
        rnd: 3
        vrnd: 0
        vvalue: 99
  expected:
    behavior: drop
  prior_inputs:
  - port: s1.p1
    layers: *id004
- name: prepare_does_not_corrupt_value
  visibility: hidden
  goal_class: G3
  description: 'An instance holding accepted value 42 (round 5) receives a winning prepare at round 9: the promise reply echoes the still-intact accepted pair (5,42); a subsequent prepare must never overwrite the accepted value register.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.1.7
        dst: 10.0.1.1
        ttl: 64
        proto: 17
    - UDP:
        sport: 5000
        dport: 34952
    - Paxos:
        msg_type: 0
        inst: 0
        rnd: 9
        vrnd: 0
        vvalue: 0
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      Paxos.msg_type:
        action: change_to
        value: 2
      Paxos.vrnd:
        action: change_to
        value: 5
      Paxos.vvalue:
        action: change_to
        value: 42
  prior_inputs:
  - port: s1.p1
    layers: *id002
  - port: s1.p1
    layers: *id003
- name: drop_reply_accepted_loopback
  visibility: hidden
  goal_class: G3
  description: An accepted message (an acceptor output) arriving as input is dropped and leaves no state behind — the acceptor never re-processes its own replies.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
    - IP:
        src: 10.0.1.7
        dst: 10.0.1.1
        ttl: 64
        proto: 17
    - UDP:
        sport: 5000
        dport: 34952
    - Paxos:
        msg_type: 3
        inst: 0
        rnd: 5
        vrnd: 5
        vvalue: 42
  expected:
    behavior: drop
