- name: drop_non_paxos_arp
  visibility: hidden
  goal_class: G3
  description: A non-IPv4 frame (ARP) carries no consensus message and is dropped before any acceptor logic runs.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:00:11
        dst: 08:00:00:00:01:01
        type: 2054
    - ARP:
        op: 1
        psrc: 10.0.1.7
        pdst: 10.0.1.1
  expected:
    behavior: drop
- name: drop_non_paxos_plain_udp
  visibility: hidden
  goal_class: G3
  description: A plain UDP datagram to an unrelated port carries no consensus message and is dropped.
  input:
