- name: non_handshake_record_dropped
  visibility: hidden
  description: "A TCP/443 record whose content type is application_data (23), NOT handshake (22), is NOT\
    \ steered as a ClientHello \u2014 drop (R0). Catches a classifier that gates only on tcp.dst==443."
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.0.99
        ttl: 64
        proto: 6
    - TCP:
        sport: 40000
        dport: 443
        flags: PA
    - TLSRecord:
        content_type: 23
        length: 118
    - TLSHandshake:
        msg_type: 1
        length: 114
    - TLSClientHello:
        extensions_len: 25
    - TLSExtSNI:
        ext_type: 0
        ext_len: 21
        sni_list_len: 19
        name_type: 0
        name_len: 15
        host_name: "api.example.com\0"
  expected:
    behavior: drop
- name: non_clienthello_handshake_dropped
  visibility: hidden
  description: A TCP/443 handshake record whose message type is NOT client_hello (msg_type=2, server_hello)
    is dropped (R0).
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.0.99
        ttl: 64
        proto: 6
    - TCP:
        sport: 40000
        dport: 443
        flags: PA
    - TLSRecord:
        content_type: 22
        length: 118
    - TLSHandshake:
        msg_type: 2
        length: 114
    - TLSClientHello:
        extensions_len: 25
    - TLSExtSNI:
        ext_type: 0
        ext_len: 21
        sni_list_len: 19
        name_type: 0
        name_len: 15
        host_name: "api.example.com\0"
  expected:
