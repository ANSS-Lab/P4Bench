    - TCP:
        sport: 40000
        dport: 443
        flags: PA
    - TLSRecord:
        content_type: 22
        length: 118
    - TLSHandshake:
        msg_type: 1
        length: 114
    - TLSClientHello:
        extensions_len: 25
    - TLSExtSNI:
        ext_type: 0
        ext_len: 21
