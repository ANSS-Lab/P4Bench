- name: route_vip_preserved_high_ttl
  visibility: hidden
  description: 'Route-path discipline: with TTL 100, the IPv4 checksum is valid after TTL-- and the destination
    stays the VIP (a classifier that DNATs in route mode breaks the VIP handshake-completion path).'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.0.99
        ttl: 100
        proto: 6
    - TCP:
        sport: 40000
        dport: 443
        flags: PA
    - TLSRecord:
        content_type: 22
        length: 118
    - TLSHandshake:
        msg_type: 1
        length: 114
    - TLSClientHello:
        extensions_len: 25
    - TLSExtSNI:
        ext_type: 0
        ext_len: 21
        sni_list_len: 19
        name_type: 0
        name_len: 15
        host_name: "api.example.com\0"
