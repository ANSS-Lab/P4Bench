task_name: random_forest_infer_anchor
task_type: full_program
complexity: medium
source: paper
pattern: P-RandomForest
pattern_version: '1.0'
seed:
  model_artifact:
  - tree_id: 0
    tree_weight: 1
    root:
      feature: 0
      threshold: 64
      tie_break: le
      left:
        feature: 1
        threshold: 16
        tie_break: le
        left:
          leaf_class: 0
        right:
          leaf_class: 1
      right:
        feature: 0
        threshold: 128
        tie_break: le
        left:
          leaf_class: 1
        right:
          leaf_class: 0
  - tree_id: 1
    tree_weight: 1
    root:
      feature: 1
      threshold: 32
      tie_break: le
      left:
        leaf_class: 0
      right:
        feature: 0
        threshold: 100
        tie_break: le
        left:
          leaf_class: 1
        right:
          leaf_class: 0
  - tree_id: 2
    tree_weight: 1
    root:
      feature: 0
      threshold: 50
      tie_break: le
      left:
        leaf_class: 0
      right:
        leaf_class: 1
  class_action_entries:
  - leaf_class: 0
    verdict: forward
    egress_port: 2
    mark_value: none
  - leaf_class: 1
    verdict: forward
    egress_port: 3
    mark_value: none
  feature_set:
  - ipv4.ttl
  - ipv4.diffserv
  feature_count: 2
  feature_bit_width: 8
  num_classes: 2
  n_trees: 3
  tree_depth: 3
  vote_aggregation: majority
  tie_break: lowest_index
  action_breadth: forward_only
  unclassified_action: forward_default
  default_egress_port: 4
  model_capacity: unbounded
  workload_skew: uniform
  faithfulness: D5.0_anchor_small_forest
topology:
  switches:
  - name: s1
    device_id: 0
    ports:
      p1: 1
      p2: 2
      p3: 3
      p4: 4
  links:
  - from: h1
    to: s1.p1
  - from: s1.p2
    to: h2
  - from: s1.p3
    to: h3
  - from: s1.p4
    to: h4
hosts:
  h1:
    ip: 10.0.1.1/24
    mac: 08:00:00:00:01:01
    port: s1.p1
  h2:
    ip: 10.0.2.2/24
    mac: 08:00:00:00:02:02
    port: s1.p2
  h3:
    ip: 10.0.3.3/24
    mac: 08:00:00:00:03:03
    port: s1.p3
  h4:
    ip: 10.0.4.4/24
    mac: 08:00:00:00:04:04
    port: s1.p4
description: |-
  A switch s1 acts as an in-network traffic classifier: it evaluates a small,
  pre-trained random forest (a set of decision trees that VOTE) on every packet
  and steers the packet to an egress port chosen by the forest's predicted class,
  in the spirit of running a trained classifier directly in the switch pipeline
  at line rate (in-network ML inference). Clients reach s1 on port s1.p1; three
  downstream ports s1.p2, s1.p3, s1.p4 lead to the per-class destinations.

  The switch is a STATELESS function: every decision follows only from the
  current packet's header fields and the fixed model + class-to-port mapping
  given below — no per-flow or cross-packet state is kept. The same feature
  values always yield the same class and the same egress port.

  ## Features

  The classifier reads two 8-bit features from each IPv4 packet, used by every
  tree of the forest:

    - feature 0 = the IPv4 TTL field (`ttl`), an 8-bit value 0–255.
    - feature 1 = the IPv4 DSCP/ToS field (`tos`/`diffserv`), the 8-bit
      type-of-service byte.

  Both features are already 8 bits wide, so they are used as-is (no scaling or
  rounding).

  ## The model (a forest of three decision trees)

  Classify each packet by walking EACH of the three trees from its root. At each
  decision node, compare the named feature to the node's threshold: if the
  feature value is **less than or equal to** the threshold, take the left branch;
  otherwise take the right branch. A leaf gives that tree's predicted class. A
  feature value equal to a threshold takes the left/low branch exactly as
  written.

    Tree 0:
      node A (root):  ttl <= 64 ?
          left  (ttl <= 64):  node B
          right (ttl >  64):  node C
      node B:  tos <= 16 ?   left -> class 0    right -> class 1
      node C:  ttl <= 128 ?  left -> class 1    right -> class 0

    Tree 1:
      node A (root):  tos <= 32 ?
          left  (tos <= 32):  class 0
          right (tos >  32):  node B
      node B:  ttl <= 100 ?  left -> class 1    right -> class 0

    Tree 2:
      node A (root):  ttl <= 50 ?  left -> class 0    right -> class 1

  ## Combining the trees' votes

  Each of the three trees votes for one class. The packet's class is the class
  that receives the MOST votes (the majority). If two classes receive the same
  number of votes, the class with the LOWER index (0 before 1) wins. The vote is
  recomputed independently for each packet from that packet's own features.

  ## Per-packet behaviour

  Process every ingress packet by the first matching rule below.

   1. **Not classifiable → default port.** If the packet is not an IPv4 packet
      (so the TTL and DSCP feature fields are not present), it cannot be
      classified; forward it unchanged to the default port s1.p4. Do not attempt
      to read feature fields that are not present.

   2. **Classify and steer.** For an IPv4 packet, evaluate the three trees, take
      the majority class, then forward the packet — unchanged — to the port
      mapped to that class:

        - class 0 → forward to s1.p2
        - class 1 → forward to s1.p3

      The packet is delivered byte-for-byte identical to what arrived (every
      header and the payload unchanged); only the egress port differs by class.
      No field is rewritten and the TTL is not decremented.

  ## Class-to-port mapping (install as control-plane entries)

  | Majority class | Egress port |
  |----------------|-------------|
  | 0              | s1.p2       |
  | 1              | s1.p3       |

  A packet that is not IPv4 goes to the default port s1.p4 unchanged.

  Grounding: in-network ML inference (random-forest-on-switch; the trees' per-
  packet votes are combined by majority).
test_cases:
- name: class0_unanimous
  visibility: public
  goal_class: G1
  description: 'ttl=40, tos=10: all three trees vote class 0 (a clear majority) -> the packet is steered to the class-0 port s1.p2, unchanged. The golden unanimous-forest path.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 40
        tos: 10
        proto: 6
    - TCP:
        sport: 40000
        dport: 80
    - Raw:
        load: rf-flow-0
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: class1_unanimous
  visibility: public
  goal_class: G1
  description: 'ttl=90, tos=40: all three trees vote class 1 -> steered to the class-1 port s1.p3, unchanged.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 90
        tos: 40
        proto: 6
    - TCP:
        sport: 40000
        dport: 443
    - Raw:
        load: rf-flow-1
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: majority_overrides_minority_to_class1
  visibility: public
  goal_class: G1
  description: 'ttl=40, tos=40: the trees DISAGREE 2:1 (two vote class 1, one votes class 0). The MAJORITY class 1 selects the port -> s1.p3, NOT the lone minority tree. A classifier that reads a single tree mis-steers this packet.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 40
        tos: 40
        proto: 6
    - TCP:
        sport: 40003
        dport: 80
    - Raw:
        load: rf-disagree-1
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: majority_overrides_minority_to_class0
  visibility: hidden
  goal_class: G2
  description: 'ttl=200, tos=10: the trees DISAGREE 2:1 the other way (two vote class 0, one votes class 1). Majority class 0 -> s1.p2. The mirror of the class-1 disagreement case.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 200
        tos: 10
        proto: 6
    - TCP:
        sport: 40004
        dport: 80
    - Raw:
        load: rf-disagree-0
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: boundary_on_thresholds_class0
  visibility: hidden
  goal_class: G2
  description: ttl=64 and tos=16 sit EXACTLY on Tree 0's two <= thresholds (both take the low branch, so Tree 0 votes class 0). With Tree 1 (tos<=32 -> c0) and Tree 2 (ttl>50 -> c1) the majority is class 0 -> s1.p2. An off-by-one that encodes <= as < flips Tree 0 to class 1 and mis-steers to s1.p3.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 64
        tos: 16
        proto: 6
    - TCP:
        sport: 40005
        dport: 80
    - Raw:
        load: rf-bnd-a
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: boundary_ttl_eq_50_tree2
  visibility: hidden
  goal_class: G2
  description: ttl=50 sits exactly on Tree 2's <=50 threshold (low branch -> class 0); tos=10 -> Tree 0 c0, Tree 1 c0 -> unanimous class 0 -> s1.p2. The low-side per-tree boundary tie-break.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 50
        tos: 10
        proto: 6
    - TCP:
        sport: 40006
        dport: 80
    - Raw:
        load: rf-bnd-b
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: boundary_ttl_eq_51_flips_tree2
  visibility: hidden
  goal_class: G2
  description: ttl=51 is just above Tree 2's 50 threshold (high branch -> class 1); with tos=40 -> Tree 0 c1, Tree 1 c1 -> unanimous class 1 -> s1.p3. The just-above partner of the ttl==50 boundary.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 51
        tos: 40
        proto: 6
    - TCP:
        sport: 40007
        dport: 80
    - Raw:
        load: rf-bnd-c
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: feature_all_ones_max
  visibility: hidden
  goal_class: G2
  description: 'Maximum representable 8-bit features (ttl=255, tos=255): Tree 0 (ttl>128 -> c0), Tree 1 (tos>32 & ttl>100 -> c0), Tree 2 (ttl>50 -> c1) -> majority class 0 -> s1.p2. Confirms no quantisation wrap/overflow at the all-ones edge.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 255
        tos: 255
        proto: 6
    - TCP:
        sport: 40008
        dport: 80
    - Raw:
        load: rf-max
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: unclassifiable_arp_to_default
  visibility: hidden
  goal_class: G2
  description: A non-IPv4 frame (ARP) carries no TTL/DSCP features and cannot be classified; it is forwarded unchanged to the default port s1.p4 without reading any absent feature field.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: ff:ff:ff:ff:ff:ff
        type: 2054
    - ARP:
        op: 1
        psrc: 10.0.1.1
        pdst: 10.0.2.2
  expected:
    behavior: forward
    output_port: s1.p4
- name: determinism_same_features_noise_payload
  visibility: hidden
  goal_class: G3
  description: Identical feature values to majority_overrides_minority_to_class1 (ttl=40, tos=40) but a different payload and L4 source port (non-feature fields) -> still majority class 1 -> s1.p3. The forest must vote only on the configured features and must reset its vote counters per packet.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 40
        tos: 40
        proto: 6
    - TCP:
        sport: 51234
        dport: 8080
    - Raw:
        load: a-completely-different-payload
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: read_invalid_feature_guard_icmp
  visibility: hidden
  goal_class: G3
  description: 'An IPv4 ICMP packet (no TTL/DSCP issue here, but exercises a non-TCP/UDP transport): ttl=40, tos=10 still classifies on the IPv4 features (Tree votes c0,c0,c0) -> class 0 -> s1.p2, with no read of an absent transport feature. Confirms the classifier reads only present feature headers.'
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 40
        tos: 10
        proto: 1
    - ICMP:
        type: 8
  expected:
    behavior: forward
    output_port: s1.p2
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
- name: payload_roundtrip_class1
  visibility: hidden
  goal_class: G3
  description: A class-1 packet (ttl=90, tos=40, unanimous) with a distinctive payload is forwarded to s1.p3 with every header and the payload delivered byte-for-byte unchanged — the forest steers, it does not rewrite the packet.
  input:
    port: s1.p1
    layers:
    - Ether:
        src: 08:00:00:00:01:01
        dst: 08:00:00:00:00:01
    - IP:
        src: 10.0.1.1
        dst: 10.0.2.2
        ttl: 90
        tos: 40
        proto: 6
    - TCP:
        sport: 40011
        dport: 443
    - Raw:
        load: DISTINCT-PAYLOAD-PRESERVED-0xDEADBEEF
  expected:
    behavior: forward
    output_port: s1.p3
    transformations:
      IP.ttl:
        action: unchanged
      IP.tos:
        action: unchanged
      IP.dst:
        action: unchanged
