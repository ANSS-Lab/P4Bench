# P-TLSSNIRoute — TLS Server Name Indication (SNI) based routing / filtering
#
# TPL v1.0 task pattern. The shallow-L7 *sibling* of
# P-DNSLoadBalancer: where P-DNSLoadBalancer parses a UDP/53 DNS query's
# length-prefixed QNAME and steers by domain name, this pattern parses the
# *clear-text* SNI inside a TLS ClientHello carried on a TCP segment and
# steers by the requested server name — the only host-side string the TLS
# handshake exposes before encryption begins (RFC 6066 §3, RFC 8446 §4.1.2).
# It fills the same (D7:security ∪ D5:routing × P12:shallow-L7-protocols)
# `relocate` cell of the NF design-space map and is grounded in
# the two TLS RFCs rather than DNS's RFC 1035; it shares P-DNSLoadBalancer's
# parse-then-route conventions, its parser-feasibility caveats (the common v1model
# variable-length-parse silent-failure surfaces), and its
# mechanism-assigned descriptive tags (name-based steering = D5:routing;
# SNI denylist / threat-blocking = D7:security).
#
# target_capability = relocate: SNI-based steering / filtering historically
# lived on TLS-terminating proxies, L7 firewalls, and SNI-routing front
# ends (Envoy, HAProxy `ssl-hello-type`, nginx `ssl_preread`); the switch
# data plane can now *receive* the (clear-text) ClientHello-inspection
# half. The relocate frontier's structural failure mode is acute
# here: the SUT must redesign a host-side variable-length TLS-record
# walk — record header → handshake header → fixed ClientHello prefix →
# variable session-id / cipher-suite / compression lists → extension list →
# the server_name extension — onto a bounded, loop-free match-action parser
# with NO prior data-plane design to copy.
#
# Extracted from RFC 6066 (the canonical
# normative source for the server_name extension wire format) and RFC 8446
# (the TLS 1.3 ClientHello structure).
# Instances REQUIRE a TLS `custom_headers.py` (Scapy ships no native bounded
# ClientHello/SNI layer the verifier can build) — see bridging_notes.

pattern_id: P-TLSSNIRoute
version: "1.0"

nf_categories:                                                # NF-category tags (ID:name pairs)
  descriptive:  [D7:security, D5:routing]                     # mechanism-assigned: P12 is a publication-record-gap row with no native descriptive family. SNI denylist / TLS threat-blocking = security (D7); SNI-based backend steering = routing (D5). Multi-tag straddle, same precedent as P-DNSLoadBalancer [D5,D7] and P-StatefulFW [D1,D7].
  prescriptive: [P12:shallow-L7-protocols]                    # parse an upper-layer (TLS) header; proxy-style name-based steering — the `relocate` row in the NF-category table

target_capability: relocate                                   # TLS SNI inspection / steering relocated from L7 proxies and SNI-routing front ends down into the switch pipeline

summary: >
  A shallow-L7 TLS SNI router / filter. On a TCP segment carrying a TLS
  *ClientHello* (record content_type=22 handshake, handshake msg_type=1)
  the switch parses a BOUNDED ClientHello layout — the fixed prefix
  (legacy_version, random), the variable-length legacy_session_id,
  cipher_suites, and legacy_compression_methods lists (each walked only up
  to a configured byte/extension bound), then the extensions block — to
  reach the server_name (SNI) extension (extension type 0x0000, RFC 6066
  §3), extracts the first HostName from its ServerNameList, derives a
  bounded fixed-width *name key* under the configured match breadth
  (exact host, registrable suffix, or hashed full name) and case
  normalisation, and looks it up in a control-plane `sni_policy` table.
  The matched row carries one of three actions: *route* (L3-forward the
  segment to the designated backend port — MAC rewrite, TTL decrement,
  IPv4-checksum recompute, the destination VIP preserved so the chosen
  backend completes the handshake with the client), *rewrite* (DNAT the
  destination to a specific backend IP with IPv4 + TCP checksum recompute),
  or *block* (drop the connection attempt — a denylisted / threat SNI, the
  D7:security half). A ClientHello whose SNI sits beyond the parser's
  bounded prefix (a session-id / cipher-suite / extension list longer than
  the configured bounds, or more extensions than `${max_extension_count}`),
  that carries no server_name extension, or that is not a ClientHello at
  all is handled per `${malformed_handling}` (strict drop vs steer to the
  default backend). Unmatched well-formed names fall to `${default_action}`
  under default-deny or default-forward. The pattern is STATELESS — every
  decision derives from the parsed ClientHello fields and the control-plane
  table — which is what differentiates it from the stateful-TLS-proxy
  patterns; its difficulty lives in the data-dependent bounded TLS-record
  walk and the parse-then-deparse round-trip of the (untouched) TLS
  payload. Faithfulness anchors at D5.0 (route-only, exact whole-SNI match
  within a shallow bounded prefix, lax malformed handling, byte-exact
  compare) and ladders through D5.1 (strict malformed drop, registrable
  suffix match, case-insensitive compare, deeper extension walk), D5.2
  (add the rewrite/DNAT action with TCP checksum), and D5.3 (add SNI
  denylist blocking + hashed full-name match under adversarial deep-prefix
  workload). Full variable-length TLS parsing (unbounded lists, TLS record
  fragmentation across segments, encrypted-ClientHello / ESNI) is
  v2-DEFERRED; this pattern is the bounded-prefix subset that a v1model
  parser can express.

# ─── Network-knowledge grounding ────────────────────────────────────────────

grounding:

  papers: []                                                  # TLS data-plane SNI inspection is engineering-mature but has little coverage in the SIGCOMM/NSDI/CoNEXT literature. Its lineage is the L7-proxy / SNI-routing front-end design space (Envoy, HAProxy ssl-hello-type, nginx ssl_preread) and the NetCache shallow-L7-parse precedent; no paper is cited because none was directly read.

  rfcs:
    - cite: rfc6066
      title: "Transport Layer Security (TLS) Extensions: Extension Definitions"
      sections: ["§3 Server Name Indication"]
      role: normative_behaviour
      quote: "In order to provide any of the server names, clients MAY include an extension of type \"server_name\" in the (extended) client hello."
      quote_source: "RFC 6066 §3 Server Name Indication (verbatim; cached at patterns/P-TLSSNIRoute/grounding/rfc6066.txt). Grounds the ClientHello server_name (SNI) extraction the router classifies on."
      quote_status: "DRAFT — pending GS2 human verdict"
      relevance: |
        The canonical normative source for the server_name extension wire
        format and the spine of the SNI-extraction rule and the
        well-formedness boundary. The clauses below bind directly on the
        bounded data-plane parse and the routing decision:

          - §3 — "In order to provide any of the server names, clients MAY
            include an extension of type 'server_name' in the (extended)
            client hello." The extension's `extension_data` is a
            `ServerNameList`: a 2-octet list length, then one or more
            `ServerName` entries, each a 1-octet `NameType` followed by the
            name. This length-prefixed nesting (list-length → entry →
            name-type → 2-octet HostName length → HostName bytes) is the
            exact bounded walk R3/R4 perform to reach the HostName, and the
            `sni_at_prefix_bound` / `sni_beyond_prefix_bound` G2 tests pin
            the byte-offset boundary the parser must accept vs. give up at.

          - §3 — `NameType` `host_name(0)`: "The 'HostName' contains the
            fully qualified DNS hostname of the server, as understood by the
            client." The pattern keys on this host_name(0) entry; a
            ServerName whose NameType is not host_name(0) is ignored for the
            name key (the `non_hostname_nametype_default` G2 case pins this).

          - §3 — "'HostName' contains the fully qualified DNS hostname …
            represented as a byte string … Literal IPv4 and IPv6 addresses
            are not permitted in 'HostName'." and "The hostname is …
            interpreted [as] case-insensitive." The case-insensitivity MUST
            turns into the `${case_normalization}` knob: a classifier that
            keys on raw HostName bytes mis-classifies `Example.COM` vs
            `example.com`. This is the faithfulness surface the
            `enable_case_insensitive_match` operator moves.

          - §3 — "If the server understood the ClientHello extension but
            does not recognize the server name, the server SHOULD … abort
            with a fatal-level unrecognized_name(112) alert." A switch acting
            as an SNI router does not originate alerts (no `emit` in this
            pattern); an unrecognised name falls to `${default_action}`
            (default-forward to a catch-all backend, or default-deny drop) —
            the `unmatched_sni_default` behaviour, R5.

    - cite: rfc8446
      title: "The Transport Layer Security (TLS) Protocol Version 1.3"
      sections: ["§4 Handshake Protocol", "§4.1.2 Client Hello", "§5.1 Record Layer"]
      role: normative_behaviour
      relevance: |
        Defines the ClientHello structure the bounded parse walks to reach
        the extensions block (and hence the server_name extension), and the
        record-layer framing that identifies a handshake record:

          - §5.1 — the TLSPlaintext record header is `ContentType type`
            (handshake = 22), `ProtocolVersion legacy_record_version`, and a
            2-octet `length`. R0 gates on `content_type == 22` to admit only
            handshake records; the `non_handshake_record_dropped` G3 test
            pins that an application_data (23) or alert (21) record is never
            steered as a ClientHello.

          - §4 / §4.1.2 — the Handshake header is `HandshakeType msg_type`
            (client_hello = 1) and a 3-octet `length`; R0 also gates on
            `msg_type == 1`. The ClientHello body is
            `legacy_version` (2) ‖ `random` (32) ‖
            `legacy_session_id<0..32>` ‖ `cipher_suites<2..2^16-2>` ‖
            `legacy_compression_methods<1..2^8-1>` ‖ `extensions<8..2^16-1>`.
            EACH of the three middle fields is length-prefixed and
            variable, which is precisely why the SNI "sits behind variable-
            length cipher-suite/extension lists" — a v1model parser must
            commit to BOUNDED maximum lengths for the session-id,
            cipher-suite, and compression lists and a bounded
            `${max_extension_count}` extension walk to reach server_name in a
            finite number of states. A ClientHello whose lists overflow
            those bounds is handled per `${malformed_handling}` — the exact
            v2-deferred boundary `sni_beyond_prefix_bound` /
            `extensions_exceed_bound` probe.

          - §4.1.2 — "Because TLS 1.3 forbids renegotiation, if a server has
            negotiated TLS 1.3 and receives a ClientHello at any other time,
            it MUST terminate the connection." Out of scope for a stateless
            SNI router (no connection state); the pattern inspects the
            *initial* ClientHello only and the return / handshake-completion
            path is left to the selected backend, the same scope narrowing
            P-DNSLoadBalancer applies to the DNS response path.
      common_knowledge_baseline_used: |
        Concrete BMv2 / v1model realisation — the bounded TLS-record walk as an
        unrolled chain of parser states (record header → handshake header →
        fixed ClientHello prefix → length-prefixed `extract`s of the
        session-id / cipher-suite / compression lists capped at their
        configured byte bounds → a bounded extension-walk `select` loop that
        terminates on the server_name type (0x0000), on `${max_extension_count}`,
        or on `error.StackOutOfBounds`), the hash extern call that folds the
        HostName into a fixed-width table key, and the `update_checksum` calls
        on the IPv4 (and rewrite-mode TCP) headers — is widely-known
        P4-on-v1model practice rather than RFC-cited, and is flagged
        `[common-knowledge baseline]` in `bridging_notes:`.


# ─── Entities and state declarations ────────────────────────────────────────

entities:

  packet:
    notes: |
      Atomic; no per-packet state. Every steering decision derives from the
      parsed TLS record + handshake + ClientHello fields, the ingress port,
      and the control-plane-installed `sni_policy` table. The pattern is
      STATELESS — no `flow` / `connection` / `session` rows are maintained.
      Only the initial ClientHello direction is in scope: the switch steers
      the client→backend handshake-opening segment and the chosen backend
      completes the handshake with the client directly (VIP-preserving route
      mode) or via a return path that composes transitively with P-NAT44
      (rewrite mode). This keeps the oracle cost bounded while exercising the
      full shallow-L7 parse surface.

  sni_policy:                                                 # TPL `bucket` — aggregate state across a class of connections (per-SNI steering decision)
    type: bucket
    keyed_by_tuple: [name_key]                                # name_key is derived from the parsed HostName per ${name_match_breadth} and ${case_normalization}
    attrs:
      action:       "enum {route, rewrite, block}"            # which rule (R3/R4/R2) the matched class fires
      egress_port:  port                                      # backend egress port (route + rewrite)
      backend_ip:   "address | none"                          # DNAT target (rewrite only)
      backend_mac:  address                                   # next-hop / backend MAC (L2 rewrite on route + rewrite)
      src_mac:      address                                   # this switch's egress-port MAC
    capacity: ${sni_policy_capacity}
    populated_from: ${sni_policy_entries}                     # rows the seed installs
    notes: |
      The SNI → steering-decision table that drives the whole pattern.
      Control-plane installed (an SNI-routing controller, a threat-intel
      denylist feed for the `block` rows, or a static map). `name_key` is
      the bounded fixed-width key the classifier derives from the parsed
      HostName under `${name_match_breadth}` and `${case_normalization}`. At
      D5.0 the table is a handful of exact-host → route rows; D5.3 ladders to
      hashed full-name keys, block rows, and realistic fan-out.

# ─── Parameters ─────────────────────────────────────────────────────────────

parameters:

  sni_policy_entries:
    type: list[sni_policy_entry]
    constraint: |
      every entry has name_pattern (a dotted DNS hostname or label suffix,
      e.g. "example.com", "api.example.com", "cdn"); action ∈
      {route, rewrite, block}; egress_port:int ∈ [1, 511] (required for
      route/rewrite); backend_ip:address (required iff action == rewrite,
      else none); backend_mac:address and src_mac:address (required for
      route/rewrite). The name_key derived from each name_pattern under
      ${name_match_breadth} is unique across the list. action ∈ {rewrite}
      entries appear only when ${action_breadth} ∈ {route_rewrite, all};
      action ∈ {block} entries only when ${action_breadth} ∈
      {route_block, all}.
    notes: |
      The rows that populate the `sni_policy` bucket. Bound by the seed; the
      harness installs the corresponding classification table at task start.
      Instantiation renders each name_pattern into the bounded fixed-width
      key the chosen `${name_match_breadth}` produces.

  max_clienthello_prefix_bytes:
    type: int
    range: "[64, 512]"
    default: 128
    notes: |
      The byte budget the bounded parser walks from the start of the
      ClientHello body before it must have reached the extensions block
      (covering legacy_version, random, and the length-prefixed
      legacy_session_id / cipher_suites / legacy_compression_methods lists,
      RFC 8446 §4.1.2). A ClientHello whose lists push the extensions block
      beyond this budget cannot be parsed by the bounded walk and is handled
      per `${malformed_handling}`. RFC 8446 lets these lists be large; a
      match-action parser must commit to a fixed bound. `deepen_prefix_bound`
      raises it (more bytes / states to unroll correctly, more off-by-one
      risk); capacity axis (the resource is parser prefix depth).

  max_extension_count:
    type: int
    range: "[2, 16]"
    default: 4
    notes: |
      The maximum number of TLS extensions the data plane walks before it
      must find the server_name extension (0x0000) or give up — the declared
      extension-stack `size` in the canonical implementation. RFC 6066 server_name is
      one extension among many (ALPN, supported_versions, key_share, …); the
      parser walks the length-prefixed extension list, `select`-ing on each
      extension_type, terminating on server_name, on the count bound, or on
      `error.StackOutOfBounds`. A ClientHello whose server_name sits past
      `${max_extension_count}` extensions is handled per
      `${malformed_handling}`. `deepen_extension_bound` hardens (capacity
      axis, parser-depth resource — disjoint from the prefix-byte resource).

  name_match_breadth:
    type: enum
    values: [exact_host, suffix_2label, hashed_full]
    default: exact_host
    notes: |
      How the classification key is derived from the parsed HostName.
      `exact_host` keys on the whole HostName bytes (the canonical SNI-router
      key). `suffix_2label` keys on the registrable two-label suffix (e.g.
      `example.com` matches `api.example.com` and `cdn.example.com`) — the
      wildcard-cert / per-domain-policy case, requiring the SUT to locate the
      last two labels in a variable-length name. `hashed_full` folds the full
      HostName into a fixed-width key via `${name_hash_algo}` (a realistic
      switch cannot exact-match an arbitrary-length string in a TCAM).
      Broader / suffix breadth requires parsing and keying more of the name
      correctly, so `broaden_name_match` hardens (feature-breadth axis).

  action_breadth:
    type: enum
    values: [route_only, route_block, route_rewrite, all]
    default: route_only
    notes: |
      Which of the three steering actions (R2 block / R3 route / R4 rewrite)
      the seed's table exercises. `route_only` is the anchor minimum
      (R3 only). `route_block` adds the SNI denylist drop (R2). `route_rewrite`
      adds the DNAT action (R4) and its TCP-checksum surface. `all` enables
      every action. Broader action sets add reachable rules and bug surfaces,
      so `broaden_action` hardens (feature-breadth axis).

  malformed_handling:
    type: enum
    values: [strict_drop, lax_default]
    default: lax_default
    notes: |
      How a record that is not a parseable SNI-bearing ClientHello within the
      bounds is handled: `strict_drop` drops it (activates R1 and the
      malformed G2/G3 tests); `lax_default` lets it fall through to R5's
      `${default_action}`. Malformed-or-unbounded covers: a ClientHello whose
      extensions block sits beyond `${max_clienthello_prefix_bytes}`, whose
      server_name extension is past `${max_extension_count}` extensions, that
      carries no server_name extension at all, or whose declared list / name
      lengths run past the segment end. `strict_drop` is the
      security-conscious harden direction (strictness axis).

  default_action:
    type: enum
    values: [drop, forward_default]
    default: forward_default
    notes: |
      R5 catch-all behaviour for a well-formed ClientHello whose derived
      name_key is not present in `sni_policy` (and, under
      `${malformed_handling} == lax_default`, for malformed records).
      `forward_default` steers to `${default_backend_port}` (a catch-all
      backend); `drop` is the closed-world default-deny. RFC 6066 §3's
      unrecognized_name SHOULD is realised as default-forward / default-deny
      (the switch does not originate the TLS alert). Coupled into the
      faithfulness ladder rather than carrying its own operator pair.

  default_backend_port:
    type: int
    range: "[1, 511]"
    enforced_when: "${default_action} == forward_default"
    notes: |
      Egress port of the default / catch-all backend R5 forwards to under
      `${default_action} == forward_default`. Bound by the seed.

  case_normalization:
    type: bool
    default: false
    notes: |
      Whether the classifier case-folds HostName bytes before deriving the
      key (RFC 6066 §3: the hostname "is … case-insensitive"). `false` keys
      on raw HostName bytes (a naive implementation that mis-classifies
      `Example.COM`); `true` enforces the case-insensitive compare.
      `enable_case_insensitive_match` hardens — it surfaces the implementation that
      forgets SNI hostnames are case-insensitive (faithfulness axis: fidelity
      of the name-comparison semantics).

  name_hash_algo:
    type: enum
    values: [crc16, crc32, xor_fold]
    default: crc16
    enforced_when: "${name_match_breadth} == hashed_full"
    notes: |
      Hash function used to fold the full parsed HostName into a fixed-width
      table key when `${name_match_breadth} == hashed_full`. `xor_fold` is
      the cheapest but weakest — under an adversarial name workload it
      collides distinct names into one key. `swap_hash_to_xor_fold` hardens
      the panel against implementations that copy the textbook CRC pattern without
      considering hash quality (hash-family axis).

  sni_policy_capacity:
    type: int | unbounded
    range: "[8, 1048576]"
    default: unbounded
    notes: |
      Maximum number of name_key entries the SNI classification table
      supports. Realistic SNI-routing / denylist tables sit in the 10²–10⁵
      range; `shrink_policy_capacity_4x` exercises the axis from the
      anchor's `unbounded` baseline, forcing the SUT to consider key
      aggregation (suffix / hashed keys) rather than a row-per-name TCAM
      (capacity axis).

  workload_skew:
    type: enum
    values: [uniform, zipfian, adversarial]
    default: uniform
    notes: |
      Distribution of SNI host names in the G1 traffic tests. `uniform` is
      the anchor default. `zipfian` concentrates queries on a few hot
      names. `adversarial` mixes ClientHellos whose server_name sits exactly
      at the `${max_clienthello_prefix_bytes}` / `${max_extension_count}`
      bounds (maximally-padded session-id / cipher-suite lists and the SNI in
      the last admissible extension) with collision-prone names that stress
      `${name_hash_algo}` quality on the hashed_full key. `raise_workload_skew`
      hardens (workload axis).

  faithfulness:
    type: enum
    values: [D5.0_anchor_route, D5.1_full_classify, D5.2_rewrite_dnat, D5.3_threat_block_strict]
    default: D5.0_anchor_route
    notes: |
      The faithfulness ladder for this pattern. D5.0 is the minimal
      route-only SNI steerer (exact_host match within a shallow bounded
      prefix, lax malformed handling, byte-exact compare). D5.1 lifts to the
      full validation cascade (strict malformed drop, registrable
      suffix match, case-insensitive compare, deeper extension walk). D5.2
      adds the rewrite/DNAT action and its TCP-checksum surface. D5.3 adds
      SNI denylist blocking (block action), hashed full-name match, and the
      adversarial deep-prefix workload. `tighten_faithfulness` walks the
      ladder up; `loosen_faithfulness` walks it down (the feature-breadth
      ladder).

  tls_tcp_port:
    type: int
    range: "[1, 65535]"
    default: 443
    notes: |
      TCP destination port that identifies a TLS connection attempt. 443 is
      the IANA HTTPS assignment; exposed as a parameter so an instance can
      target an alternate TLS port. R0 gates the well-formed-ClientHello
      guard on `tcp.dst == ${tls_tcp_port}`.

  local_vip:
    type: address
    notes: |
      The VIP that clients open the TLS connection to and that the switch
      fronts. In `route` mode the IPv4 destination (this VIP) is PRESERVED
      across the steering decision (only L2 + TTL change), so the selected
      backend completes the handshake from the VIP and the client accepts it.
      Anchor instances bind this to an RFC 1918 / documentation address.

# ─── Rules ──────────────────────────────────────────────────────────────────
# First-match semantics: the first rule whose `when` evaluates true on the
# incoming packet fires; subsequent rules are not evaluated for that packet.
#
# Shorthands used in the `when` clauses below:
#   is_clienthello   := header_present(tls_record) ∧ match(tcp.dst, ${tls_tcp_port})
#                       ∧ value(tls_record.content_type, ==, 22)
#                       ∧ value(tls_handshake.msg_type, ==, 1)
#   sni_well_formed  := the server_name (0x0000) extension and its first
#                       host_name(0) HostName are reachable within
#                       ${max_clienthello_prefix_bytes} prefix bytes AND
#                       ${max_extension_count} extensions, AND every declared
#                       length (record / handshake / list / name) stays within
#                       the segment, AND a host_name(0) ServerName is present
#   well_formed_ch   := is_clienthello ∧ sni_well_formed
#   name_key         := key(host_name, ${name_match_breadth},
#                           ${case_normalization}, ${name_hash_algo})

rules:

  - id: R0_non_clienthello_drop
    when: |
      ¬is_clienthello
    then:
      - drop
    notes: |
      The switch is a dedicated TLS-ClientHello SNI steerer. Anything that is
      not a TCP/${tls_tcp_port} TLS *handshake* record carrying a
      *ClientHello* (record content_type=22, handshake msg_type=1) is out of
      scope — non-TLS traffic, TLS application_data (23) / alert (21)
      records, and non-ClientHello handshake messages. Dropped. A production
      deployment composes the non-TLS forwarding path with P-IPv4Routing
      transitively rather than re-encoding it here (the scope narrowing
      P-DNSLoadBalancer and P-VXLANTunnel both use). RFC 8446 §5.1 / §4.1.2.

  - id: R1_malformed_strict_drop
    when: |
      is_clienthello
        ∧ ¬sni_well_formed
        ∧ ${malformed_handling} == strict_drop
    then:
      - drop
    notes: |
      RFC 8446 §4.1.2 + RFC 6066 §3 strict-validation path: a ClientHello
      whose server_name extension is not reachable within the bounded prefix
      (`${max_clienthello_prefix_bytes}`) and `${max_extension_count}`, whose
      declared list / name lengths run past the segment, or that carries no
      host_name(0) ServerName, is treated as malformed and dropped under
      `strict_drop`. Under `lax_default` this guard is false and the packet
      falls through to R5's default. R1 is disjoint from R2/R3/R4 (which
      require `sni_well_formed`) and is the explicit strict-mode partner of
      R5's lax catch-all. `sni_beyond_prefix_bound`, `extensions_exceed_bound`,
      and `no_sni_extension_drop` exercise it.

  - id: R2_classify_block
    when: |
      well_formed_ch
        ∧ exists(sni_policy, name_key)
        ∧ value(sni_policy.action, ==, block)
    given:
      sni_policy: by_key(name_key)
    then:
      - drop
    notes: |
      SNI-based threat blocking / denylist (RFC 6066 §3 names the SNI; the
      block policy is the D7:security half): a ClientHello whose SNI is
      installed with `action == block` is dropped before steering. Only
      reachable when `${action_breadth} ∈ {route_block, all}` (the seed
      installs no block rows otherwise). The `blocklist_drop` G3 test is the
      default-deny probe.

  - id: R3_classify_route
    when: |
      well_formed_ch
        ∧ exists(sni_policy, name_key)
        ∧ value(sni_policy.action, ==, route)
    given:
      sni_policy: by_key(name_key)
    then:
      - "set(ethernet.src, sni_policy.src_mac)"
      - "set(ethernet.dst, sni_policy.backend_mac)"
      - "dec(ipv4.ttl, 1)"                                    # L3-forward to the selected backend
      - "rewrite(ipv4.header_checksum, ipv4_checksum_recompute())"
      - forward(sni_policy.egress_port)
    notes: |
      The anchor steering action. The segment is L3-forwarded to the
      selected backend: MAC rewrite, TTL decrement, IPv4 header-checksum
      recompute. The IPv4 *destination* (the `${local_vip}`) is PRESERVED —
      the backend shares the VIP and completes the handshake with the client
      directly, so no return-path state is needed. The TLS payload (record +
      handshake + ClientHello bytes) is NOT touched — the
      `tls_payload_persistence` invariant pins the byte-for-byte round-trip.
      Implementation anti-patterns: (a) editing the TLS payload or re-emitting a
      fixed-length ClientHello stand-in
      (`conditional_deparser_clienthello_roundtrip`); (b) forgetting the
      IPv4-checksum recompute after TTL-- (`envelope_checksum_validity`);
      (c) rewriting `ipv4.dst` here (that is R4's job, and doing it in route
      mode breaks the VIP handshake-completion path).

  - id: R4_classify_rewrite
    when: |
      well_formed_ch
        ∧ exists(sni_policy, name_key)
        ∧ value(sni_policy.action, ==, rewrite)
    given:
      sni_policy: by_key(name_key)
    then:
      - "set(ipv4.dst, sni_policy.backend_ip)"                # DNAT to the specific backend IP
      - "set(ethernet.src, sni_policy.src_mac)"
      - "set(ethernet.dst, sni_policy.backend_mac)"
      - "dec(ipv4.ttl, 1)"
      - "rewrite(ipv4.header_checksum, ipv4_checksum_recompute())"
      - "rewrite(tcp.checksum, tcp_checksum_recompute())"     # TCP checksum covers the pseudo-header (incl. ipv4.dst), so it MUST recompute after DNAT
      - forward(sni_policy.egress_port)
    notes: |
      The DNAT steering action (D5.2+). The IPv4 destination is rewritten to
      a specific backend IP; because the TCP checksum covers the IPv4
      pseudo-header (which includes the destination address), the TCP
      checksum MUST be recomputed in addition to the IPv4 header checksum.
      The TLS payload is again untouched. Only reachable when
      `${action_breadth} ∈ {route_rewrite, all}`. The `checksum_after_dnat`
      G3 test catches the #1 silent failure (forgetting the TCP-checksum
      recompute over the changed pseudo-header). The return path (de-NAT of
      the backend's response) is out of scope for this stateless pattern and
      composes transitively with P-NAT44.

  - id: R5_default
    when: |
      is_clienthello
        ∧ ( ( well_formed_ch ∧ ¬exists(sni_policy, name_key) )
            ∨ ( ¬sni_well_formed ∧ ${malformed_handling} == lax_default ) )
    then:
      - "forward(${default_backend_port})"
    notes: |
      The catch-all. A well-formed ClientHello whose name_key is not
      installed, OR (under `lax_default`) a malformed record, is handled per
      `${default_action}`: under `forward_default` it is L3-forwarded to
      `${default_backend_port}` with the SAME envelope handling as R3 (MAC
      rewrite, TTL--, IPv4 checksum, VIP preserved); under `drop`
      (closed-world default-deny) the oracle drops it instead (the
      `${default_action}` knob selects which, exactly as P-IPv6Router's
      `${default_action}` selects R3_no_route's behaviour). R5 is the
      explicit partner of R1 (strict malformed drop) and the no-match
      complement of R2/R3/R4. RFC 6066 §3 unrecognized_name SHOULD: a switch
      router does not originate the alert; it defaults the steer.

# ─── Invariants (six canonical clauses) ─────────────────────────────────────

invariants:

  - id: no_loop
    clause: no_loop
    target: any_packet
    notes: |
      No packet recirculates indefinitely. The bounded TLS-record walk
      terminates in at most `${max_clienthello_prefix_bytes}` prefix bytes
      and `${max_extension_count}` extension steps (at the server_name
      extension, at a bound, or at `error.StackOutOfBounds`), and every rule
      is a single-pass forward or drop. No recirculation. This invariant pins
      the bounded-loop requirement: an extension-walk `select` loop without a
      depth guard would not terminate on a crafted unterminated extension
      list — the common v1model / parser-edge-case `StackOutOfBounds` boundary
      `extensions_exceed_bound` probes.

  - id: classification_determinism
    clause: stability
    target: "(forward_decision, sni_policy.egress_port)"
    while: "well_formed_ch ∧ (R2 ∨ R3 ∨ R4) fires"
    notes: |
      Stable steering: two well-formed ClientHellos with the same derived
      `name_key` (same HostName under `${name_match_breadth}` /
      `${case_normalization}`) always produce the same action and the same
      backend. The router does not flap a name between backends
      packet-to-packet — SNI affinity. Implementation anti-pattern: keying on a hash
      that includes a per-packet-varying field (e.g. the TCP sequence number,
      the ClientHello random, or the source port) instead of only the
      HostName — splits one logical name across backends.

  - id: tls_payload_persistence
    clause: persistence
    target: "(tls_record, tls_handshake, client_hello, tls_payload)"
    while: "(R3 ∨ R4 ∨ R5-forward) fires"
    free_under: []
    notes: |
      THE headline invariant. On every steered (non-dropped) ClientHello the
      TLS message — the record header, the handshake header, the full
      variable-length ClientHello (legacy_version, random, session-id,
      cipher_suites, compression_methods, the entire extensions block
      including server_name), and any trailing bytes — is delivered to the
      backend BYTE-FOR-BYTE identical to what arrived; the switch edits only
      the L2/L3/L4 envelope (Ethernet, IPv4, TCP-checksum). This is the
      parse-then-deparse round-trip correctness the whole pattern turns on: a
      implementation that parses the ClientHello into sub-headers but re-emits them in
      the wrong order, drops the SNI extension, pads to a fixed width, or
      omits the variable-length tail corrupts the handshake even though
      forwarding "works". `conditional_deparser_clienthello_roundtrip` and
      `clienthello_payload_preserved` enumerate it.

  - id: envelope_checksum_validity
    clause: stability
    target: "(ipv4.header_checksum, tcp.checksum)"
    while: "(R3 ∨ R4 ∨ R5-forward) fires ∧ egress(packet)"
    notes: |
      Every steered ClientHello carries a valid IPv4 header checksum on
      egress (recomputed after the TTL decrement) and, when R4 rewrote
      `ipv4.dst`, a valid TCP checksum (recomputed over the changed
      pseudo-header). The #1 silent failure per the common v1model cross-cutting
      taxonomy: omitting `update_checksum` after a field edit makes BMv2 emit
      a stale checksum the backend's NIC / kernel silently drops.
      `checksum_after_dnat` catches the TCP half; the IPv4 half is pinned on
      every forwarding rule.

  - id: parser_depth_safety
    clause: stability
    target: forward_decision
    while: "is_clienthello ∧ ¬sni_well_formed"
    notes: |
      A ClientHello whose server_name is beyond the
      `${max_clienthello_prefix_bytes}` / `${max_extension_count}` bound, that
      carries no server_name extension, or whose declared lengths overflow,
      produces a DETERMINISTIC decision — `strict_drop` drops, `lax_default`
      steers to the default — and NEVER reads a HostName / extension field
      past the parse bound (which would be an unspecified-value read per
      P4-16 §8.25 / the bug-taxonomy "read from invalid header"). Pins that
      the bounded walk degrades gracefully rather than classifying on
      garbage. `sni_beyond_prefix_bound`, `extensions_exceed_bound`, and
      `read_invalid_sni_field_guard` witness it.

# ─── Test scaffolding ───────────────────────────────────────────────────────
# Materialised into task.yaml::test_cases at instantiation. Scapy ships NO native bounded ClientHello/SNI layer the verifier
# can build, so instances REQUIRE a TLS `custom_headers.py` (see
# bridging_notes) defining the record / handshake / ClientHello-prefix /
# extension / server_name layers used by both the packet builder and the
# transformation assertions.

test_scaffolding:

  G1:
    - id: sni_route_basic
      generate: |
        Send a TCP/${tls_tcp_port} segment carrying a TLS ClientHello
        (record content_type=22, handshake msg_type=1) whose first
        host_name(0) SNI is installed with action=route → egress_port=P,
        backend_mac=MB, src_mac=MS. Assert the egress packet on P is the same
        segment with ethernet.src=MS, ethernet.dst=MB, ipv4.ttl decremented
        by 1, ipv4.dst UNCHANGED (== ${local_vip}, VIP preserved), a valid
        recomputed IPv4 checksum, and the TLS payload (record + handshake +
        full ClientHello including the server_name extension) byte-for-byte
        identical. (Anchor — the golden steering path, G1-P1-T1 / G1-P1-T3.)

    - id: sni_classify_two_names
      generate: |
        Install two SNI policies mapping to two different backends (e.g.
        `api.example.com`→P2, `cdn.example.net`→P3) under the configured
        `${name_match_breadth}`. Send one ClientHello for each SNI. Assert
        each is steered to its own backend port. Confirms the classifier
        actually keys on the parsed SNI, not a constant. (G1-P1-T1
        per-forwarding-path coverage.)

    - id: clienthello_payload_preserved
      generate: |
        Send a route-classified ClientHello whose SNI sits behind a realistic
        (but within-bound) prefix: a non-empty legacy_session_id, several
        cipher_suites, and ≥2 extensions before server_name. Parse the egress
        packet's TLS section and assert the record header, handshake header,
        ClientHello prefix, every list, and the entire extensions block
        (including server_name) are byte-for-byte identical to the input — no
        reordering, no dropped extension, no fixed-width padding. (Pins the
        `tls_payload_persistence` invariant; the parse-then-deparse round-trip
        is the pattern's load-bearing surface.)

    - id: sni_rewrite_dnat
      requires: "${action_breadth} ∈ {route_rewrite, all}"
      generate: |
        Send a ClientHello whose SNI is installed with action=rewrite →
        backend_ip=BIP. Assert the egress packet has ipv4.dst=BIP, a valid
        recomputed IPv4 header checksum, a valid recomputed TCP checksum (the
        pseudo-header changed), MAC rewrite, TTL--, and the TLS payload
        byte-for-byte preserved. (R4 path; G1-P1-T3 + G1-P1-T5 transformation
        assertions.)

    - id: sni_suffix_match
      requires: "${name_match_breadth} == suffix_2label"
      generate: |
        Install a registrable-suffix policy `example.com`→P2 and send a
        ClientHello with SNI `api.example.com`; assert it steers to P2 (the
        suffix match locates the last two labels in the variable-length
        name). Then send `example.org` and assert it does NOT match that row.
        (G1-P1-T2 protocol-branch coverage; RFC 6066 §3 hostname.)

  G2:
    - id: sni_at_prefix_bound
      generate: |
        Send a route-classified ClientHello whose server_name extension ends
        EXACTLY at the `${max_clienthello_prefix_bytes}` /
        `${max_extension_count}` bound (maximally-padded session-id /
        cipher-suite lists, SNI in the last admissible extension). Assert it
        still classifies and steers correctly (boundary accept). The
        off-by-one partner of `sni_beyond_prefix_bound`. (Parser-boundary;
        "Full stack — exactly N headers".)

    - id: sni_beyond_prefix_bound
      generate: |
        Send a ClientHello whose server_name extension sits JUST PAST the
        bound (one extra padded extension / over-long list). Assert: drop
        under `${malformed_handling} == strict_drop`, or forward to
        `${default_backend_port}` (or drop) per `${default_action}` under
        `lax_default`. The decision MUST be deterministic and MUST NOT depend
        on bytes past the parse bound. (The `StackOutOfBounds` / parser-depth
        boundary; pins `parser_depth_safety`.)

    - id: extensions_exceed_bound
      generate: |
        Send a ClientHello with MORE than `${max_extension_count}` extensions
        before (or without) the server_name extension. Assert the bounded
        extension walk terminates at the count bound and the NF takes the
        deterministic malformed decision rather than reading a phantom
        extension. (Extension-stack `StackOutOfBounds`;
        "nextIndex at size boundary".)

    - id: non_hostname_nametype_default
      generate: |
        Send a ClientHello whose server_name extension's first ServerName has
        a NameType that is NOT host_name(0). Assert the NF does not key on it
        as a hostname — it falls to `${default_action}` (no host_name(0)
        entry ⇒ ¬sni_well_formed under strict, or no name_key match under
        lax). (RFC 6066 §3 NameType boundary.)

    - id: short_record_truncated_clienthello
      generate: |
        Send a TCP/${tls_tcp_port} segment whose TLS record declares a length
        (or a list/name length inside the ClientHello) that runs PAST the
        captured segment end. Assert the parser rejects / the NF drops rather
        than reading past the buffer (`error.PacketTooShort`). (G2
        malformed-input; "Short packet".)

  G3:
    - id: blocklist_drop
      requires: "${action_breadth} ∈ {route_block, all}"
      generate: |
        Install an SNI policy with action=block (a threat / denylisted
        domain). Send a well-formed ClientHello for it. Assert drop — before
        any steering. Then send a ClientHello for a non-blocked,
        route-classified SNI and assert it still forwards (the block is
        name-scoped, not a blanket deny). (SNI threat-blocking default-deny,
        R2; G3 bypass/security; RFC 6066 §3.)

    - id: non_handshake_record_dropped
      generate: |
        Send a TCP/${tls_tcp_port} segment whose TLS record content_type is
        application_data (23) or alert (21) — NOT handshake (22). Assert it is
        NOT steered as a ClientHello (drop at R0). Catches an implementation that gates
        only on `tcp.dst == 443` and forgets the record content_type /
        handshake msg_type, mis-steering mid-connection records. (RFC 8446
        §5.1 / §4.1.2; bypass probe.)

    - id: conditional_deparser_clienthello_roundtrip
      generate: |
        Send a route-classified ClientHello with a distinctive multi-extension
        layout (server_name NOT first). Assert the egress packet's byte layout
        is exactly Ether/IPv4/TCP/TLS-record/handshake/ClientHello-prefix/
        lists/extensions(in order)/… with the ClientHello bytes identical to
        the input, AND that NO parsed sub-header is emitted out of order,
        duplicated, or dropped. Catches the common v1model conditional-deparser bug
        where the deparser emits the parsed sub-headers unconditionally / in
        the wrong sequence rather than guarded by `isValid()` in order — the
        dominant silent failure for variable-length parse tasks.

    - id: checksum_after_dnat
      requires: "${action_breadth} ∈ {route_rewrite, all}"
      generate: |
        Same setup as `sni_rewrite_dnat`. After R4 rewrites ipv4.dst,
        recompute BOTH the IPv4 header checksum (over the 20-byte header) and
        the TCP checksum (over the pseudo-header + TCP header + payload) from
        the egress bytes and assert both match. Catches the implementation that
        recomputes the IPv4 checksum but forgets the TCP checksum covers the
        changed pseudo-header — the #1 silent failure per the common v1model
        cross-cutting taxonomy.

    - id: read_invalid_sni_field_guard
      generate: |
        Send (a) a non-TLS TCP segment on a non-${tls_tcp_port} port and (b)
        a TCP/${tls_tcp_port} ClientHello that carries NO server_name
        extension at all. Assert the NF does not classify on or forward based
        on unspecified HostName bytes — (a) is out of scope (R0 drop) and (b)
        is ¬sni_well_formed (handled per `${malformed_handling}`: strict drop
        or lax default, NEVER a steer on garbage SNI bytes). Catches an implementation
        that reads the HostName without guarding extension presence (P4-16
        §8.25 unspecified-value read; G1-P2-T9 analog).

    - id: no_sni_extension_drop
      requires: "${malformed_handling} == strict_drop"
      generate: |
        Send a well-formed ClientHello (within all bounds) that simply omits
        the server_name extension. Assert drop under `strict_drop` (R1).
        Distinguishes "SNI absent" from "SNI present but unmatched" (the
        latter is R5's job): an implementation that conflates the two mis-handles the
        no-SNI case. (RFC 6066 §3 optional-extension boundary.)

  coverage_floor:
    G1: 3
    G2: 1
    G3: 1

# ─── Mutation operators ─────────────────────────────────────────────────────
# Twelve harden operators paired with twelve ease counterparts; every
# operator declares `direction` so difficulty recalibration
# can pick from the matching pool depending on whether r > r* + δ (harden)
# or r < r* − δ (ease). Every harden has an ease counterpart on the SAME axis.

mutation_operators:

  - id: deepen_prefix_bound
    applicable_when: "${max_clienthello_prefix_bytes} < 512"
    effect: "${max_clienthello_prefix_bytes} ← min(${max_clienthello_prefix_bytes} * 2, 512)"
    axis: capacity
    direction: harden
    feasibility_postcondition: "${max_clienthello_prefix_bytes} ≤ 512 ∧ ${max_clienthello_prefix_bytes} ≥ 64"
    kind: parameter
    notes: |
      Raise the ClientHello-prefix byte budget — more variable-length list
      bytes the parser must walk before the extensions block, more `extract`
      states to unroll correctly and more off-by-one risk. The prefix budget
      is a structural memory bound, so this moves the `capacity` axis (the
      specific resource is parser prefix depth). Activates deeper
      `sni_at_prefix_bound` / `sni_beyond_prefix_bound` boundaries.

  - id: shallow_prefix_bound
    applicable_when: "${max_clienthello_prefix_bytes} > 64"
    effect: "${max_clienthello_prefix_bytes} ← max(${max_clienthello_prefix_bytes} / 2, 64)"
    axis: capacity
    direction: ease
    feasibility_postcondition: "${max_clienthello_prefix_bytes} ≥ 64 ∧ ${max_clienthello_prefix_bytes} ≤ 512"
    kind: parameter
    notes: |
      Paired ease counterpart of `deepen_prefix_bound`. Halves the prefix
      budget so the SUT walks fewer list bytes before the extensions block.

  - id: deepen_extension_bound
    applicable_when: "${max_extension_count} < 16"
    effect: "${max_extension_count} ← min(${max_extension_count} * 2, 16)"
    axis: capacity
    direction: harden
    feasibility_postcondition: "${max_extension_count} ≤ 16 ∧ ${max_extension_count} ≥ 2"
    kind: parameter
    notes: |
      Raise the extension-walk depth bound — more extension sub-states to
      unroll correctly before reaching server_name, raising the off-by-one /
      `StackOutOfBounds` risk on the bounded walk. capacity axis (the
      parser-depth resource, disjoint from the prefix-byte resource above, so
      it carries its own harden/ease pair — the same disjoint-resource
      precedent P-DNSLoadBalancer sets with `deepen_parse_bound` vs
      `shrink_class_capacity_4x`). Activates deeper `extensions_exceed_bound`.

  - id: shallow_extension_bound
    applicable_when: "${max_extension_count} > 2"
    effect: "${max_extension_count} ← max(${max_extension_count} / 2, 2)"
    axis: capacity
    direction: ease
    feasibility_postcondition: "${max_extension_count} ≥ 2 ∧ ${max_extension_count} ≤ 16"
    kind: parameter
    notes: |
      Paired ease counterpart of `deepen_extension_bound`.

  - id: broaden_name_match
    applicable_when: "${name_match_breadth} ∈ {exact_host, suffix_2label}"
    effect: "${name_match_breadth} ← next_breadth(${name_match_breadth})"   # exact_host → suffix_2label → hashed_full
    axis: feature-breadth
    direction: harden
    feasibility_postcondition: "${name_match_breadth} ∈ {suffix_2label, hashed_full}"
    kind: parameter
    notes: |
      Widen the classification key from the exact host to the registrable
      two-label suffix to the hashed full HostName — each step requires
      parsing and keying more of the variable-length name correctly. The
      hashed_full step also activates the `${name_hash_algo}` surface.
      feature-breadth axis.

  - id: narrow_name_match
    applicable_when: "${name_match_breadth} ∈ {suffix_2label, hashed_full}"
    effect: "${name_match_breadth} ← prev_breadth(${name_match_breadth})"
    axis: feature-breadth
    direction: ease
    feasibility_postcondition: "${name_match_breadth} ∈ {exact_host, suffix_2label}"
    kind: parameter
    notes: |
      Paired ease counterpart of `broaden_name_match`.

  - id: broaden_action
    applicable_when: "${action_breadth} ∈ {route_only, route_block, route_rewrite}"
    effect: "${action_breadth} ← next_action_breadth(${action_breadth})"   # route_only → {route_block | route_rewrite} → all
    axis: feature-breadth
    direction: harden
    feasibility_postcondition: "${action_breadth} ∈ {route_block, route_rewrite, all}"
    kind: parameter
    notes: |
      Add reachable steering actions: route_block activates R2 (the SNI
      denylist drop and `blocklist_drop`), route_rewrite activates R4 (the
      DNAT action and its TCP-checksum surface via `checksum_after_dnat`),
      and `all` enables both. feature-breadth axis.

  - id: narrow_action
    applicable_when: "${action_breadth} ∈ {route_block, route_rewrite, all}"
    effect: "${action_breadth} ← prev_action_breadth(${action_breadth})"
    axis: feature-breadth
    direction: ease
    feasibility_postcondition: "${action_breadth} ∈ {route_only, route_block, route_rewrite}"
    kind: parameter
    notes: |
      Paired ease counterpart of `broaden_action`. Removes the
      most-recently-added action and skips its `requires:`-guarded tests.

  - id: strict_malformed_handling
    applicable_when: "${malformed_handling} == lax_default"
    effect: "${malformed_handling} ← strict_drop"
    axis: strictness
    direction: harden
    feasibility_postcondition: "${malformed_handling} == strict_drop"
    kind: parameter
    notes: |
      Activate R1 and the malformed G2/G3 cases (`sni_beyond_prefix_bound`
      strict branch, `extensions_exceed_bound`, `no_sni_extension_drop`).
      Catches implementations that classify on a partially-parsed / over-long
      ClientHello instead of rejecting it. strictness axis.

  - id: lax_malformed_handling
    applicable_when: "${malformed_handling} == strict_drop"
    effect: "${malformed_handling} ← lax_default"
    axis: strictness
    direction: ease
    feasibility_postcondition: "${malformed_handling} == lax_default"
    kind: parameter
    notes: |
      Paired ease counterpart of `strict_malformed_handling`. R1 is gated
      off; malformed records fall to R5's default and the strict-mode
      malformed tests are skipped.

  - id: enable_case_insensitive_match
    applicable_when: "${case_normalization} == false"
    effect: "${case_normalization} ← true"
    axis: faithfulness
    direction: harden
    feasibility_postcondition: "${case_normalization} == true"
    kind: parameter
    notes: |
      Enforce RFC 6066 §3's case-insensitive HostName comparison: the SUT
      must case-fold each HostName byte before deriving the key. Catches the
      implementation that keys on raw bytes and mis-classifies `Example.COM`.
      faithfulness axis (fidelity of the name-comparison semantics).

  - id: disable_case_insensitive_match
    applicable_when: "${case_normalization} == true"
    effect: "${case_normalization} ← false"
    axis: faithfulness
    direction: ease
    feasibility_postcondition: "${case_normalization} == false"
    kind: parameter
    notes: |
      Paired ease counterpart of `enable_case_insensitive_match`. Reverts to
      byte-exact HostName comparison.

  - id: swap_hash_to_xor_fold
    applicable_when: "${name_match_breadth} == hashed_full ∧ ${name_hash_algo} ∈ {crc16, crc32}"
    effect: "${name_hash_algo} ← xor_fold"
    axis: hash-family
    direction: harden
    feasibility_postcondition: "${name_hash_algo} == xor_fold"
    kind: parameter
    notes: |
      Weaken the full-HostName key hash. Under an adversarial name workload
      the xor_fold output collapses distinct names into one key, so an implementation
      that copies the textbook CRC pattern without weighing hash quality
      mis-classifies colliding names. hash-family axis.

  - id: swap_hash_to_crc32
    applicable_when: "${name_match_breadth} == hashed_full ∧ ${name_hash_algo} ∈ {xor_fold, crc16}"
    effect: "${name_hash_algo} ← crc32"
    axis: hash-family
    direction: ease
    feasibility_postcondition: "${name_hash_algo} == crc32"
    kind: parameter
    notes: |
      Paired ease counterpart of `swap_hash_to_xor_fold`. CRC32 gives the
      strongest entropy of the three options and minimises full-name key
      collisions.

  - id: raise_workload_skew
    applicable_when: "${workload_skew} ∈ {uniform, zipfian}"
    effect: "${workload_skew} ← next_skew(${workload_skew})"               # uniform → zipfian → adversarial
    axis: workload
    direction: harden
    feasibility_postcondition: "${workload_skew} ∈ {zipfian, adversarial}"
    kind: parameter
    notes: |
      Raise the SNI-name distribution skew. `adversarial` mixes ClientHellos
      whose SNI sits exactly at the prefix / extension bounds with
      collision-prone names — combined with a weak `${name_hash_algo}` this
      drives the classifier toward mis-steering. workload axis.

  - id: lower_workload_skew
    applicable_when: "${workload_skew} ∈ {zipfian, adversarial}"
    effect: "${workload_skew} ← prev_skew(${workload_skew})"
    axis: workload
    direction: ease
    feasibility_postcondition: "${workload_skew} ∈ {uniform, zipfian}"
    kind: parameter
    notes: |
      Paired ease counterpart of `raise_workload_skew`.

  - id: shrink_policy_capacity_4x
    applicable_when: "${sni_policy_capacity} ≠ unbounded ∧ ${sni_policy_capacity} > 32"
    effect: "${sni_policy_capacity} ← ${sni_policy_capacity} / 4"
    axis: capacity
    direction: harden
    feasibility_postcondition: "${sni_policy_capacity} ≥ 8"
    kind: parameter
    notes: |
      Tighten the SNI-classification-table capacity. The implementation cannot rely
      on a row-per-name TCAM and must consider key aggregation (suffix /
      hashed keys). capacity axis (the table-row resource, disjoint from the
      two parser-depth resources above; each carries its own harden/ease
      pair).

  - id: enlarge_policy_capacity_2x
    applicable_when: "${sni_policy_capacity} ≠ unbounded ∧ ${sni_policy_capacity} < 1048576"
    effect: "${sni_policy_capacity} ← ${sni_policy_capacity} * 2"
    axis: capacity
    direction: ease
    feasibility_postcondition: "${sni_policy_capacity} ≤ 1048576"
    kind: parameter
    notes: |
      Paired ease counterpart of `shrink_policy_capacity_4x`. Doubles (not
      quadruples) for a slow climb back after an over-shrink.

  - id: tighten_faithfulness
    applicable_when: |
      ${faithfulness} ∈ {D5.0_anchor_route, D5.1_full_classify, D5.2_rewrite_dnat}
    effect: |
      ${faithfulness} ← next_band(${faithfulness}) ∧
      ( if ${faithfulness}_post == D5.1_full_classify then
          ${malformed_handling} ← strict_drop ∧
          ${name_match_breadth} ← suffix_2label ∧
          ${case_normalization} ← true ∧
          ${max_extension_count} ← max(${max_extension_count}, 8) ) ∧
      ( if ${faithfulness}_post == D5.2_rewrite_dnat then
          ${action_breadth} ← route_rewrite ) ∧
      ( if ${faithfulness}_post == D5.3_threat_block_strict then
          ${action_breadth} ← all ∧
          ${name_match_breadth} ← hashed_full ∧
          ${workload_skew} ← adversarial ∧
          ${default_action} ← drop )
    axis: feature-breadth
    direction: harden
    feasibility_postcondition: |
      ${faithfulness} ≠ D5.0_anchor_route ∧
      ( ${faithfulness} ≠ D5.2_rewrite_dnat
        ∨ ∃ entry ∈ ${sni_policy_entries}: entry.action == rewrite ) ∧
      ( ${faithfulness} ≠ D5.3_threat_block_strict
        ∨ ∃ entry ∈ ${sni_policy_entries}: entry.action == block )
    kind: parameter
    notes: |
      Lift the faithfulness ladder one rung. D5.0 → D5.1 turns on the full
      validation cascade (strict malformed drop, registrable suffix match,
      case-insensitive compare, deeper extension walk). D5.1 → D5.2 adds the
      rewrite/DNAT action. D5.2 → D5.3 adds SNI denylist blocking, hashed
      full-name match, the adversarial workload, and a closed-world default.
      Couples several knobs in one step, so its `feasibility_postcondition`
      requires the rewrite/block rows to exist before the rungs that need
      them.

  - id: loosen_faithfulness
    applicable_when: |
      ${faithfulness} ∈ {D5.1_full_classify, D5.2_rewrite_dnat, D5.3_threat_block_strict}
    effect: |
      ${faithfulness} ← prev_band(${faithfulness}) ∧
      ( if ${faithfulness}_post == D5.0_anchor_route then
          ${malformed_handling} ← lax_default ∧
          ${name_match_breadth} ← exact_host ∧
          ${case_normalization} ← false ∧
          ${action_breadth} ← route_only ∧
          ${default_action} ← forward_default ) ∧
      ( if ${faithfulness}_post == D5.1_full_classify then
          ${action_breadth} ← route_only ) ∧
      ( if ${faithfulness}_post == D5.2_rewrite_dnat then
          ${action_breadth} ← route_rewrite ∧
          ${name_match_breadth} ← suffix_2label ∧
          ${workload_skew} ← uniform ∧
          ${default_action} ← forward_default )
    axis: feature-breadth
    direction: ease
    feasibility_postcondition: |
      ${faithfulness} ≠ D5.3_threat_block_strict
    kind: parameter
    notes: |
      Paired ease counterpart of `tighten_faithfulness`. Steps the ladder
      back one rung and reverts the entailed parameter bindings.

  - id: ladder_input_form_to_python_ref
    applicable_when: "'python_reference_impl' ∉ task.description"
    effect: |
      Append the Python oracle source to task.description so the SUT sees a
      host-side reference implementation in addition to the behavioural spec
      — the heaviest difficulty lever.
    axis: input-form
    direction: ease
    feasibility_postcondition: "'python_reference_impl' ∈ task.description"
    kind: rule
    notes: |
      Starter-library operator — laddering the input form from
      behavioural spec to host-side reference EASES the SUT's job (it has a
      Python TLS-record walk to transliterate rather than design from
      scratch). Used sparingly; pairs with the harden revert below.

  - id: revert_input_form_to_behavioural
    applicable_when: "'python_reference_impl' ∈ task.description"
    effect: "Strip the appended Python oracle source from task.description, leaving only the behavioural spec."
    axis: input-form
    direction: harden
    feasibility_postcondition: "'python_reference_impl' ∉ task.description"
    kind: rule
    notes: |
      Paired harden counterpart of `ladder_input_form_to_python_ref`. The SUT
      must design the bounded TLS-record walk from RFC 6066 / RFC 8446 alone.

# ─── Bridging notes (advisory; not LLM-visible) ─────────────────────────────

bridging_notes: |
  Common implementations from this pattern to v1model P4 (every entry below is
  `[common-knowledge baseline]` rather than RFC-cited):

  PARSING FEASIBILITY — the genuinely hard / risky part (state clearly):
    TLS ClientHello is VARIABLE-LENGTH and the SNI sits behind THREE
    variable-length, length-prefixed lists (legacy_session_id, cipher_suites,
    legacy_compression_methods) and then a variable-length extension list, in
    which server_name is one extension among many (RFC 8446 §4.1.2, RFC 6066
    §3). v1model parsers handle this POORLY: there is no unbounded loop, no
    dynamic offset arithmetic into a flat payload, and `extract` widths must
    be parse-time computable. To make the NF GRADABLE as "egress port / drop
    as a function of the (bounded) SNI bytes", the pattern is constrained to a
    BOUNDED ClientHello layout:
      - fixed maximum prefix budget `${max_clienthello_prefix_bytes}` for the
        three middle lists (the parser `extract`s each list's 1- or 2-octet
        length then a variable-width `extract` of that many bytes, but only up
        to the budget — past it the ClientHello is `¬sni_well_formed`);
      - a capped `${max_extension_count}` extension walk (an unrolled chain of
        `parse_ext_0 … parse_ext_K` states, or a
        `header_stack tls_ext_t[${max_extension_count}]` walked with `hs.next`
        and a loop-back `select` on extension_type, terminating on the
        server_name type 0x0000, on the count bound, or on
        `error.StackOutOfBounds`);
      - the SNI within that bounded prefix; the first host_name(0) ServerName
        only.
    A `custom_headers.py` is REQUIRED at instantiation: Scapy ships no native
    bounded-ClientHello/SNI layer the verifier's packet builder can construct
    (the verifier only builds the layers a custom_headers.py declares). The custom_headers.py defines the TLS
    record header, handshake header, ClientHello fixed prefix, the
    length-prefixed list shims, the extension shim, and the server_name /
    ServerNameList / HostName layers, so both the packet builder and the
    transformation assertions can address `layers[N].HostName` etc.

  Anchor (D5.0_anchor_route, name_match_breadth = exact_host,
               malformed_handling = lax_default, case_normalization = false,
               action_breadth = route_only, default_action = forward_default):
    - Parser: state_start → parse_ethernet → (etherType == 0x0800 ?
      parse_ipv4 : accept) → (ipv4.protocol == 6 ? parse_tcp : accept) →
      (tcp.dst == 443 ? parse_tls_record : accept) →
      (record.content_type == 22 ? parse_handshake : accept) →
      (handshake.msg_type == 1 ? parse_clienthello_prefix : accept) →
      walk the three length-prefixed lists within the byte budget →
      walk the extension list to server_name within the count bound →
      parse_server_name → extract HostName (bounded length).
    - One control-plane table: sni_class_table, exact (or, at hashed_full,
      exact on the hashed key) on the derived name_key, action set
      {route, rewrite, block, default}. Key derivation is an action/ALU step
      that copies / hashes the parsed HostName bytes into a fixed-width field
      BEFORE the table apply.
    - Route action: ethernet MAC rewrite + ipv4.ttl-- + update_checksum on
      ipv4. ipv4.dst is NOT touched (VIP preserve). The TLS sub-headers are
      left valid and untouched so the deparser re-emits them verbatim.
    - Deparser: emit ethernet, ipv4, tcp, then EVERY TLS sub-header in parse
      order (record, handshake, prefix, lists, extensions incl. server_name).
      The variable-length emit is the load-bearing conditional-deparser
      surface.

  D5.1 (full validation): adds the strict-flag/malformed cascade (reject when
  server_name is not reached within the prefix-byte / extension-count bounds,
  when a declared length runs past the segment, or when no host_name(0)
  ServerName is present), the case-fold of each HostName byte (OR with 0x20
  for ASCII letters before keying — RFC 6066 §3 case-insensitivity), the
  registrable-two-label-suffix key derivation, and a deeper extension walk.

  D5.2 (rewrite/DNAT): the rewrite action sets ipv4.dst = backend_ip and adds
  update_checksum for BOTH ipv4 (header) and tcp (the TCP checksum covers the
  IPv4 pseudo-header, so it MUST recompute over the changed destination — the
  canonical silent miss).

  D5.3 (SNI denylist + hashed full match): a block action that
  `mark_to_drop(standard_metadata)`s before egress; the hashed-full key is
  `hash(key, HashAlgorithm.crc32, 0, {parsed_hostname_bytes}, width)`; the
  adversarial workload stresses the hash and the parse bounds together;
  default_action = drop closes the world.

  Anti-pattern implementations to reject during reference review:
    * Re-emitting a FIXED-LENGTH ClientHello / SNI stand-in instead of the
      variable-length parsed sub-headers — corrupts the handshake even though
      forwarding "works". The #1 silent failure for variable-length parse
      tasks. `conditional_deparser_clienthello_roundtrip` +
      `tls_payload_persistence` catch it.
    * Forgetting `update_checksum` for ipv4 after ttl-- (route) or for tcp
      after the ipv4.dst DNAT (rewrite). `checksum_after_dnat` and the
      `envelope_checksum_validity` invariant catch it.
    * An unbounded / unguarded extension-walk `select` loop that does not
      terminate on a crafted unterminated extension list. The bounded
      `${max_extension_count}` + `parser_depth_safety` invariant +
      `extensions_exceed_bound` pin the depth guard.
    * Gating only on `tcp.dst == 443` and forgetting the record content_type /
      handshake msg_type — steers mid-connection application_data / alert
      records as if they were ClientHellos. `non_handshake_record_dropped`
      catches it.
    * Keying on raw HostName bytes when case-insensitivity is required —
      mis-classifies `Example.COM`. `enable_case_insensitive_match` + a
      mixed-case test catch it.
    * Rewriting ipv4.dst in ROUTE mode (conflating R3 with R4) — breaks the
      VIP handshake-completion path. The route test asserts ipv4.dst is
      unchanged.

  v2-deferred (out of scope for this pattern, noted for reviewers):
    * Full variable-length TLS parsing — unbounded session-id / cipher-suite /
      extension lists with no byte/count budget — is unexpressible on a
      bounded match-action parser and is the explicit v2-deferred boundary
      (the pattern restricts scope to the bounded-prefix subset rather
      than inventing an unbounded-parse primitive).
    * TLS record FRAGMENTATION — a ClientHello split across multiple TCP
      segments / TLS records — needs reassembly state (a `connection`/`window`
      entity) and is stateful; deferred. This pattern assumes the ClientHello
      arrives in one segment within the byte budget.
    * Encrypted ClientHello (ECH) / ESNI — the SNI is no longer clear-text, so
      data-plane inspection is impossible without keys; out of scope by
      construction.
    * The handshake-completion / return path is left to the selected backend
      (route, VIP-preserving) or composes transitively with P-NAT44 (rewrite);
      this pattern is the ClientHello-inspection / steering half only.

post_instantiation_hooks: |
  After instantiation, validate the instance and
  hand-run the public tests through the oracle for the seed. Instances MUST
  ship a TLS `custom_headers.py` (record / handshake / ClientHello-prefix /
  extension / server_name layers); the verifier builds only the layers it
  declares.
