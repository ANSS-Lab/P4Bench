# P-DecisionTreeInfer — in-switch decision-tree / random-forest inference
#
# TPL v1.0 task pattern. Fills the
# (D3:ml-inference × P11:ml-inference) cell of the NF-category
# design-space map — the ML-inference row, one of the five `relocate`
# prescriptive categories. The two halves of the cross-axis "ml-inference"
# name collision (descriptive D3 / prescriptive P11) are disambiguated by
# the descriptive/prescriptive keys.
#
# target_capability = relocate: model inference has historically lived on
# hosts / collectors / control-plane analytics; the data plane is now able
# to *receive* an already-trained model and classify at line rate. The
# relocate frontier's structural failure mode shows up here
# in its purest ML form: there is no fixed-function ASIC precedent for "run
# a decision tree", so the SUT must REDESIGN a host-side `if x < t` tree
# walk into a loop-free, stage-bounded match-action encoding — the
# encode-based feature-table → decision-table mapping (IIsy / Planter) —
# with no prior data-plane design to copy. Unlike P-DNSLoadBalancer (which
# stresses the variable-length PARSE), this pattern stresses the
# match-action ENCODING of arithmetic comparisons: range/ternary feature
# tables whose split boundaries must reproduce the trained model's
# tie-break exactly, and (for forests) a vote-aggregation stage.
#
# Grounded in the IIsy / "Automating In-Network Machine Learning"
# encode-based design (arXiv:2205.08824, incl. the Planter
# ternary-feature-table + most-common-label-default refinement it
# describes), the in-network ML-inference NF lineage, and the BoS
# (NSDI '24) target-venue framing. Instances are produced by binding the
# parameters below.

pattern_id: P-DecisionTreeInfer
version: "1.0"

nf_categories:                                                # NF-category tags (ID:name pairs)
  descriptive:  [D3:ml-inference]                             # D3 family "ML inference" — decision trees / random forests run in-pipeline
  prescriptive: [P11:ml-inference]                            # P11 "ML inference" — model inference in match-action pipeline; `relocate` row in Table 1

target_capability: relocate                                   # trained-model inference relocated from host / collector analytics down into the switch pipeline

summary: >
  An in-switch decision-tree / random-forest classifier. For each
  classifiable packet (one carrying the required feature headers) the
  switch reads a configured set of `${feature_count}` header-derived
  feature fields, quantises each to `${feature_bit_width}` bits, and
  evaluates a pre-trained model installed by the control plane. The model
  is mapped onto match-action via the IIsy / Planter ENCODE-BASED scheme:
  one range/ternary *feature table* per feature slices that feature's
  value space into the split intervals the trained tree uses (producing a
  small per-feature *code*); a *decision (code) table* exact-matches the
  composed code tuple to a leaf class, with its table default action
  storing the most-common label so an unmatched code tuple falls to
  `${default_class}`. For an ensemble (`${ensemble_size} > 1`, a random
  forest) each tree contributes a per-tree code/vote and a final
  aggregation stage (`${vote_aggregation}`: majority / weighted / sum-
  threshold) selects the class. The predicted leaf class drives
  forwarding through a control-plane `class_action_map`: *forward* (steer
  the packet to the class's egress port), *drop* (the anomaly / malicious
  class), or *mark* (stamp the predicted class id into the IPv4 DSCP/
  diffserv field for a downstream consumer, recomputing the IPv4
  checksum). A packet missing a required feature header is handled per
  `${unclassified_action}`. The pattern is STATELESS — every verdict
  derives from the current packet's header-derived features and the
  control-plane-installed model — which is what bounds the oracle cost and
  keeps the inference a pure function (the headline `inference_determinism`
  invariant). Its difficulty lives in the encode-based redesign: the
  split-boundary tie-break must match the model exactly (the
  `boundary_classification_fidelity` invariant — the #1 silent
  misclassification), the bounded evaluation must terminate in a fixed
  number of stages regardless of tree depth, the packet payload must
  round-trip unmodified, and the IPv4 checksum must be recomputed after a
  DSCP mark. Faithfulness anchors at D5.0 (a single shallow tree, two
  features, forward-only, exact coarse quantisation, uniform workload) and
  ladders through D5.1 (deeper single tree, more features, +drop class,
  strict boundary fidelity), D5.2 (random forest + vote aggregation +
  mark action), and D5.3 (full feature set, deep forest, tight model
  capacity, adversarial on-boundary feature workload).

# ─── Network-knowledge grounding ────────────────────────────────────────────

grounding:

  papers:
    - cite: iisy_automating_innetwork_ml
      title: "Automating In-Network Machine Learning (IIsy)"
      where: "arXiv:2205.08824"
      role: canonical_implementation
      quote: "the model needs n feature tables and 1 decision table. Based on this general method...the entire mapping requires only two logical stages."
      quote_source: "IIsy/Planter §EB mapping (verbatim; cached at patterns/P-DecisionTreeInfer/grounding/iisy_automating_innetwork_ml.txt). Grounds the n-feature-table + 1-decision-table, two-logical-stage encoding behind no_loop / boundary_classification_fidelity; companion verbatim passages (feature-table slicing, DTEB ternary+default-action most-common label, RFEB voting table) cached alongside ground the default_class and vote_aggregation surfaces."
      quote_status: "DRAFT — pending GS2 human verdict"
      relevance: |
        The textbook encode-based (EB) mapping of a trained decision
        tree / random forest onto a match-action pipeline — the spine of
        every rule and invariant here. Retrieved and read this session
        (ar5iv HTML render). The clauses below bind directly on the
        pattern's structure:

          - Feature tables. "based on a well-trained model, feature space
            (e.g., two-dimensional space) is sliced into 6 areas … by 5
            partitions" — one *feature table* per input feature maps the
            feature value to an "area code" via (ternary) matches. This is
            the pattern's per-feature range/ternary encoding; the split
            boundaries the control plane installs ARE the trained tree's
            thresholds, which is why `boundary_classification_fidelity`
            (the ≤-vs-< tie-break) is the load-bearing invariant.

          - Decision (code) table. "The model stores the mapping from
            codes to labels in a decision (code) table … for the case of n
            dimensional feature space, the model needs n feature tables
            and 1 decision table." The composed code tuple is exact-matched
            to a leaf class — this is the pattern's class-resolution step
            and bounds the evaluation to a fixed number of logical stages
            ("only two logical pipeline stages regardless of tree depth"),
            grounding the `no_loop` / stage-bound invariant.

          - Planter refinement (described in the same paper). "Planter …
            adopts Ternary match in all feature tables, and uses default
            actions in a tree table to store the most common label." The
            decision-table default action storing the most-common label IS
            this pattern's `${default_class}` mechanism (an unmatched code
            tuple does not fault — it resolves to the default leaf).

          - Random forest. "the RFEB model groups the results of all DTEB
            constructing the forest as votes … A voting table then produces
            the final prediction from aggregated tree decisions." This is
            the `${ensemble_size} > 1` / `${vote_aggregation}` surface — a
            distinct mechanism (per-tree codes accumulated into per-class
            votes, then an arg-max / threshold) absent at the single-tree
            anchor.

          - Control plane. "The process starts with an input of a trained
            DT … the algorithm collects all the branches related to each
            feature"; feature boundaries become the feature-table match
            ranges and leaf memberships populate the decision table. This
            is the `${model_artifact}` → table-entries compile the seed
            performs; the data-plane program is model-agnostic.
      common_knowledge_baseline_used: |
        Concrete BMv2 / v1model bridging — emitting each per-feature code
        into a metadata field, concatenating the code tuple as the
        decision-table key, accumulating per-class vote counters in
        metadata for the forest arg-max, the `class_action` table that
        maps the leaf class to `mark_to_drop` / `egress_spec` / a DSCP
        write, and the `update_checksum` after a DSCP mark — is widely
        known P4-on-v1model practice rather than IIsy-cited, and is flagged
        `[common-knowledge baseline]` in `bridging_notes:`.

  rfcs: []                                                    # ML inference is a research / engineering NF with no IETF data-plane normative source.


# ─── Entities and state declarations ────────────────────────────────────────

entities:

  packet:
    notes: |
      Atomic; no per-packet or cross-packet state. Every classification
      derives from the current packet's `${feature_count}` header-derived
      feature fields, the ingress port, and the control-plane-installed
      model + class-action tables. The pattern is STATELESS — no `flow` /
      `window` rows are maintained. Per-packet header-feature inference is
      the IIsy model; flow-level / sliding-window feature accumulation
      (pForest / BoS) is stateful and out of scope (it composes with the
      P3 flow-tracking patterns), which is what keeps the oracle a pure
      `classify(features) -> class` function.

  inference_model:                                            # TPL `bucket` — aggregate state across a class of packets (the trained model compiled to table entries)
    type: bucket
    keyed_by_tuple: [feature_code_tuple]                      # the composed per-feature codes (per tree); resolves to a leaf class
    attrs:
      leaf_class:    int                                      # class label the matched code tuple resolves to
      tree_id:       int                                      # which ensemble member produced this code (0 for a single tree)
    capacity: ${model_capacity}
    populated_from: ${model_artifact}                         # the trained model: per-feature split boundaries + leaf-class map the seed compiles to entries
    notes: |
      The trained model compiled to match-action entries via the IIsy /
      Planter encode-based scheme: per-feature range/ternary split rows
      (feature tables) plus the code-tuple → leaf-class rows (decision
      table), replicated per tree for an ensemble. Control-plane installed.
      `${default_class}` is the decision table's default action (the
      most-common label) for an unmatched code tuple. The data-plane
      program is model-agnostic — it implements the encoding, not the
      specific tree.

  class_action_map:                                           # TPL `bucket` — per-class steering decision
    type: bucket
    keyed_by_tuple: [leaf_class]
    attrs:
      verdict:      "enum {forward, drop, mark}"              # which rule (R3/R1/R2) the resolved class fires
      egress_port:  port                                      # class egress port (forward + mark)
      mark_value:   "int | none"                              # DSCP/diffserv value stamped (mark only)
    capacity: ${num_classes}
    populated_from: ${class_action_entries}                   # class → action rows the seed installs
    notes: |
      The leaf-class → forwarding-action table. Control-plane installed
      (an operator policy: which classes forward where, which drop as the
      anomaly/malicious class, which get stamped). Separates the model
      (inference_model) from the policy (class_action_map) so the same
      model can drive different actions across instances.

# ─── Parameters ─────────────────────────────────────────────────────────────

parameters:

  model_artifact:
    type: list[tree_spec]
    constraint: |
      a list of ${ensemble_size} trees; each tree_spec is a set of
      decision nodes {feature_index ∈ [0, ${feature_count}), threshold:int,
      tie_break ∈ {le, lt}} and leaf nodes {leaf_class:int ∈
      [0, ${num_classes})}; every feature_index used is < ${feature_count};
      every threshold fits in ${feature_bit_width} bits; tree depth ≤
      ${tree_depth}. The compiled (feature_code_tuple → leaf_class) rows
      per tree are unique. A per-tree most-common-label default is declared
      for the decision-table default action.
    notes: |
      The trained model the seed binds — the data the instantiation step
      compiles into the per-feature split (feature) tables and the
      code-tuple → leaf-class (decision) table rows. Bound by the seed;
      carries no own operator (it is data, not a difficulty knob — the
      knobs are tree_depth / feature_count / ensemble_size / quantisation,
      each with its own operator). The parametric-source invariant
      holds: the oracle reads the splits from runtime state, never bakes
      them as source constants.

  class_action_entries:
    type: list[class_action_entry]
    constraint: |
      one entry per leaf class in use; each has leaf_class:int ∈
      [0, ${num_classes}); verdict ∈ {forward, drop, mark}; egress_port:int
      ∈ [1, 511] (required for forward/mark); mark_value:int ∈ [0, 63]
      (required iff verdict == mark, the 6-bit DSCP field, else none).
      verdict ∈ {drop} entries appear only when ${action_breadth} ∈
      {forward_drop, forward_drop_mark}; verdict ∈ {mark} entries only when
      ${action_breadth} == forward_drop_mark.
    notes: |
      The rows that populate `class_action_map`. Bound by the seed; the
      harness installs the corresponding class-action table at task start.

  num_classes:
    type: int
    range: "[2, 64]"
    default: 2
    notes: |
      Number of distinct leaf classes the model can emit (the model's label
      space). Anchor instances are binary (benign / anomaly). Coupled into
      the model_artifact and class_action_entries; not a standalone
      difficulty knob (the difficulty is tree/feature/ensemble structure).

  feature_count:
    type: int
    range: "[1, 8]"
    default: 2
    notes: |
      Number of header-derived input features — i.e. the number of feature
      tables in the encode-based mapping. More features means more feature
      tables to slice correctly and a wider composed code tuple, so
      `add_feature` hardens (feature-breadth axis). The seed's
      `${feature_set}` must list exactly this many fields.

  feature_set:
    type: list[header_field_ref]
    constraint: |
      length == ${feature_count}; each entry references a parseable header
      field usable as a classification feature (e.g. ipv4.totalLen,
      ipv4.protocol, ipv4.ttl, ipv4.diffserv, tcp.srcPort, tcp.dstPort,
      tcp.flags, udp.dstPort). Every referenced header is in the parser's
      reachable set.
    notes: |
      Which header fields the classifier reads as features. Bound by the
      seed. The instantiation step renders each into the corresponding
      quantised feature value the feature table keys on.

  feature_bit_width:
    type: int
    values: [4, 8, 12, 16]
    default: 8
    notes: |
      Bits each feature is quantised to before the feature-table lookup.
      Narrower widths bin more raw values together, so more packets land on
      a bin boundary and the SUT must reproduce the model's exact binning /
      rounding — a faithfulness surface. `coarsen_feature_quantisation`
      (narrow) hardens; `refine_feature_quantisation` (widen) eases.

  tree_depth:
    type: int
    range: "[1, 12]"
    default: 3
    notes: |
      Maximum depth of each tree — the number of split comparisons on a
      root-to-leaf path, and hence the number of distinct intervals each
      feature table may carry and the width of the composed code tuple.
      Deeper trees mean more feature-table rows and a larger decision
      table to encode without overlap/gap, raising the off-by-one /
      mis-encode risk. `deepen_tree_depth` hardens (capacity axis — the
      resource is encoding breadth / decision-table rows).

  ensemble_size:
    type: int
    range: "[1, 16]"
    default: 1
    notes: |
      Number of trees. `1` is a single decision tree (the anchor); `> 1` is
      a random forest and ACTIVATES the vote-aggregation mechanism — a
      distinct match-action stage absent at the anchor. `grow_ensemble`
      hardens (feature-breadth axis: it adds the per-tree-code accumulation
      + arg-max surface). When `> 1`, `${vote_aggregation}` is enforced.

  vote_aggregation:
    type: enum
    values: [majority, weighted_majority, sum_threshold]
    default: majority
    enforced_when: "${ensemble_size} > 1"
    notes: |
      How per-tree votes combine into the final class (forest only).
      `majority` is the plurality arg-max; `weighted_majority` weights each
      tree's vote; `sum_threshold` sums per-class scores against a cutoff.
      Coupled with `grow_ensemble` rather than carrying its own operator
      pair (it is only meaningful once an ensemble exists).

  default_class:
    type: "int | most_common"
    default: most_common
    notes: |
      The leaf class an unmatched code tuple resolves to — the IIsy/Planter
      decision-table default action (the most-common training label, or an
      explicit class). `most_common` mirrors the trained model;
      coupled into the faithfulness ladder rather than carrying its own
      operator pair. The `default_class_fallback` test pins that a table
      miss resolves deterministically rather than faulting.

  action_breadth:
    type: enum
    values: [forward_only, forward_drop, forward_drop_mark]
    default: forward_only
    notes: |
      Which class verdicts the seed's table exercises. `forward_only` is
      the anchor minimum (every class steers to a port — R3). `forward_drop`
      adds the anomaly/malicious drop class (R1). `forward_drop_mark` adds
      the DSCP-stamp action (R2) and its IPv4-checksum surface. Broader
      action sets add reachable rules and bug surfaces, so `broaden_class_action`
      hardens (feature-breadth axis).

  unclassified_action:
    type: enum
    values: [drop, forward_default]
    default: forward_default
    notes: |
      How a packet that lacks a required feature header (cannot be
      classified) is handled: `forward_default` steers it to
      `${default_egress_port}` (a passthrough), `drop` is closed-world
      default-deny. Coupled into the faithfulness ladder, not a standalone
      operator pair.

  default_egress_port:
    type: int
    range: "[1, 511]"
    enforced_when: "${unclassified_action} == forward_default"
    notes: |
      Egress port an unclassifiable packet is forwarded to under
      `${unclassified_action} == forward_default`. Bound by the seed.

  model_capacity:
    type: int | unbounded
    range: "[16, 1048576]"
    default: unbounded
    notes: |
      Maximum number of compiled model rows (feature-table + decision-table
      entries) the data plane supports. `shrink_model_capacity_4x` tightens
      it from the anchor's `unbounded`, forcing the SUT toward a compact
      encoding (e.g. ternary feature tables that fold many raw values per
      row) rather than a row-per-leaf table (capacity axis — distinct
      resource from `tree_depth`, which moves encoding breadth; both are
      capacity, so each carries its own harden/ease pair).

  workload_skew:
    type: enum
    values: [uniform, zipfian, adversarial]
    default: uniform
    notes: |
      Distribution of feature values in the G1 traffic tests. `uniform` is
      the anchor default. `zipfian` concentrates on a few hot classes.
      `adversarial` packs feature values that sit EXACTLY on split
      thresholds (the tie-break boundary) and at the `${feature_bit_width}`
      quantisation-bin edges, where a mis-encoded boundary mis-classifies.
      `raise_workload_skew` hardens (workload axis).

  faithfulness:
    type: enum
    values: [D5.0_anchor_single_tree, D5.1_deep_tree_drop, D5.2_random_forest, D5.3_adversarial_forest]
    default: D5.0_anchor_single_tree
    notes: |
      The faithfulness ladder for this pattern. D5.0 is a single shallow
      tree (depth 3, 2 features, forward-only, coarse-but-exact
      quantisation, uniform workload, explicit default class). D5.1 deepens
      the single tree, adds features, adds the drop class, and demands
      strict boundary fidelity. D5.2 adds the random-forest ensemble with
      vote aggregation and the mark action. D5.3 takes the full feature
      set, a deep forest, tight model capacity, and the adversarial
      on-boundary feature workload. `tighten_faithfulness` walks the ladder
      up; `loosen_faithfulness` walks it down (feature-breadth ladder).

# ─── Rules ──────────────────────────────────────────────────────────────────
# First-match semantics: the first rule whose `when` evaluates true on the
# incoming packet fires; subsequent rules are not evaluated for that packet.
#
# Shorthands used in the `when` clauses below:
#   has_features  := header_present(ipv4) ∧ ∀ f ∈ ${feature_set}: header_present(f.header)
#                    (every feature field's enclosing header parsed successfully)
#   features      := quantise(read(${feature_set}), ${feature_bit_width})
#   leaf_class    := infer(features, inference_model, ${ensemble_size},
#                          ${vote_aggregation}, ${default_class})
#                    -- the encode-based evaluation: per-feature range-table
#                       codes composed by the decision table (per tree),
#                       aggregated across the ensemble; resolves to
#                       ${default_class} when the composed code tuple is absent.
#   verdict       := class_action_map[leaf_class].verdict

rules:

  - id: R0_unclassifiable
    when: |
      ¬has_features
    then:
      - "forward(${default_egress_port}) if ${unclassified_action} == forward_default else drop"
    notes: |
      A packet that does not carry the required feature headers (e.g. a
      non-IPv4 frame, or a non-TCP packet when a TCP feature is configured)
      cannot be classified. It is handled per `${unclassified_action}` — a
      deterministic passthrough or drop — and the NF MUST NOT read the
      absent feature fields (that would be an unspecified-value read per
      P4-16 §8.25). `read_invalid_feature_guard` and the
      `feature_read_safety` invariant pin this.

  - id: R1_class_drop
    when: |
      has_features ∧ verdict == drop
    given:
      class_action_map: by_key(leaf_class)
    then:
      - drop
    notes: |
      The predicted class is the anomaly / malicious class (the
      drop verdict). The packet is dropped before any forwarding. Only
      reachable when `${action_breadth} ∈ {forward_drop, forward_drop_mark}`
      (the seed installs no drop-verdict classes otherwise). This is the
      D7-flavoured security use of in-network inference (drop traffic the
      model flags). `class_drop` exercises it.

  - id: R2_class_mark
    when: |
      has_features ∧ verdict == mark
    given:
      class_action_map: by_key(leaf_class)
    then:
      - "set(ipv4.diffserv, class_action_map.mark_value)"     # stamp the predicted class id into DSCP/diffserv
      - "set(ipv4.header_checksum, ipv4_checksum_recompute())"
      - forward(class_action_map.egress_port)
    notes: |
      The predicted class is stamped into the IPv4 DSCP/diffserv byte for a
      downstream consumer (a class-aware queue / collector), then the
      packet is forwarded. Because the IPv4 header changed, the IPv4 header
      checksum MUST be recomputed — the #1 silent failure (`checksum_after_mark`,
      `envelope_checksum_validity`). The PAYLOAD is untouched
      (`payload_persistence`). Only reachable when `${action_breadth} ==
      forward_drop_mark`.

  - id: R3_class_forward
    when: |
      has_features ∧ verdict == forward
    given:
      class_action_map: by_key(leaf_class)
    then:
      - forward(class_action_map.egress_port)
    notes: |
      The anchor-band action: the predicted class steers the packet to its
      class egress port (e.g. a per-class queue / next hop). No header is
      rewritten — the inference NF is a pure classifier-steerer here, so
      the whole packet (headers + payload) round-trips byte-for-byte
      (`payload_persistence`). This is the default verdict for every class
      at the `forward_only` anchor. Bridge anti-patterns: keying the
      decision on a per-packet-varying field instead of the configured
      features (`inference_determinism`); mis-encoding a split boundary
      so an on-threshold feature value steers to the wrong port
      (`boundary_classification_fidelity`).

# ─── Invariants (six canonical clauses) ─────────────────────────────────────

invariants:

  - id: no_loop
    clause: no_loop
    target: any_packet
    notes: |
      No packet recirculates indefinitely. The encode-based evaluation is a
      FIXED number of logical stages regardless of tree depth — one lookup
      per feature table, one decision-table lookup per tree, and one vote-
      aggregation stage (forest) — and every rule is a single-pass forward
      or drop. There is no recirculation. This pins the IIsy "two logical
      stages regardless of tree depth" property: an implementation that tries to
      walk the tree node-by-node via recirculation (the naive host-side
      transliteration) violates the bound; the encode-based mapping does
      not.

  - id: inference_determinism
    clause: stability
    target: "(leaf_class, forward_decision)"
    while: "has_features"
    notes: |
      Stable classification: two packets with identical quantised feature
      values always produce the same leaf class and the same forwarding
      action. The model is a PURE function of the configured features — no
      per-packet register state, no dependence on a per-packet-varying
      field (transaction id, source port when not a feature, arrival
      order). Bridge anti-pattern: folding a non-feature field into the
      code tuple, or a non-deterministic arg-max tie-break in the forest
      vote — either splits one logical feature vector across classes.
      `inference_determinism_repeat` witnesses it.

  - id: boundary_classification_fidelity
    clause: stability
    target: leaf_class
    while: "has_features ∧ ∃ f ∈ ${feature_set}: read(f) is on a split threshold of inference_model"
    notes: |
      THE headline invariant. A feature value sitting EXACTLY on a trained
      split threshold is classified per the model's documented tie-break
      (`le`: x ≤ t goes the left/low branch; `lt`: x < t does) — and the
      data-plane range/ternary feature-table encoding must reproduce that
      tie-break exactly. An off-by-one in the interval bounds (≤ encoded as
      <, or overlapping/gapped split intervals) silently mis-classifies the
      boundary packet while every off-boundary packet still classifies
      "correctly", so the bug hides until a boundary input. The #1 silent
      misclassification for encode-based inference. `feature_boundary_value`
      and the adversarial workload enumerate it.

  - id: payload_persistence
    clause: persistence
    target: "(packet_headers_except_diffserv, payload)"
    while: "(R2 ∨ R3 ∨ R0-forward) fires"
    free_under: ["ipv4.diffserv under R2 (the class mark)"]
    notes: |
      On every forwarded (non-dropped) packet the headers and payload are
      delivered byte-for-byte identical to what arrived, EXCEPT the IPv4
      DSCP/diffserv byte under the R2 mark action. The inference NF
      classifies-and-steers (and optionally stamps one byte) — it does not
      rewrite or truncate the packet. Pins the conditional-deparser surface:
      an implementation that drops, reorders, or fixed-width-pads a parsed header
      corrupts the steered packet even though forwarding "works".
      `conditional_deparser_roundtrip` enumerates it.

  - id: envelope_checksum_validity
    clause: stability
    target: ipv4.header_checksum
    while: "R2 fires ∧ egress(packet)"
    notes: |
      Every marked packet carries a valid IPv4 header checksum on egress,
      recomputed after the DSCP/diffserv write. Omitting `update_checksum`
      after a header-field edit is the #1 silent failure in the v1model
      bug catalogue: BMv2 emits a stale checksum the downstream
      NIC / kernel silently drops. `checksum_after_mark` catches it.

  - id: feature_read_safety
    clause: stability
    target: forward_decision
    while: "¬has_features"
    notes: |
      A packet missing a required feature header produces a DETERMINISTIC
      decision (`unclassified_action`) and NEVER reads a feature field from
      an absent / invalid header (an unspecified-value read per P4-16
      §8.25 / the bug-taxonomy "read from invalid header"). Pins that the
      classifier degrades gracefully rather than classifying on garbage
      bytes. `read_invalid_feature_guard` witnesses it.

# ─── Test scaffolding ───────────────────────────────────────────────────────
# Materialised into task.yaml::test_cases at instantiation, following the
# G1/G2/G3 test-generation rules and the v1model bug taxonomy for
# per-entry materialisation.

test_scaffolding:

  G1:
    - id: dt_classify_golden
      generate: |
        Install a model whose splits map a specific feature vector to a
        known leaf class C with class_action verdict=forward, egress_port=P.
        Send a packet whose feature fields produce that vector. Assert it is
        forwarded on P, with all headers and payload byte-for-byte
        unchanged. (Anchor — the golden inference path, G1-P1-T1.)

    - id: dt_classify_two_classes
      generate: |
        Install a model and class_action_map that map two distinct feature
        vectors to two different classes → two different egress ports. Send
        one packet for each. Assert each is steered to its class's port.
        Confirms the classifier actually evaluates the configured features
        rather than steering on a constant. (G1-P1-T1 per-class coverage.)

    - id: dt_default_class_fallback
      generate: |
        Send a packet whose feature vector corresponds to NO installed
        decision-table code tuple. Assert it resolves to `${default_class}`
        (the most-common-label default) and takes that class's action —
        deterministically, never a table-miss fault or a forward on
        uninitialised metadata. (Pins the IIsy/Planter default-action
        mechanism; G1 state/branch coverage.)

    - id: dt_random_forest_vote
      requires: "${ensemble_size} > 1"
      generate: |
        Install a forest where the trees DISAGREE on a crafted feature
        vector (e.g. 2 trees vote class A, 1 votes class B). Send that
        packet. Assert the aggregated verdict is the `${vote_aggregation}`
        winner (majority → A). Forces the SUT to accumulate per-tree votes
        and apply the arg-max / threshold, not just read one tree.
        (Ensemble-aggregation branch; IIsy RFEB voting.)

    - id: dt_mark_class
      requires: "${action_breadth} == forward_drop_mark"
      generate: |
        Send a packet that classifies to a mark-verdict class with
        mark_value=V. Assert the egress packet has ipv4.diffserv=V, a valid
        recomputed IPv4 header checksum, the same egress port, and the
        payload byte-for-byte preserved. (R2 path; G1-P1-T3/T5
        transformation assertions.)

  G2:
    - id: feature_boundary_value
      generate: |
        Send packets whose feature value is EXACTLY a trained split
        threshold t (and t±1). Assert each is classified per the model's
        documented tie-break (le: ≤t low; lt: <t low) — the on-threshold
        packet must match the oracle, not an off-by-one neighbour. (The
        boundary the encode-based interval table must reproduce; pins
        `boundary_classification_fidelity`; the #1 silent misclassification.)

    - id: feature_at_bit_width_max
      generate: |
        Send a packet whose feature value is the maximum representable at
        `${feature_bit_width}` (all-ones). Assert it quantises and
        classifies without wrap/overflow into a wrong bin. (Boundary;
        feature-quantisation edge.)

    - id: unclassifiable_missing_header
      generate: |
        Send a packet missing a required feature header (e.g. a non-IPv4
        frame, or a UDP packet when a TCP-port feature is configured).
        Assert it takes `${unclassified_action}` (drop, or forward to
        `${default_egress_port}`) deterministically, with no read of the
        absent feature fields. (G2 malformed/edge input; pins
        `feature_read_safety`.)

  G3:
    - id: inference_determinism_repeat
      generate: |
        Send the SAME feature vector in N (≥3) packets, optionally varying
        a NON-feature field (IP id, payload bytes). Assert every packet
        gets the identical class and egress port — no flap. Catches a
        implementation that folds a per-packet-varying field into the code tuple or
        uses a non-deterministic forest tie-break. (Pins
        `inference_determinism`; G3 stability probe.)

    - id: read_invalid_feature_guard
      generate: |
        Send (a) a non-IPv4 frame and (b) an IPv4 packet whose configured
        feature lives in an absent upper-layer header (e.g. tcp.dstPort
        feature but the packet is ICMP). Assert the NF does NOT classify on
        or forward based on unspecified feature bytes — it takes
        `${unclassified_action}`. (P4-16 §8.25 unspecified-value read; bug
        taxonomy "read from invalid header".)

    - id: conditional_deparser_roundtrip
      generate: |
        Send a forward-classified packet with a distinctive payload. Assert
        the egress byte layout is exactly the input headers (DSCP unchanged
        under forward; only DSCP changed under mark) followed by the
        payload byte-for-byte — no header dropped, duplicated, reordered,
        or fixed-width-padded. Catches the common v1model conditional-deparser bug
        (emitting parsed headers unconditionally / out of order — the
        dominant silent failure).

    - id: checksum_after_mark
      requires: "${action_breadth} == forward_drop_mark"
      generate: |
        Same setup as `dt_mark_class`. After R2 writes ipv4.diffserv,
        recompute the IPv4 header checksum over the 20-byte header from the
        egress bytes and assert it matches. Catches the implementation that edits
        DSCP but forgets the checksum recompute — the #1 silent failure in
        the v1model bug catalogue.

    - id: class_drop
      requires: "${action_breadth} ∈ {forward_drop, forward_drop_mark}"
      generate: |
        Install a drop-verdict (anomaly) class. Send a packet that
        classifies to it; assert drop. Then send a packet that classifies
        to a forward class; assert it still forwards (the drop is
        class-scoped, not a blanket deny). (In-network-inference security
        use, R1; G3 default-deny.)

  coverage_floor:
    G1: 3
    G2: 1
    G3: 1

# ─── Mutation operators ─────────────────────────────────────────────────────
# Nine harden operators paired with nine ease counterparts; every operator
# declares `direction` so difficulty recalibration by parameter rebinding can pick
# from the matching pool depending on whether r > r* + δ (harden) or
# r < r* − δ (ease). Every harden has an ease counterpart on the SAME axis.

mutation_operators:

  - id: deepen_tree_depth
    applicable_when: "${tree_depth} < 12"
    effect: "${tree_depth} ← min(${tree_depth} * 2, 12)"
    axis: capacity
    direction: harden
    feasibility_postcondition: "${tree_depth} ≤ 12 ∧ ${tree_depth} ≥ 1"
    kind: parameter
    notes: |
      Deepen each tree — more split comparisons per path, more feature-table
      intervals and a wider composed code tuple to encode without overlap or
      gap. The encoding breadth is a structural resource, so this moves the
      `capacity` axis (the specific resource is decision-table / interval
      breadth). Raises the off-by-one and mis-encode risk; activates more
      `feature_boundary_value` boundaries.

  - id: shallow_tree_depth
    applicable_when: "${tree_depth} > 1"
    effect: "${tree_depth} ← max(${tree_depth} / 2, 1)"
    axis: capacity
    direction: ease
    feasibility_postcondition: "${tree_depth} ≥ 1 ∧ ${tree_depth} ≤ 12"
    kind: parameter
    notes: |
      Paired ease counterpart of `deepen_tree_depth`. Halves (not quarters)
      the depth so the harden/ease asymmetry gives difficulty recalibration a
      slower climb back to the target difficulty after an over-deepen.

  - id: add_feature
    applicable_when: "${feature_count} < 8"
    effect: "${feature_count} ← ${feature_count} + 1   (and extend ${feature_set} by one parseable field)"
    axis: feature-breadth
    direction: harden
    feasibility_postcondition: "${feature_count} ≤ 8 ∧ len(${feature_set}) == ${feature_count}"
    kind: parameter
    notes: |
      Add an input feature — one more feature table to slice correctly and
      a wider code tuple to compose. feature-breadth axis (more of the
      model's input surface must be implemented).

  - id: drop_feature
    applicable_when: "${feature_count} > 1"
    effect: "${feature_count} ← ${feature_count} - 1   (and drop the last field from ${feature_set})"
    axis: feature-breadth
    direction: ease
    feasibility_postcondition: "${feature_count} ≥ 1 ∧ len(${feature_set}) == ${feature_count}"
    kind: parameter
    notes: |
      Paired ease counterpart of `add_feature`.

  - id: grow_ensemble
    applicable_when: "${ensemble_size} < 16"
    effect: "${ensemble_size} ← min(${ensemble_size} * 2, 16)   (single tree → forest; enforce ${vote_aggregation})"
    axis: feature-breadth
    direction: harden
    feasibility_postcondition: "${ensemble_size} ≤ 16 ∧ (${ensemble_size} == 1 ∨ ${vote_aggregation} ∈ {majority, weighted_majority, sum_threshold})"
    kind: parameter
    notes: |
      Grow the ensemble from a single tree toward a random forest. Crossing
      from 1 to >1 ACTIVATES the vote-aggregation mechanism (per-tree code
      accumulation + arg-max / threshold) — a distinct match-action stage,
      and the `dt_random_forest_vote` test. feature-breadth axis (adds a new
      mechanism the task must implement).

  - id: shrink_ensemble
    applicable_when: "${ensemble_size} > 1"
    effect: "${ensemble_size} ← max(${ensemble_size} / 2, 1)"
    axis: feature-breadth
    direction: ease
    feasibility_postcondition: "${ensemble_size} ≥ 1 ∧ ${ensemble_size} ≤ 16"
    kind: parameter
    notes: |
      Paired ease counterpart of `grow_ensemble`. Dropping to 1 removes the
      voting stage and skips `dt_random_forest_vote`.

  - id: coarsen_feature_quantisation
    applicable_when: "${feature_bit_width} > 4"
    effect: "${feature_bit_width} ← prev_width(${feature_bit_width})"     # 16 → 12 → 8 → 4
    axis: faithfulness
    direction: harden
    feasibility_postcondition: "${feature_bit_width} ∈ {4, 8, 12}"
    kind: parameter
    notes: |
      Narrow the feature quantisation. Coarser bins put MORE raw values on
      a bin boundary, so the SUT must reproduce the model's exact binning /
      rounding to classify those packets correctly — a fidelity (not
      breadth) surface. faithfulness axis (exact↔approximate computation of
      the quantised feature).

  - id: refine_feature_quantisation
    applicable_when: "${feature_bit_width} < 16"
    effect: "${feature_bit_width} ← next_width(${feature_bit_width})"     # 4 → 8 → 12 → 16
    axis: faithfulness
    direction: ease
    feasibility_postcondition: "${feature_bit_width} ∈ {8, 12, 16}"
    kind: parameter
    notes: |
      Paired ease counterpart of `coarsen_feature_quantisation`. Finer bins
      put fewer values on a boundary, easing the binning-fidelity demand.

  - id: broaden_class_action
    applicable_when: "${action_breadth} ∈ {forward_only, forward_drop}"
    effect: "${action_breadth} ← next_action_breadth(${action_breadth})"  # forward_only → forward_drop → forward_drop_mark
    axis: feature-breadth
    direction: harden
    feasibility_postcondition: "${action_breadth} ∈ {forward_drop, forward_drop_mark}"
    kind: parameter
    notes: |
      Add reachable class verdicts: forward_drop activates R1 (the
      anomaly-drop class and `class_drop`), forward_drop_mark activates R2
      (the DSCP-mark action and its checksum surface via
      `checksum_after_mark`). feature-breadth axis.

  - id: narrow_class_action
    applicable_when: "${action_breadth} ∈ {forward_drop, forward_drop_mark}"
    effect: "${action_breadth} ← prev_action_breadth(${action_breadth})"
    axis: feature-breadth
    direction: ease
    feasibility_postcondition: "${action_breadth} ∈ {forward_only, forward_drop}"
    kind: parameter
    notes: |
      Paired ease counterpart of `broaden_class_action`. Removes the
      most-recently-added verdict and skips its `requires:`-guarded tests.

  - id: shrink_model_capacity_4x
    applicable_when: "${model_capacity} ≠ unbounded ∧ ${model_capacity} > 64"
    effect: "${model_capacity} ← ${model_capacity} / 4"
    axis: capacity
    direction: harden
    feasibility_postcondition: "${model_capacity} ≥ 16"
    kind: parameter
    notes: |
      Tighten the compiled-model table budget. The SUT cannot rely on a
      row-per-leaf table and must adopt a compact ternary encoding that
      folds many raw values per feature-table row. capacity axis. (Distinct
      resource from `deepen_tree_depth`, which moves encoding breadth — both
      capacity but on disjoint resources, so each carries its own pair.)

  - id: enlarge_model_capacity_2x
    applicable_when: "${model_capacity} ≠ unbounded ∧ ${model_capacity} < 1048576"
    effect: "${model_capacity} ← ${model_capacity} * 2"
    axis: capacity
    direction: ease
    feasibility_postcondition: "${model_capacity} ≤ 1048576"
    kind: parameter
    notes: |
      Paired ease counterpart of `shrink_model_capacity_4x`. Doubles (not
      quadruples) for a slow climb back into band after an over-shrink.

  - id: raise_workload_skew
    applicable_when: "${workload_skew} ∈ {uniform, zipfian}"
    effect: "${workload_skew} ← next_skew(${workload_skew})"              # uniform → zipfian → adversarial
    axis: workload
    direction: harden
    feasibility_postcondition: "${workload_skew} ∈ {zipfian, adversarial}"
    kind: parameter
    notes: |
      Raise the feature-value distribution skew. `adversarial` packs values
      sitting exactly on split thresholds and quantisation-bin edges, where
      a mis-encoded boundary mis-classifies — combined with coarse
      quantisation this drives the classifier toward boundary errors.
      workload axis.

  - id: lower_workload_skew
    applicable_when: "${workload_skew} ∈ {zipfian, adversarial}"
    effect: "${workload_skew} ← prev_skew(${workload_skew})"
    axis: workload
    direction: ease
    feasibility_postcondition: "${workload_skew} ∈ {uniform, zipfian}"
    kind: parameter
    notes: |
      Paired ease counterpart of `raise_workload_skew`.

  - id: tighten_faithfulness
    applicable_when: |
      ${faithfulness} ∈ {D5.0_anchor_single_tree, D5.1_deep_tree_drop, D5.2_random_forest}
    effect: |
      ${faithfulness} ← next_band(${faithfulness}) ∧
      ( if ${faithfulness}_post == D5.1_deep_tree_drop then
          ${tree_depth} ← 6 ∧ ${feature_count} ← 4 ∧
          ${action_breadth} ← forward_drop ∧ ${workload_skew} ← zipfian ) ∧
      ( if ${faithfulness}_post == D5.2_random_forest then
          ${ensemble_size} ← 4 ∧ ${vote_aggregation} ← majority ∧
          ${action_breadth} ← forward_drop_mark ) ∧
      ( if ${faithfulness}_post == D5.3_adversarial_forest then
          ${ensemble_size} ← 8 ∧ ${feature_count} ← 6 ∧
          ${feature_bit_width} ← 4 ∧ ${workload_skew} ← adversarial )
    axis: feature-breadth
    direction: harden
    feasibility_postcondition: |
      ${faithfulness} ≠ D5.0_anchor_single_tree ∧
      ( ${faithfulness} ≠ D5.1_deep_tree_drop
        ∨ ∃ entry ∈ ${class_action_entries}: entry.verdict == drop ) ∧
      ( ${faithfulness} ≠ D5.2_random_forest
        ∨ ( ${ensemble_size} > 1 ∧
            ∃ entry ∈ ${class_action_entries}: entry.verdict == mark ) )
    kind: parameter
    notes: |
      Lift the faithfulness ladder one band. D5.0 → D5.1 deepens the single
      tree, adds features, adds the drop class. D5.1 → D5.2 adds the
      ensemble + voting and the mark action. D5.2 → D5.3 takes the full
      feature set, a deep forest, coarse quantisation, and the adversarial
      on-boundary workload. Couples several knobs per step, so its
      `feasibility_postcondition` requires the drop/mark rows and the
      ensemble to exist before the bands that need them.

  - id: loosen_faithfulness
    applicable_when: |
      ${faithfulness} ∈ {D5.1_deep_tree_drop, D5.2_random_forest, D5.3_adversarial_forest}
    effect: |
      ${faithfulness} ← prev_band(${faithfulness}) ∧
      ( if ${faithfulness}_post == D5.0_anchor_single_tree then
          ${tree_depth} ← 3 ∧ ${feature_count} ← 2 ∧ ${ensemble_size} ← 1 ∧
          ${feature_bit_width} ← 8 ∧ ${action_breadth} ← forward_only ∧
          ${workload_skew} ← uniform ) ∧
      ( if ${faithfulness}_post == D5.1_deep_tree_drop then
          ${ensemble_size} ← 1 ∧ ${action_breadth} ← forward_drop ∧
          ${feature_bit_width} ← 8 ∧ ${workload_skew} ← zipfian ) ∧
      ( if ${faithfulness}_post == D5.2_random_forest then
          ${feature_count} ← 4 ∧ ${feature_bit_width} ← 8 ∧
          ${workload_skew} ← uniform )
    axis: feature-breadth
    direction: ease
    feasibility_postcondition: |
      ${faithfulness} ≠ D5.3_adversarial_forest
    kind: parameter
    notes: |
      Paired ease counterpart of `tighten_faithfulness`. Steps the ladder
      back one band and reverts the entailed parameter bindings.

  - id: ladder_input_form_to_python_ref
    applicable_when: "'python_reference_impl' ∉ task.description"
    effect: |
      Append the Python oracle source (the encode-based classify(features)
      reference) to task.description so the SUT sees a host-side reference
      implementation in addition to the behavioural spec — the heaviest
      hammer among the difficulty axes.
    axis: input-form
    direction: ease
    feasibility_postcondition: "'python_reference_impl' ∈ task.description"
    kind: rule
    notes: |
      From the starter operator library — laddering the input form from
      behavioural spec to host-side reference EASES the SUT's job (it has a
      Python tree walk to transliterate rather than redesign the encode-
      based mapping from scratch). For a `relocate` ML task this is the
      sharpest probe of the relocate failure mode: if the SUT still fails the compile gate WITH
      the algorithm supplied, the bottleneck is the P4 encoding, not the
      model. Used sparingly; pairs with the harden revert below.

  - id: revert_input_form_to_behavioural
    applicable_when: "'python_reference_impl' ∈ task.description"
    effect: "Strip the appended Python oracle source from task.description, leaving only the behavioural spec."
    axis: input-form
    direction: harden
    feasibility_postcondition: "'python_reference_impl' ∉ task.description"
    kind: rule
    notes: |
      Paired harden counterpart of `ladder_input_form_to_python_ref`. The
      SUT must redesign the encode-based mapping from the behavioural spec
      alone.

# ─── Implementation notes (advisory; not LLM-visible) ───────────────────────

bridging_notes: |
  Common implementations of this pattern in v1model P4 (every entry below is
  `[common-knowledge baseline]` rather than IIsy-cited):

    Anchor band (D5.0_anchor_single_tree, ensemble_size=1, feature_count=2,
                 tree_depth=3, feature_bit_width=8, action_breadth=
                 forward_only, unclassified_action=forward_default):
      - Parser: ethernet → (etherType==0x0800 ? ipv4 : accept) →
        (ipv4.protocol selects tcp/udp if a transport feature is used).
        Feature fields are read straight from the parsed headers; no
        variable-length parse (contrast P-DNSLoadBalancer).
      - Encode-based mapping (IIsy/Planter EB): one ternary/range
        match-action FEATURE TABLE per feature, keyed on the (optionally
        quantised) feature field, whose action writes a small per-feature
        `code` into a metadata field. The control plane installs the
        trained split boundaries as the ternary ranges. Then one exact
        DECISION TABLE keyed on the concatenated code tuple, whose action
        sets the leaf class id; its `default_action` writes the
        most-common-label `${default_class}` (so a code-tuple miss does NOT
        fault). Finally a CLASS-ACTION table keyed on the class id →
        {mark_to_drop (drop), egress_spec=port (forward), set diffserv +
        update_checksum + egress_spec (mark)}.
      - The whole evaluation is a fixed handful of logical stages
        regardless of tree depth — the IIsy "two logical stages" property.
        Do NOT walk the tree node-by-node with recirculation (the naive
        host-side transliteration) — that breaks the `no_loop` stage bound.
      - Deparser: emit ethernet, ipv4 (and transport), then the payload —
        all headers re-emitted in order, only ipv4.diffserv possibly
        changed (mark). The packet round-trips otherwise byte-for-byte.

    D5.1 (deep_tree_drop): deeper single tree (more feature-table
    intervals + a wider code tuple), more features (more feature tables),
    and a drop-verdict (anomaly) class wired to mark_to_drop.

    D5.2 (random_forest): replicate the (feature tables + decision table)
    per tree, accumulate per-class vote counters in metadata across the
    trees, and a final voting table / arg-max selects the class
    (`${vote_aggregation}`). Add the mark action with update_checksum.

    D5.3 (adversarial_forest): full feature set, deep forest, coarse
    (4-bit) quantisation, tight model_capacity (a compact ternary
    encoding), and the adversarial on-boundary workload that stresses the
    split-boundary tie-break and the quantisation-bin edges together.

  Anti-pattern implementations to reject during reference review:

    * Mis-encoding a split boundary — encoding x ≤ t as x < t (or
      overlapping / gapped feature-table intervals) — so an on-threshold
      feature value classifies to the wrong leaf. The #1 silent
      misclassification; `feature_boundary_value` +
      `boundary_classification_fidelity` catch it.

    * Omitting the decision-table `default_action` — a code tuple with no
      installed row table-misses and the leaf-class metadata is read
      uninitialised. The most-common-label default
      (`dt_default_class_fallback`) must be installed.

    * Walking the tree node-by-node via recirculation/resubmit instead of
      the encode-based mapping — breaks the `no_loop` fixed-stage bound and
      typically does not fit the pipeline. The encode-based feature-table →
      decision-table form is the data-plane redesign.

    * Folding a non-feature, per-packet-varying field (IP id, a non-feature
      port) into the code tuple, or a non-deterministic forest tie-break —
      splits one logical feature vector across classes.
      `inference_determinism_repeat` catches it.

    * Forgetting `update_checksum` for ipv4 after the DSCP/diffserv mark —
      BMv2 emits a stale checksum the downstream silently drops.
      `checksum_after_mark` + `envelope_checksum_validity` catch it.

    * Reading a feature field from an absent header (e.g. tcp.dstPort on an
      ICMP packet) without a `header_present` guard — an unspecified-value
      read. `read_invalid_feature_guard` + `feature_read_safety` catch it.

    * Re-emitting a fixed-length / truncated packet instead of the parsed
      headers + payload — corrupts the steered packet even though
      forwarding "works". `conditional_deparser_roundtrip` +
      `payload_persistence` catch it.

  v2-deferred (out of scope for this pattern, noted for reviewers):
    * Flow-level / sliding-window feature extraction (pForest's per-flow
      feature accumulation, BoS's RNN window flattening) is STATEFUL and
      composes transitively with the P3 flow-tracking patterns rather than
      being re-encoded here — this pattern is per-packet header-feature
      inference (the IIsy model).
    * Sequential / RNN models (BoS) and gradient-boosted regression
      (continuous output) are separate patterns; this one is the
      classification decision-tree / random-forest line (NF-4a / K1).
    * Floating-point feature arithmetic is out of scope (v1model is
      integer); features are integer header fields quantised to
      `${feature_bit_width}` bits.
